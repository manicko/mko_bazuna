<div class="relative inline-block" id="lang-switcher">

<script>
(function() {
    'use strict';

    const COOKIE_NAME = 'lang_pref';
    const COOKIE_PATH = '/';
    const COOKIE_MAX_AGE = 365 * 24 * 60 * 60; // 1 year in seconds
    const container = document.getElementById('lang-switcher');
    if (!container) return;

    const toggleBtn = container.querySelector('[data-lang-switcher-toggle]');
    const menu = container.querySelector('[data-lang-switcher-menu]');
    const links = container.querySelectorAll('[data-lang-switcher-link]');

    /**
     * Set a cookie with the given name, value, and options.
     */
    function setCookie(name, value, maxAge, path) {
        var parts = [
            encodeURIComponent(name) + '=' + encodeURIComponent(value),
            'max-age=' + maxAge,
            'path=' + path,
            'SameSite=Lax'
        ];
        document.cookie = parts.join('; ');
    }

    /**
     * Toggle dropdown visibility.
     */
    function toggleDropdown() {
        var isHidden = menu.classList.contains('hidden');
        if (isHidden) {
            menu.classList.remove('hidden');
            toggleBtn.setAttribute('aria-expanded', 'true');
        } else {
            menu.classList.add('hidden');
            toggleBtn.setAttribute('aria-expanded', 'false');
        }
    }

    /**
     * Close dropdown and reset ARIA state.
     */
    function closeDropdown() {
        menu.classList.add('hidden');
        toggleBtn.setAttribute('aria-expanded', 'false');
    }

    // Toggle on button click
    toggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleDropdown();
    });

    // On language link click: set cookie, then allow default navigation
    links.forEach(function(link) {
        link.addEventListener('click', function(e) {
            var lang = link.getAttribute('data-lang');
            if (lang) {
                setCookie(COOKIE_NAME, lang, COOKIE_MAX_AGE, COOKIE_PATH);
            }
            // Allow default browser navigation (href carries ?lang=X)
            closeDropdown();
        });
    });

    // Close dropdown on click outside
    document.addEventListener('click', function(e) {
        if (!container.contains(e.target)) {
            closeDropdown();
        }
    });

    // Close dropdown on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeDropdown();
            toggleBtn.focus();
        }
    });
})();
</script>

    <script>
        (function () {
            const dropdown = document.getElementById('autocomplete-dropdown');
            const input = document.getElementById('search-input');
            if (!dropdown || !input) return;

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function parseJson(str) {
                try { return JSON.parse(str); } catch (_) { return null; }
            }

            function hide() {
                dropdown.classList.add('hidden');
                dropdown.innerHTML = '';
            }

            function render(json) {
                const suggestions = (json && Array.isArray(json.suggestions)) ? json.suggestions : [];
                if (!suggestions.length) { hide(); return; }
                const html = suggestions.map(function (s) {
                    const text = escapeHtml(s.text || '');
                    const encoded = encodeURIComponent(s.text || '');
                    const src = s.source ? ' (' + escapeHtml(s.source) + ')' : '';
                    return '<li><a href="/search/?q=' + encoded +
                           '" class="block w-full px-3 py-2 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">' +
                           text + src + '</a></li>';
                }).join('');
                dropdown.innerHTML = html;
                dropdown.classList.remove('hidden');
            }

            document.body.addEventListener('htmx:afterRequest', function (e) {
                const detail = e.detail || {};
                if (detail.target !== dropdown) return;
                const xhr = detail.xhr;
                if (!xhr) return;
                if (xhr.status === 429) { hide(); return; }
                const parsed = parseJson(xhr.responseText);
                if (!parsed || parsed.error === 'rate_limit') { hide(); return; }
                render(parsed);
            });

            input.addEventListener('keydown', function (e) {
                const items = dropdown.querySelectorAll('li a');
                if (e.key === 'Escape') { hide(); e.preventDefault(); return; }
                if (!items.length) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    const active = document.activeElement;
                    const idx = Array.from(items).indexOf(active);
                    const next = (idx < 0 || idx === items.length - 1) ? items[0] : items[idx + 1];
                    next.focus();
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const active = document.activeElement;
                    const idx = Array.from(items).indexOf(active);
                    const prev = (idx <= 0) ? items[items.length - 1] : items[idx - 1];
                    prev.focus();
                }
                if (e.key === 'Enter') {
                    e.preventDefault();
                    window.location.href = items[0].href;
                }
            });

            hide();
        })();
    </script>
