# Base docker-compose.yml for Mko Bazuna
# Services: db, migrate, web, bot, nginx
# Static served by whitenoise in image; media served by nginx from media_volume

services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uv run python -c "from apps.core.utils.migrate_locked import main; import sys; sys.exit(main())"
    depends_on:
      db:
        condition: service_healthy
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/postgres}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-placeholder}
    env_file:
      - .env
    # One-shot service: runs migrations with advisory lock (ID 100), then exits
    # Idempotent: advisory lock prevents concurrent runs

  create_admin:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: >
      uv run python src/backend/manage.py create_admin_user
      --username "${ADMIN_USERNAME:-admin}"
      --password "${ADMIN_PASSWORD}"
      --telegram-id "${ADMIN_TELEGRAM_ID:--1}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file:
      - .env
    # One-shot service: runs once, then exits
    # Skipped if ADMIN_PASSWORD not set (empty string)

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    restart: unless-stopped
    # Port 8000 NOT published - nginx proxies internally

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m telegram_bot.main
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media_volume:/media_volume:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume: