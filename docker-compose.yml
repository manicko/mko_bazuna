# Base docker-compose.yml for Mko Bazuna
# Services: db, redis, migrate, web, bot, nginx, create_admin
# Static served by whitenoise in image; media served by nginx from media_volume

services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: bash -c "python -c 'from apps.core.utils.migrate_locked import main; import sys; sys.exit(main())' && python src/backend/manage.py setup_search_triggers && python src/backend/manage.py load_exchange_rates"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      BOT_TOKEN: ${BOT_TOKEN}
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/app/src/.env:ro
    # One-shot service: runs migrations with advisory lock (ID 100), then exits
    # Idempotent: advisory lock prevents concurrent runs

  load_catalog:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: /app/entrypoint-catalog.sh
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/app/src/.env:ro
    # One-shot service: loads categories.yaml into DB, then exits
    # Depends on migrate completing successfully

  create_admin:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: /app/entrypoint-create-admin.sh
    depends_on:
      load_catalog:
        condition: service_completed_successfully
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:--1}
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/app/src/.env:ro
    # One-shot service: runs once, then exits
    # Skipped if ADMIN_PASSWORD not set (empty string)

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: /app/entrypoint-seed.sh
    profiles:
      - seed
    depends_on:
      load_catalog:
        condition: service_completed_successfully
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SEED_USERS=${SEED_USERS:-10}
      - SEED_ADS=${SEED_ADS:-600}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/app/src/.env:ro
      - media_volume:/app/media
    # One-shot service: run with `docker compose --profile seed run --rm seed`
    # Seeds database with demo data, then exits

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    depends_on:
      load_catalog:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/app/src/.env:ro
      - media_volume:/app/media
    restart: unless-stopped
    # Port 8000 NOT published - nginx proxies internally

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m telegram_bot.main
    depends_on:
      load_catalog:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/app/src/.env:ro
      - media_volume:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media_volume:/media_volume:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
