# Base docker-compose.yml for Mko Bazuna
# Services: db, redis, migrate, load_cities, load_catalog, create_admin, web, bot, nginx, seed
# Static served by whitenoise in image; media served by nginx from media_volume

services:
  db:
    image: postgres:18-alpine
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-2.0}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    user: redis
    command: redis-server --save "" --appendonly no --dir /tmp
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: bash -c "python src/backend/manage.py bootstrap_reference_data"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      BOT_TOKEN: ${BOT_TOKEN}
      DJANGO_BUILD: "1"
    env_file:
      - .env.dev
    volumes:
      - ./.env.dev:/app/src/.env:ro
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MIGRATE_MEM_LIMIT:-256m}
    cpus: ${MIGRATE_CPUS:-0.5}
    # One-shot service: runs migrations with advisory lock (ID 100), then exits
    # Idempotent: advisory lock prevents concurrent runs

  load_cities:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: /app/entrypoint-cities.sh
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      BOT_TOKEN: ${BOT_TOKEN}
      DJANGO_BUILD: "1"
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env.dev
    volumes:
      - ./.env.dev:/app/src/.env:ro
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${LOAD_CITIES_MEM_LIMIT:-256m}
    cpus: ${LOAD_CITIES_CPUS:-0.5}
    # One-shot service: loads cities.json into the cities table, then exits
    # Idempotent via CATALOG_LOAD (ID 104) advisory lock; NOT profile-gated

  load_catalog:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: /app/entrypoint-catalog.sh
    depends_on:
      load_cities:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      BOT_TOKEN: ${BOT_TOKEN}
      DJANGO_BUILD: "1"
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env.dev
    volumes:
      - ./.env.dev:/app/src/.env:ro
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${LOAD_CATALOG_MEM_LIMIT:-256m}
    cpus: ${LOAD_CATALOG_CPUS:-0.5}
    # One-shot service: loads categories.yaml into DB, then exits
    # Depends on load_cities completing successfully

  create_admin:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: /app/entrypoint-create-admin.sh
    depends_on:
      load_catalog:
        condition: service_completed_successfully
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:--1}
      - DJANGO_BUILD=1
    env_file:
      - .env.dev
    volumes:
      - ./.env.dev:/app/src/.env:ro
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CREATE_ADMIN_MEM_LIMIT:-256m}
    cpus: ${CREATE_ADMIN_CPUS:-0.5}
    # One-shot service: runs once, then exits
    # Skipped if ADMIN_PASSWORD not set (empty string)

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: /app/entrypoint-seed.sh
    profiles:
      - seed
    depends_on:
      load_catalog:
        condition: service_completed_successfully
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SEED_USERS=${SEED_USERS:-10}
      - SEED_ADS=${SEED_ADS:-600}
      - DJANGO_BUILD=1
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env.dev
    volumes:
      - ./.env.dev:/app/src/.env:ro
      - media_volume:/app/media
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SEED_MEM_LIMIT:-512m}
    cpus: ${SEED_CPUS:-1.0}
    # One-shot service: run with `docker compose --profile seed run --rm seed`
    # Seeds database with demo data, then exits

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: gunicorn config.wsgi:application
    depends_on:
      load_catalog:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - BOT_HEALTH_STALE_SECONDS=120
    env_file:
      - .env.dev
    volumes:
      - ./.env.dev:/app/src/.env:ro
      - media_volume:/app/media
    restart: unless-stopped
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    cpus: ${WEB_CPUS:-1.5}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Port 8000 NOT published - nginx proxies internally

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m telegram_bot.main
    depends_on:
      load_catalog:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - BOT_HEALTH_STALE_SECONDS=120
    env_file:
      - .env.dev
    volumes:
      - ./.env.dev:/app/src/.env:ro
      - media_volume:/app/media
    restart: unless-stopped
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${BOT_MEM_LIMIT:-512m}
    cpus: ${BOT_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "/app/docker/healthcheck-bot.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media_volume:/media_volume:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    cap_drop: ["ALL"]
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.5}
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:

