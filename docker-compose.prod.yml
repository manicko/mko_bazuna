# Production override for docker-compose.yml
# Immutable image deployment with TLS hardening, scheduler, and image overrides for GHCR
#
# Image tag policy (09-API-016): every application service requires IMAGE_TAG
# (`${IMAGE_TAG:?...}`) rather than defaulting to `latest`. A floating default
# let `docker compose pull` on two hosts running "the same compose file" move the
# entire application to different code with no repository change. The deploy job
# (.github/workflows/deploy.yml) MUST NOT build: it only pulls, passing the CI
# commit SHA as IMAGE_TAG. Set IMAGE_TAG in .env.prod (the template ships a
# concrete dated tag, not `latest`).

services:
  # Override web for production: use pre-built image from GHCR
  # This prevents docker-compose from using build directive and forces pull
  web:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-mko-bazuna/mko_bazuna}:${IMAGE_TAG:?IMAGE_TAG must be set; a floating :latest makes two hosts run different code}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env.prod
    volumes:
      - ./.env.prod:/app/src/.env:ro
      - media_volume:/app/media

  # Override bot for production: use pre-built image from GHCR
  bot:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-mko-bazuna/mko_bazuna}:${IMAGE_TAG:?IMAGE_TAG must be set; a floating :latest makes two hosts run different code}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env.prod
    volumes:
      - ./.env.prod:/app/src/.env:ro
      - media_volume:/app/media

  # Override migrate for production: use pre-built image from GHCR
  migrate:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-mko-bazuna/mko_bazuna}:${IMAGE_TAG:?IMAGE_TAG must be set; a floating :latest makes two hosts run different code}
    env_file:
      - .env.prod
    volumes:
      - ./.env.prod:/app/src/.env:ro
    # BOT_TOKEN is withheld (09-API-011): this one-shot never sends a Telegram
    # message, so the token must not be in its process environment. Compose
    # `environment:` overrides `env_file:`, and read_env(overwrite=False) then
    # cannot restore it from the bind-mounted .env.prod. BOT_TOKEN_REQUIRED=false
    # is the matching per-service declaration the prod settings guard reads.
    environment:
      BOT_TOKEN: ""
      BOT_TOKEN_REQUIRED: "false"

  # Override create_admin for production: use pre-built image from GHCR
  create_admin:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-mko-bazuna/mko_bazuna}:${IMAGE_TAG:?IMAGE_TAG must be set; a floating :latest makes two hosts run different code}
    env_file:
      - .env.prod
    volumes:
      - ./.env.prod:/app/src/.env:ro
    # BOT_TOKEN withheld — create_admin never sends a Telegram message (09-API-011).
    environment:
      BOT_TOKEN: ""
      BOT_TOKEN_REQUIRED: "false"

  # Override seed for production: use pre-built image from GHCR
  seed:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-mko-bazuna/mko_bazuna}:${IMAGE_TAG:?IMAGE_TAG must be set; a floating :latest makes two hosts run different code}
    env_file:
      - .env.prod
    volumes:
      - ./.env.prod:/app/src/.env:ro
      - media_volume:/app/media
    # BOT_TOKEN withheld — seed never sends a Telegram message (09-API-011).
    environment:
      BOT_TOKEN: ""
      BOT_TOKEN_REQUIRED: "false"

  # Override load_cities for production: use pre-built image from GHCR
  # Added to override inherited env_file: .env.dev and volumes bind-mount
  load_cities:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-mko-bazuna/mko_bazuna}:${IMAGE_TAG:?IMAGE_TAG must be set; a floating :latest makes two hosts run different code}
    env_file:
      - .env.prod
    volumes:
      - ./.env.prod:/app/src/.env:ro
    # BOT_TOKEN withheld — load_cities never sends a Telegram message (09-API-011).
    environment:
      BOT_TOKEN: ""
      BOT_TOKEN_REQUIRED: "false"

  # Override load_catalog for production: use pre-built image from GHCR
  # Added to override inherited env_file: .env.dev and volumes bind-mount
  load_catalog:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-mko-bazuna/mko_bazuna}:${IMAGE_TAG:?IMAGE_TAG must be set; a floating :latest makes two hosts run different code}
    env_file:
      - .env.prod
    volumes:
      - ./.env.prod:/app/src/.env:ro
    # BOT_TOKEN withheld — load_catalog never sends a Telegram message (09-API-011).
    environment:
      BOT_TOKEN: ""
      BOT_TOKEN_REQUIRED: "false"

  # Override nginx for production: TLS certificate mount
  nginx:
    volumes:
      - media_volume:/media_volume:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certificates from environment variable
      - ${TLS_CERT_PATH:-/etc/nginx/certs}:/etc/nginx/certs:ro

  # Scheduler service: runs management commands in loop (hourly)
  # Gated by profiles:["scheduler"] to prevent import crash before commands exist
  scheduler:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-mko-bazuna/mko_bazuna}:${IMAGE_TAG:?IMAGE_TAG must be set; a floating :latest makes two hosts run different code}
    restart: unless-stopped
    stop_grace_period: 30s
    command: /app/entrypoint-scheduler.sh
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - REDIS_URL=redis://redis:6379/0
      - SCHEDULER_HEALTH_STALE_SECONDS=7200
    env_file:
      - .env.prod
    volumes:
      - ./.env.prod:/app/src/.env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      load_catalog:
        condition: service_completed_successfully
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SCHEDULER_MEM_LIMIT:-256m}
    cpus: ${SCHEDULER_CPUS:-0.5}
    profiles:
      - scheduler
    healthcheck:
      test: ["CMD-SHELL", "/app/docker/healthcheck-scheduler.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      # One full loop interval (SCHEDULE_INTERVAL_SECONDS, 3600 s): the
      # liveness marker cannot appear until the first cycle completes, and the
      # loop's contract is one cycle per interval. The worst-case cycle (every
      # command hitting SCHEDULER_COMMAND_TIMEOUT) is a failure state and is
      # deliberately not covered; the 7200 s staleness window detects it.
      start_period: 3600s

  # Backup service: daily database dumps with 7-day retention
  # Opt-in via --profile backup to prevent storage consumption before needed
  backup:
    # Pinned identically to the base `db` service (09-API-016): the dump client
    # and the server must be the same patch. Rollback value: `postgres:18-alpine`.
    image: postgres:18.6-alpine
    # NOTE (12-OPS-014, Q4 option c): no `user:` is declared. The correct uid
    # depends on the host directory ownership of ./backups, which is not visible
    # from this repository — the same "host filesystem not visible" reason that
    # made phase 12 BLOCK 16's off-host half and phase 09's certificate path
    # not-implementable here. Declaring a uid that cannot write the bind mount
    # would break the daily dump silently, which is strictly worse than running
    # as root. `user:` is recorded as a named follow-on: it needs a host-side
    # directory-provisioning step (own ./backups by the chosen uid) before it can
    # be declared safely. The command: override below bypasses postgres's
    # entrypoint privilege drop, so the container runs as root today; the Q4
    # probe (`id -u` in a throwaway run) returns 0. Both the pg_dump write and
    # the find … -delete prune run as that same uid (one shell, one process tree).
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Dump-freshness window for docker/healthcheck-backup.sh. The loop cadence
      # is 24h, so 2x that (172800s = 48h) flags a backup job that has stopped
      # succeeding without flapping on a single slow cycle.
      BACKUP_HEALTH_STALE_SECONDS: 172800
    volumes:
      - ./backups:/backups
    command:
      - /bin/sh
      - -c
      - |
        set -e;
        until pg_isready -h $$POSTGRES_HOST -p $$POSTGRES_PORT; do sleep 5; done;
        while true; do
          start=$$(date +%s);
          ts=$$(date +%Y%m%d_%H%M%S);
          pg_dump --no-sync -h $$POSTGRES_HOST -p $$POSTGRES_PORT
            -U $$POSTGRES_USER -d $$POSTGRES_DB -F c
            -f /backups/dump_$$ts.dump;
          echo "Backup completed: dump_$$ts.dump";
          find /backups -name 'dump_*.dump' -mtime +7 -delete 2>/dev/null || true;
          elapsed=$$(( $$(date +%s) - start ));
          remaining=$$(( 86400 - elapsed ));
          if [ "$$remaining" -gt 0 ] && [ "$$remaining" -le 86400 ]; then
            sleep "$$remaining";
          else
            sleep 86400;
          fi;
        done
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /app/docker/healthcheck-backup.sh"]
      interval: 1h
      timeout: 10s
      retries: 3
      # The loop sleeps ~24h between dumps, so the probe runs hourly; the
      # freshness window (48h) is what catches a broken job, not the cadence.
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${BACKUP_MEM_LIMIT:-256m}
    cpus: ${BACKUP_CPUS:-0.5}
    profiles:
      - backup

  # PgBouncer opt-in via --profile pgbouncer
  pgbouncer:
    image: edoburu/pgbouncer:1.25.2
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - PGBOUNCER_DATABASE=${POSTGRES_DB:?POSTGRES_DB must be set}
      - PGBOUNCER_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      # The role's password is stored by PostgreSQL 18 using the engine default
      # password_encryption = scram-sha-256, so PgBouncer must send SCRAM
      # verifiers, not md5 (12-OPS-015). md5 is verified against a stored md5
      # hash and cannot authenticate a SCRAM-only role. PgBouncer >=1.19
      # (this image is edoburu/pgbouncer:1.25.2) supports SCRAM auth_file.
      - PGBOUNCER_AUTH_TYPE=scram-sha-256
      - PGBOUNCER_POOL_MODE=transaction
      # The app sends libpq's `options` startup parameter (-c lock_timeout=Ns,
      # 03-DB-004). PgBouncer rejects every startup parameter it does not know,
      # so it must be listed here or clients are refused once this profile is
      # enabled. The name is UNPREFIXED on purpose: this image's ini template is
      # `ignore_startup_parameters = ${IGNORE_STARTUP_PARAMETERS:-...}` — the
      # entrypoint reads bare env names, NOT `PGBOUNCER_*` (a `PGBOUNCER_`-
      # prefixed name is silently dropped and the refusal persists).
      #
      # WARNING: listing `options` here only stops the refusal. PgBouncer then
      # DISCARDS the whole `options` parameter, so the client's connection-level
      # `lock_timeout` is GONE and pooled `SHOW lock_timeout` returns `0`
      # (unbounded) — silent unbounded lock waits, the exact failure 03-DB-004
      # exists to prevent. `track_extra_parameters = lock_timeout` does not help
      # on 1.25.2. Enabling this profile therefore ADDITIONALLY requires a
      # SERVER-SIDE default (`ALTER DATABASE mko_bazuna SET lock_timeout =
      # '10s'` / `postgresql.conf`). That is phase 12's decision and is NOT
      # shipped here, so this profile is BLOCKED until it is in place.
      # (The service is separately unusable: wrong `PGBOUNCER_*` prefix,
      # `POSTGRES_*` instead of `DATABASE_URL`, and a non-existent pinned tag —
      # outside BLOCK 5; see docs/ops/docker-deployment.md.) NAMED FOLLOW-ON:
      # the pinned tag `edoburu/pgbouncer:1.25.2` does not resolve on Docker Hub
      # (the repository's tags are `v1.25.2-p0`, `v1.26.0-p0`, …), so
      # `docker compose pull` aborts as a whole when the profile is enabled.
      # Correcting it to an existing tag is a separate change and does NOT
      # unblock the profile — the service stays documented-unusable and the
      # profile stays off (12-OPS-007).
      - IGNORE_STARTUP_PARAMETERS=options,extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 5s
      timeout: 5s
      retries: 5
      # PgBouncer starts quickly, but its probe only succeeds once it has opened
      # the 6432 listener and established an upstream connection to db. A modest
      # window covers that handshake without masking a genuine post-start failure.
      start_period: 10s
    profiles:
      - pgbouncer
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${PGBOUNCER_MEM_LIMIT:-128m}
    cpus: ${PGBOUNCER_CPUS:-0.5}
