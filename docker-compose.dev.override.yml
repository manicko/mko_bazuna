# Development override for docker-compose.yml
# Enables hot-reloading with bind-mounts and runserver
# Note: tailwindcss generates CSS on startup; rebuild CSS with: docker compose exec web tailwindcss -i src/theme/static/theme/css/input.css -o src/theme/static/theme/css/output.css --minify

services:
  web:
    command: >
      sh -c "tailwindcss -i src/theme/static/theme/css/input.css -o src/theme/static/theme/css/output.css --minify &&
             python src/backend/manage.py runserver 0.0.0.0:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - REDIS_URL=
    env_file:
      - .env.docker
    volumes:
      # Bind-mount entire repo for hot-reload (overrides image COPY)
      # Also bind-mount docker/entrypoint.sh since the :/app mount hides the image's copy
      - .:/app
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./.env.docker:/app/src/.env:ro
      - media_volume:/app/media
    ports:
      - "8000:8000"

  bot:
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - REDIS_URL=
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./.env.docker:/app/src/.env:ro

  load_catalog:
    entrypoint: /app/entrypoint-catalog.sh
    environment:
      # migrate/load_catalog use prod settings (base compose); give them a dev
      # SITE_URL so the prod SITE_URL guard is satisfied without editing .env.docker.
      - SITE_URL=${SITE_URL:-http://localhost:8000}
    volumes:
      - .:/app
      - ./docker/entrypoint-catalog.sh:/app/entrypoint-catalog.sh
      - ./.env.docker:/app/src/.env:ro

  migrate:
    environment:
      - SITE_URL=${SITE_URL:-http://localhost:8000}

  # Dev: seed runs automatically after load_catalog completes.
  # profiles: !reset [] replaces the ["seed"] profile gate from base compose,
  # making the one-shot seed container start with a plain `docker compose up`.
  # In production, docker-compose.prod.yml retains profiles: ["seed"] so seed
  # only runs on explicit --profile seed demand.
  seed:
    profiles: !reset []
    entrypoint: /app/entrypoint-seed.sh
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - REDIS_URL=
    volumes:
      - .:/app
      - ./docker/entrypoint-seed.sh:/app/entrypoint-seed.sh
      - ./.env.docker:/app/src/.env:ro
      - media_volume:/app/media

  nginx:
    profiles:
      - use-nginx  # Optional in dev; omit to run without nginx
    volumes:
      - media_volume:/media_volume:ro
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      # mkcert development certificates for HTTPS
      - ./docker/nginx/certs:/etc/nginx/certs:ro