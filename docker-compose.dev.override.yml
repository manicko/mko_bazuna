# Development override for docker-compose.yml
# Enables hot-reloading with bind-mounts and runserver
# Note: tailwindcss generates CSS on startup; rebuild CSS with: docker compose exec web tailwindcss -i src/theme/static/theme/css/input.css -o src/theme/static/theme/css/output.css --minify

services:
  web:
    command: >
      sh -c "tailwindcss -i src/theme/static/theme/css/input.css -o src/theme/static/theme/css/output.css --minify || echo 'WARNING: tailwindcss rebuild skipped — using pre-built CSS from image build' ;
             python src/backend/manage.py runserver 0.0.0.0:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - POSTGRES_HOST=db
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=
    env_file:
      - .env.dev
    volumes:
      # Bind-mount entire repo for hot-reload (overrides image COPY)
      # Also bind-mount docker/entrypoint.sh since the :/app mount hides the image's copy
      - .:/app
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./.env.dev:/app/src/.env:ro
      - media_volume:/app/media
    ports:
      - "8000:8000"
    # In dev, web waits for seed to complete so media/seed/ photos are populated
    # before serving. Dev override merges with base depends_on (load_catalog, redis).
    depends_on:
      seed:
        condition: service_completed_successfully

  bot:
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - REDIS_URL=
    env_file:
      - .env.dev
    volumes:
      - .:/app
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./.env.dev:/app/src/.env:ro

  load_catalog:
    entrypoint: /app/entrypoint-catalog.sh
    environment:
      # migrate/load_catalog use prod settings (base compose); give them dev
      # values so the prod guard checks for SITE_URL and GOOGLE_TRANSLATE_API_KEY
      # are satisfied without editing .env.dev.
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-dev-only-dummy-key-not-for-production}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - DJANGO_ONESHOT=1
    volumes:
      - .:/app
      - ./docker/entrypoint-catalog.sh:/app/entrypoint-catalog.sh
      # The .:/app mount shadows the image's entrypoint.sh; mount the real one explicitly
      # so the source'd functions (check_env_file, wait_for_db, wait_for_redis) are defined
      # and the service does not fail with exit 127 ("command not found").
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./.env.dev:/app/src/.env:ro

  migrate:
    environment:
      # migrate uses prod settings (base compose); give it dev values so the
      # prod guard checks for SITE_URL, GOOGLE_TRANSLATE_API_KEY, and
      # CSRF_TRUSTED_ORIGINS are satisfied without editing .env.dev.
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-dev-only-dummy-key-not-for-production}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - DJANGO_ONESHOT=1

  # Dev: load_cities runs after migrate completes.
  # profiles: !reset [] replaces the ["seed"] profile gate from base compose,
  # making the one-shot load_cities container start with a plain
  # `docker compose up`. In production, docker-compose.prod.yml keeps load_cities
  # on the normal boot path.
  load_cities:
    entrypoint: /app/entrypoint-cities.sh
    environment:
      # load_cities uses prod settings (base compose); give it dev values so
      # the prod guard checks are satisfied without editing .env.dev, and set
      # DJANGO_ONESHOT=1 to bypass the one-shot secret-validation guards.
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-dev-only-dummy-key-not-for-production}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - DJANGO_ONESHOT=1
    volumes:
      - .:/app
      - ./docker/entrypoint-cities.sh:/app/entrypoint-cities.sh
      # The .:/app mount shadows the image's entrypoint.sh; mount the real one explicitly
      # so the source'd functions (check_env_file, wait_for_db, wait_for_redis) are defined
      # and the service does not fail with exit 127 ("command not found").
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./.env.dev:/app/src/.env:ro

  # Dev: create_admin runs after load_catalog completes.
  # profiles: !reset [] replaces the ["seed"] profile gate from base compose,
  # making the one-shot create_admin container start with a plain
  # `docker compose up`. In production, docker-compose.prod.yml keeps create_admin
  # on the normal boot path.
  create_admin:
    entrypoint: /app/entrypoint-create-admin.sh
    environment:
      # create_admin uses prod settings (base compose); give it dev values so
      # the prod guard checks are satisfied without editing .env.dev, and set
      # DJANGO_ONESHOT=1 to bypass the one-shot secret-validation guards.
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-dev-only-dummy-key-not-for-production}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - DJANGO_ONESHOT=1
    volumes:
      - .:/app
      - ./docker/entrypoint-create-admin.sh:/app/entrypoint-create-admin.sh
      # The .:/app mount shadows the image's entrypoint.sh; mount the real one explicitly
      # so the source'd functions (check_env_file, wait_for_db, wait_for_redis) are defined
      # and the service does not fail with exit 127 ("command not found").
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./.env.dev:/app/src/.env:ro

  # Dev: seed runs automatically after load_catalog completes.
  # profiles: !reset [] replaces the ["seed"] profile gate from base compose,
  # making the one-shot seed container start with a plain `docker compose up`.
  # In production, docker-compose.prod.yml retains profiles: ["seed"] so seed
  # only runs on explicit --profile seed demand.
  #
  # Like the other one-shot bootstrap services, seed runs against prod settings
  # (config.settings.prod, inherited from the base compose) with DJANGO_ONESHOT=1
  # so the prod.py secret-validation guards bypass dev placeholder/dummy secrets
  # from .env.dev. Seed does not serve HTTP and has no dependency on BOT_TOKEN
  # (it is a pure DB/media population command), so the bypass is safe here.
  # The dev override does NOT set DJANGO_SETTINGS_MODULE or REDIS_URL — both are
  # inherited from the base compose (config.settings.prod and
  # redis://redis:6379/0 respectively).
  seed:
    profiles: !reset []
    entrypoint: /app/entrypoint-seed.sh
    environment:
      - DJANGO_ONESHOT=1
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-dev-only-dummy-key-not-for-production}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - SEED_USERS=10
    volumes:
      - .:/app
      - ./docker/entrypoint-seed.sh:/app/entrypoint-seed.sh
      # The .:/app mount shadows the image's entrypoint.sh; mount the real one explicitly
      # so the source'd functions (check_env_file, wait_for_db, wait_for_redis) are defined
      # and the service does not fail with exit 127 ("command not found").
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./.env.dev:/app/src/.env:ro
      - media_volume:/app/media

  nginx:
    profiles:
      - use-nginx  # Optional in dev; omit to run without nginx
    volumes:
      - media_volume:/media_volume:ro
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      # mkcert development certificates for HTTPS
      - ./docker/nginx/certs:/etc/nginx/certs:ro