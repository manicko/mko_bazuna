[project]
name = "mko-bazuna"
version = "0.1.0"
authors = [
    { name = "mko", email = "manicko@yandex.ru" },
]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.16,<6.0",
    "psycopg[binary]>=3.2.0",
    "django-environ>=0.11.0",
    "django-redis>=5.4.0",
    "django-mptt>=0.18.0",
    "django-filter>=26.1",
    "aiogram>=3.15.0",
    "deep-translator>=1.11.0",
    "django-tailwind>=4.4.0",
    "django-htmx>=1.19.0",
    "pillow>=10.4.0",
    "gunicorn>=26.0",
    "whitenoise>=6.12.0",
    "requests>=2.34.2",
    "ruamel.yaml>=0.19.1",
    "faker>=40.35.0",
]


classifiers = [
    "Programming Language :: Python",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/manicko/mko_bazuna"
Repository = "https://github.com/manicko/mko_bazuna"
Issues = "https://github.com/manicko/mko_bazuna/issues"

[tool.setuptools]
platforms = ["Linux", "Windows"]
include-package-data = true

# Project is NOT installed in the image; import roots are provided via
# ENV PYTHONPATH=/app/src:/app/src/backend (see docker/Dockerfile).
# src listed first in both Docker and pytest so the real theme package resolves correctly.
# If installation is ever enabled, discover the real split layout:

[tool.setuptools.packages.find]
where = [
    "src/backend",
    "src",
]

include = [
    "apps*",
    "config*",
    "theme*",
    "telegram_bot*",
]


# Black configuration
[tool.black]
line-length = 88
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | build
  | dist
  | migrations
  | __pycache__
)/
'''

# isort configuration (used by isort hook)
[tool.isort]
profile = "black"
known_first_party = ["mko_bazuna", "settings", "core"]
combine_as_imports = true

# Ruff top-level global settings
[tool.ruff]
line-length = 88
fix = false   # IMPORTANT: do NOT auto-fix by default
# global excludes (keeps ruff from checking virtual envs and build artifacts)
exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Newer Ruff config: put lint-specific options under [tool.ruff.lint]
[tool.ruff.lint]
select = [
    "E",  # PEP8 errors
    "F",  # Pyflakes
    "I",  # import-sorted checks (ruff checks imports)
    "B",  # bugbear (best practices)
    "UP", # pyupgrade rules
]
# We ignore line length because Black enforces it
ignore = [
    "E501",
    # optionally ignore import-sort warning which is handled by isort:
    "I001",  # "Import block is un-sorted or un-formatted" if you prefer isort to run
]

# Specific ruff.isort-related options (only ruff-supported keys)
# Note: do NOT set profile here (ruff doesn't accept "profile" key)
[tool.ruff.lint.isort]
known-first-party = ["mko_bazuna", "settings", "core"]
combine-as-imports = true

# Ruff formatting section
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false


# MyPy config (project-level)
[tool.mypy]
# If sources live in package root, mypy_path not needed; if you use src/ layout set mypy_path.
# mypy_path = "./src"
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.4"
asyncio_mode = "strict"
python_files = ["tests.py", "test_*.py"]
pythonpath = ["src", "src/backend"]
addopts = ["--import-mode=importlib","-ra", "-q", "--cov", "--cov-report=term-missing"]
console_output_style = "classic"
# register custom markers to avoid PytestUnknownMarkWarning
markers = [
  "slow: marks tests as slow (use -m slow to run)",
  "integration: marks tests that require a database (use -m integration to run)",
]

# Coverage.py configuration (used by pytest-cov)
[tool.coverage.run]
branch = true
source = ["src/backend", "src/telegram_bot"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "*/conftest.py", "*/manage.py", "*/wsgi.py", "*/asgi.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
reportArgumentType = "none"  # Django model field defaults are valid at runtime but not type-checkable
reportIncompatibleVariableOverride = "none"  # Django Meta inheritance pattern
reportAttributeAccessIssue = "none"  # Django adds 'id' at runtime via metaclass
reportMissingImports = "none"  # Django apps namespace imports resolved at runtime

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "hypothesis>=6.156.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-factoryboy>=2.7.0",
    "model-bakery>=1.23.0",
    "radon>=6.0.1",
    "ruff>=0.16.0",
    "factory-boy>=3.3.3",
    "coverage>=7.15.2",
    "requests>=2.34.2",
]
