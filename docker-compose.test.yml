# Test override for docker-compose.yml
# PostgreSQL test database (NOT SQLite): postgres:18-alpine with a persistent
# `postgres_data` volume inherited from the base compose (project-prefixed).
# Persists between local `make test` runs; CI destroys the project + volume post-run.
#
# env_file behavior notes (ENV-004):
#   - `env_file` values are applied to the container's environment at runtime.
#     The `env_file:` directive itself is NOT visible in `docker compose config`
#     output -- Compose resolves it by merging the file contents into the
#     service's `environment:` section during config rendering. Running
#     `docker compose config` shows a flat `environment:` list; it does not
#     indicate which `.env` file a given variable originated from.
#   - The `--env-file .env.test` CLI flag is a SEPARATE concern: it feeds
#     `${VAR}` interpolation in the Compose YAML itself (e.g. `${POSTGRES_USER}`),
#     not the container's runtime environment. Do not confuse it with the
#     service-level `env_file:` directive, which injects file contents into
#     the container.
#   - To verify which `.env` file is bind-mounted for each service, inspect the
#     `volumes:` section in `docker compose config` output -- not `environment:`.
#   - When merging compose files, `env_file:` lists are concatenated: the base
#     compose's `env_file:` entries and this override's `.env.test` are both
#     loaded, with the later file winning on key conflicts. `environment:` keys
#     take precedence over `env_file:` keys. `volumes:` entries are merged by
#     target path — a bind-mount with the same target in the override replaces
#     the base entry. This is why the `!override` tag is used for migrate,
#     create_admin, bot, web, load_cities, load_catalog, and seed: it forces
#     full replacement of the base `volumes:` list so the `.env.dev` bind-mount
#     is never retained.
#   - Advisory: `env_file:` lists also concatenate (.env.dev + .env.test). This is
#     safe today because variable names are identical in both files and `environment:`
#     keys take precedence. For stricter isolation, each service could use
#     `env_file: !override [.env.test]` to load only the test file. Not applied
#     here to avoid changing established merge behavior.

services:
  # Override db service for test: long-running, persistent PostgreSQL.
  # No `volumes:` section is present, so `postgres_data` is inherited from the
  # base compose via volume name merging -- the base db service's mount
  # (`postgres_data:/var/lib/postgresql`) and the base top-level `volumes:`
  # declaration are both preserved (project-prefixed -> mko-bazuna-test_postgres_data).
  # This keeps the container alive between `make test` runs. Port 5433 on the host
  # allows debugging with psql / GUI tools.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/mko_bazuna
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mko_bazuna"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Override migrate service for test: uses test settings
  migrate:
    env_file:
      - .env.test
    volumes: !override ["./.env.test:/app/src/.env:ro"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test

  # Test service: one-shot run of migrate + pytest.
  # Source code is bind-mounted (.:/app) so test iteration needs no image rebuild.
  # `init: true` makes the container PID 1 properly forward signals (Ctrl+C)
  # and reap zombies (CR5).
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test-runtime
    command: /app/entrypoint-test.sh
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.test
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test
      # Override Dockerfile's UV_NO_INSTALL_PROJECT=1 so uv sync installs dev deps
      - UV_NO_INSTALL_PROJECT=0
      # .env.test is bind-mounted at /app/src/.env; SKIP_ENV_CHECK=1 bypasses the
      # entrypoint's .env existence check (CR3 safety)
      - SKIP_ENV_CHECK=1
    # Bind-mount source + entrypoint scripts for hot-reload; cache uv downloads.
    volumes:
      - .:/app
      - ./.env.test:/app/src/.env:ro
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - ./docker/entrypoint-test.sh:/app/entrypoint-test.sh
      - uv_cache:/root/.cache/uv
    # One-shot service: exits with pytest exit code
    profiles: ["test"]

  # Override create_admin for test: .env.test is bind-mounted at /app/src/.env
  # (volumes: !override) and loaded via env_file; DJANGO_SETTINGS_MODULE is set
  # to test. ADMIN_USERNAME/ADMIN_PASSWORD/ADMIN_TELEGRAM_ID are provided
  # explicitly, with values consistent with .env.test.
  create_admin:
    env_file:
      - .env.test
    volumes: !override ["./.env.test:/app/src/.env:ro"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=test-admin-password
      - ADMIN_TELEGRAM_ID=-1

  # Override bot for test: .env.test env_file, test settings, .env.test bind-mount.
  # DJANGO_SECRET_KEY and BOT_TOKEN come from env_file (.env.test) since the base
  # bot environment section does not include them (unlike load_cities/load_catalog).
  bot:
    env_file:
      - .env.test
    volumes: !override
      - ./.env.test:/app/src/.env:ro
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test

  # Override web for test: same pattern as bot.
  web:
    env_file:
      - .env.test
    volumes: !override
      - ./.env.test:/app/src/.env:ro
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test

  # Override load_cities for test: DJANGO_SECRET_KEY and BOT_TOKEN are in the
  # base environment section (interpolated from --env-file .env.test); env_file
  # override ensures any remaining vars (e.g. SITE_URL, GOOGLE_*) come from .env.test.
  load_cities:
    env_file:
      - .env.test
    volumes: !override
      - ./.env.test:/app/src/.env:ro
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test

  # Override load_catalog for test: same pattern as load_cities.
  load_catalog:
    env_file:
      - .env.test
    volumes: !override
      - ./.env.test:/app/src/.env:ro
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test

  # Override seed for test: profiles: ["seed"] inherited from base so it only
  # starts with --profile seed; env_file override ensures .env.test values.
  seed:
    env_file:
      - .env.test
    volumes: !override
      - ./.env.test:/app/src/.env:ro
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test

volumes:
  uv_cache: