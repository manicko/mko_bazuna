user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        # HTTP to HTTPS redirect
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        # TLS certificates mounted via docker-compose.prod.yml
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        server_name _;

        # Static files served by whitenoise in Django container (proxied)
        location /static/ {
            proxy_pass http://web:8000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache headers for static assets
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files served from volume with hardening (R8)
        location /media/ {
            alias /media_volume/;

            # Block script execution (R8 hardening - defense in depth)
            location ~* \.(php|py|cgi|pl|sh)$ {
                deny all;
                return 403;
            }

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition inline always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; object-src 'none'" always;

            # MIME whitelist: image/jpeg only (Telegram delivers JPEG)
            types {
                image/jpeg jpg jpeg;
            }
            default_type application/octet-stream;
        }

        # Reverse proxy to Django web service
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}