# Prometheus alerting rules — SLO burn-rate alerts for Mko Bazuna.
#
# DEPLOYMENT STATUS: PLANNED — NOT DEPLOYED (12-OPS-003).
# No Prometheus, Alertmanager or Grafana service exists in any of the four
# compose files, and the `/metrics` endpoint is restricted to loopback
# (`docker/nginx/nginx.conf` `location = /metrics`, plus the Django loopback
# gate in `config/urls.py`). Nothing consumes this file yet, so it is NOT an
# active control: it is a reviewable contract for the monitoring stack that a
# later change would deploy. The previous form was a Kubernetes
# `PrometheusRule` CRD in a Compose-only project and was consumed by nothing.
#
# Thresholds reference the PerformanceSLO IntEnum in src/benchmark/constants.py:
#   - PerformanceSLO.SEARCH_SLO_MS            = 2000  (≤2s search latency, docs/01-spec/search-patterns.md:360)
#   - PerformanceSLO.P95_SLO_MS               = 500   (p95 latency SLO)
#   - PerformanceSLO.P99_SLO_MS               = 2000  (p99 latency SLO, identical to SEARCH_SLO_MS)
#   - PerformanceSLO.CACHE_HIT_RATE_THRESHOLD = 85   (Redis cache hit rate, docs/99-agent/rules.md:221)
#
# SELECTOR CONTRACT (12-OPS-003). Every `expr` below resolves against a series
# that a rendered `/metrics` actually exposes (see
# apps/core/tests/test_observability.py, which parses this file and asserts
# each selector against the live exposition):
#   - The latency histogram is `django_http_requests_latency_including_middlewares_seconds_*`
#     (django-prometheus). It carries `method`, `transport` and `view` labels
#     and the prometheus_client default bucket edges
#     (0.01 … 50.0, 75.0, +Inf).
#   - The `/search/` view label is `view="search:search"`.
#   - `django_http_response_duration_seconds` does NOT exist in the exposition,
#     and neither does a `handler` label — the rules that named them never fired.
#
# The multiprocess caveat was corrected (12-OPS-003): gunicorn runs with
# `preload_app=True`, but the web service sets `PROMETHEUS_MULTIPROC_DIR` (with
# a paired tmpfs) and `gunicorn.conf.py` defines the `child_exit` hook, so
# `prometheus_client` runs in multiprocess mode and a single scrape aggregates
# every worker's metrics. The old "each scrape returns one worker's metrics"
# note no longer holds.
groups:
  - name: slo.search-latency
    rules:
      # -----------------------------------------------------------------
      # search_slo_burn_rate
      #
      # 99% SLO for search latency: 99% of /search/ requests must complete
      # within PerformanceSLO.SEARCH_SLO_MS (2000ms). The histogram's nearest
      # bucket edge at or above 2000ms is `le="2.5"` (the default edge set has
      # no `2.000`), so the requests over SLO are those in the `+Inf` bucket but
      # not the `2.5` bucket.
      #
      # Error budget = 1% of all search requests (1 - 0.99).
      # Burn rate = (fraction of requests exceeding 2s) / (error budget fraction 0.01).
      #
      # A sustained burn rate > 10 over a 14.4-minute window means 10% of the
      # error budget is being consumed within that window.
      #
      # Metric source: django_http_requests_latency_including_middlewares_seconds_bucket
      # (django-prometheus). View label: "search:search".
      # -----------------------------------------------------------------
      - alert: search_slo_burn_rate
        expr: |
          (
            1
            - rate(
                django_http_requests_latency_including_middlewares_seconds_bucket{le="2.5", view="search:search"}[14.4m]
              )
              / rate(
                  django_http_requests_latency_including_middlewares_seconds_count{view="search:search"}[14.4m]
                )
          )
          / 0.01
          > 10
        for: 2m
        labels:
          severity: page
          slo: search-latency
          error_budget_percent: "1"
          threshold_slo_ms: "2000"
        annotations:
          summary: "Search latency SLO burn rate exceeded — p99 > 2000ms (PerformanceSLO.SEARCH_SLO_MS)"
          description: |-
            The search endpoint's 99th-percentile latency exceeds the ≤2s SLO
            (PerformanceSLO.SEARCH_SLO_MS = 2000ms, PerformanceSLO.P99_SLO_MS = 2000ms).

            A sustained burn rate > 10 over a 14.4-minute window indicates that
            10%+ of the error budget (1% for a 99% SLO) is being consumed.

            Burn rate: {{ $value | humanizePercentage }}
            Threshold:  PerformanceSLO.SEARCH_SLO_MS = 2000ms
            Reference: docs/01-spec/search-patterns.md:360
          runbook_url: https://github.com/mko-bazuna/mko_bazuna/blob/main/docs/ops/prometheus-slo-alerts.yaml

      # -----------------------------------------------------------------
      # search_p95_latency_slo
      #
      # Secondary alert for the p95 latency SLO: 95% of /search/ requests
      # must complete within PerformanceSLO.P95_SLO_MS (500ms).
      # Fires when the 5-minute p95 exceeds 500ms for more than 5 minutes.
      # -----------------------------------------------------------------
      - alert: search_p95_latency_slo
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(django_http_requests_latency_including_middlewares_seconds_bucket{view="search:search"}[5m])
            )
          ) * 1000 > 500
        for: 5m
        labels:
          severity: warning
          slo: search-p95-latency
          threshold_slo_ms: "500"
        annotations:
          summary: "Search p95 latency exceeds 500ms SLO (PerformanceSLO.P95_SLO_MS)"
          description: |-
            The 95th-percentile search response time exceeded 500ms
            (PerformanceSLO.P95_SLO_MS = 500) for more than 5 minutes.
            {{ $value | humanize }}ms observed.
          runbook_url: https://github.com/mko-bazuna/mko_bazuna/blob/main/docs/ops/prometheus-slo-alerts.yaml

# ---------------------------------------------------------------------------
# RETIRED (12-OPS-003): the `cache_hit_rate_slo` rule.
#
# It selected `redis_db_keyspace_hits_total` / `redis_db_keyspace_misses_total`,
# which are emitted by a `redis_exporter`. No `redis_exporter` exists in any of
# the four compose files, so the series is never exposed and the rule could
# never evaluate. The scrape-contract test rejects any selector naming a series
# the exposition does not contain, so the rule was removed rather than left as
# a control that cannot run. Cache hit-rate monitoring, if wanted, belongs with
# a deployed exporter and is a separate change.
# ---------------------------------------------------------------------------
