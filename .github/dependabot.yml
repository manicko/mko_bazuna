version: 2
updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions — every action is pinned to a full 40-hex commit SHA with a
  # version comment (12-OPS-017). Dependabot bumps the SHA and the trailing
  # version comment simultaneously, keeping the supply-chain pin auditable.
  #
  # Policy mechanics (12-OPS-017). The schema key is `update-types` — PLURAL, a
  # LIST of `version-update:semver-*` values. The former singular `update-type`
  # key is not part of the schema and was silently ignored; more importantly,
  # Dependabot documents that "when `update-types` is omitted from an `allow`
  # rule, all update types are allowed for that rule", so a restriction written
  # with the singular key permitted every update type — including majors.
  #
  # `update-types` only affects *version* updates; security updates are always
  # created regardless of it. The real "never auto-file a major" guarantee for
  # dependency versions therefore lives at two other layers:
  #   1. per-dependency major pins in the `uv` entry (`ignore` + semantics), and
  #   2. a pytest guard that the resolved `uv.lock` respects every declared
  #      upper bound in pyproject.toml
  #      (apps/core/tests/test_ci_security.py::test_dependency_bounds_are_respected_by_uv_lock),
  #      which runs in the CI `test` job.
  #
  # Two entries split security actions (all update types, incl. majors) from
  # build/CI actions (minor/patch only) so that major-version upgrades like
  # actions/checkout v4->v7 or astral-sh/setup-uv v5->v10 require manual review
  # rather than auto-filing (see PR #7).
  # ---------------------------------------------------------------------------

  # Security-critical actions: vulnerability scanners and SARIF upload.
  # Major-version upgrades are allowed for timely CVE coverage: no
  # `update-types` in the `allow` entries means "all update types allowed".
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      security-actions:
        patterns:
          - "aquasecurity/trivy-action"
          - "github/codeql-action/upload-sarif"
    allow:
      - dependency-name: "aquasecurity/trivy-action"
      - dependency-name: "github/codeql-action/upload-sarif"
    open-pull-requests-limit: 5

  # Routine build/CI tooling — only semver-minor and semver-patch bumps are
  # auto-filed; major bumps require manual review (12-OPS-017).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      build-actions:
        patterns:
          - "actions/checkout"
          - "actions/upload-artifact"
          - "astral-sh/setup-uv"
          - "docker/login-action"
          - "docker/setup-buildx-action"
          - "docker/build-push-action"
    allow:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "astral-sh/setup-uv"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "docker/login-action"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "docker/setup-buildx-action"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "docker/build-push-action"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    # appleboy/ssh-action receives the production SSH private key during deploy
    # (deploy.yml). Per 12-OPS-017, this trust boundary is deliberately excluded
    # from auto-update: any SHA bump requires manual security review.
    # (Commit e11b421e pinned it to v1.2.5 for this reason.)
    ignore:
      - dependency-name: "appleboy/ssh-action"
    open-pull-requests-limit: 10

  # ---------------------------------------------------------------------------
  # Docker base image — python:3.14-slim (matches requires-python >=3.14,<3.15).
  # Deliberately unrestricted: it tracks digests/patches of the base image, and
  # the interpreter minor is already bounded by requires-python. Container images
  # in docker-compose.yml (postgres, redis, nginx) are intentionally pinned to
  # patch versions with rollback values and are managed manually — not tracked
  # by Dependabot.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # ---------------------------------------------------------------------------
  # Python dependencies via uv (pyproject.toml + uv.lock).
  #
  # Every entry in [project.dependencies] and the `bandit` dev dependency carries
  # an upper version bound that constrains breaking changes (e.g. django<6.0,
  # aiogram<4.0, bandit<2.0). Two layers enforce the intent:
  #
  #   `allow` — the valid `update-types` LIST restricts version updates to
  #     semver-minor/patch. (Security updates are NOT subject to this filter.)
  #   `ignore` — one major-version pin per bounded dependency below. This is the
  #     defence-in-depth layer: it states the intent at the dependency level and
  #     does not depend on how `allow` and `ignore` interact.
  #
  # When a bound is added or tightened in pyproject.toml, add the matching major
  # pin here — apps/core/tests/test_ci_security.py parses pyproject.toml and
  # fails if a bounded dependency has no pin.
  #
  # Background: the previous revision used the invalid singular `update-type`
  # key and a header that claimed majors were blocked (citing PR #8, which
  # proposed Django 5->6). It was inert. PR #16 proposed django 5.2.17->6.1.2
  # for the same reason.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    ignore:
      # --- [project].dependencies with an upper bound ---
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "psycopg"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-environ"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-mptt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-filter"
        update-types: ["version-update:semver-major"]
      - dependency-name: "aiogram"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-tailwind"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-htmx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pillow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gunicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "httpx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "whitenoise"
        update-types: ["version-update:semver-major"]
      - dependency-name: "requests"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruamel.yaml"
        update-types: ["version-update:semver-major"]
      - dependency-name: "faker"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sentry-sdk"
        update-types: ["version-update:semver-major"]
      # django-prometheus bound (<3.0) plus pre-release/dev guard (e.g. 2.6.0.dev22).
      - dependency-name: "django-prometheus"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-prerelease"
      - dependency-name: "prometheus-client"
        update-types: ["version-update:semver-major"]
      # --- [dependency-groups].dev with an upper bound ---
      - dependency-name: "bandit"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
