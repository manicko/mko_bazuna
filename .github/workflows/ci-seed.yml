name: Seed Tests

on:
  # Once per push to the long-lived branches: the slow ~18-minute serial seed
  # suite is far too slow for the fast gate (ci.yml runs `-m "not seed"`), so it
  # lives in this separate workflow and runs at merge time instead of on a
  # nightly cron.
  push:
    branches: [main, develop]
  workflow_dispatch: # Manual trigger for on-demand seed runs

concurrency:
  group: seed-tests
  # Do NOT cancel — these are important correctness tests that should always complete.
  cancel-in-progress: false

jobs:
  seed-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py bootstrap_reference_data
        working-directory: src/backend

      - name: Run seed tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run pytest -m "seed" --tb=short --cov --durations=10 --cov-report=term --cov-report=xml --reuse-db
        working-directory: src/backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seed-coverage-report
          path: src/backend/coverage.xml
          retention-days: 7

  # Query-plan profiler (PERF-012b validated 2026-09). The command is the
  # repository's only EXPLAIN tool and it is not runnable on a small dataset:
  # below the threshold it reports "the measurement did NOT happen" and exits
  # non-zero. This job seeds a production-like dataset, runs the profiler above
  # the threshold, and fails the run if any profiled query falls back to a Seq
  # Scan on the ads table. It runs on push, not per-PR — the seed volume is far
  # too large for a per-PR job.
  query-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

       - name: Run migrations + seed reference data
         env:
           DJANGO_SETTINGS_MODULE: config.settings.test
           DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
           DJANGO_SECRET_KEY: test-secret-key-for-testing-only
         run: uv run python manage.py bootstrap_reference_data
         working-directory: src/backend

       - name: Load cities
         env:
           DJANGO_SETTINGS_MODULE: config.settings.test
           DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
           DJANGO_SECRET_KEY: test-secret-key-for-testing-only
         run: uv run python manage.py load_cities
         working-directory: src/backend

       - name: Load catalog (categories)
         env:
           DJANGO_SETTINGS_MODULE: config.settings.test
           DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
           DJANGO_SECRET_KEY: test-secret-key-for-testing-only
         run: uv run python manage.py load_catalog
         working-directory: src/backend

      - name: Seed 10k published ads (production-like scale)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: |
          uv run python manage.py shell -c "
          from decimal import Decimal
          from django.contrib.auth import get_user_model
          from django.db import transaction
          from django.utils import timezone
          from apps.ads.models import Ad, AdStatus
          from apps.categories.models import Category
          from apps.locations.models import City
          cat = Category.objects.filter(is_active=True).first()
          city = City.objects.first()
          User = get_user_model()
          seller = User.objects.first() or User.objects.create_user('profiler-seller', telegram_id=999998, chat_id=999998)
          rows = [
              Ad(
                  title=f'Profiler ad {i}',
                  category=cat,
                  city=city,
                  user=seller,
                  price_amount=Decimal('100'),
                  price_currency='EUR',
                  price_normalized_eur=Decimal('100'),
                  published_at=timezone.now(),
                  status=AdStatus.PUBLISHED,
              )
              for i in range(10000)
          ]
          with transaction.atomic():
              Ad.objects.bulk_create(rows, batch_size=1000)
          print('Seeded 10000 published ads for the query profiler')
          "
        working-directory: src/backend

      - name: Run query-plan profiler
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py profile_queries --min-rows 10000
        working-directory: src/backend
