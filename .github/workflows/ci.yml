name: CI

on:
  push:
    branches: [main, develop]
  # Pre-merge gate (12-OPS-002). `push` alone makes every CI check a post-merge
  # one, so an ungated PR can merge and only then show red. The `deploy` job in
  # deploy.yml asserts on a *green CI run for the dispatched SHA*, which
  # presupposes this workflow runs for that SHA — including on a PR head.
  pull_request:

# Do NOT cancel in progress (12-OPS-009): a cancelled run reports `cancelled`,
# never `success`, so it can never be mistaken for a green gate — but a required
# status check that is cancelled turns into a permanently pending check on the
# branch. The shared buildcache reference is written by this workflow, so two
# overlapping pushes would otherwise race the same cache target.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    # One image coordinate for this workflow (12-OPS-009). `deploy.yml` is a
    # separate workflow and cannot read this output; it derives its coordinate
    # from REGISTRY/REPOSITORY in .env.prod instead (see docker-compose.prod.yml).
    env:
      IMAGE_REPOSITORY: mko-bazuna/mko_bazuna
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            mko-bazuna:ci
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_REPOSITORY }}:buildcache,mode=max

      - name: Scan Docker image for vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mko-bazuna:ci
          exit-code: 1
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Docker image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py bootstrap_reference_data
        working-directory: src/backend

      - name: Install gettext (for compilemessages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Compile translations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
        run: |
          uv run python manage.py compilemessages \
            --ignore=.venv --ignore=.git --ignore=.kilo --ignore=__pycache__ --ignore='*.pyc' \
            --ignore=.mypy_cache --ignore=.ruff_cache --ignore=.pytest_cache --ignore=node_modules \
            --ignore=.tox --ignore=.nox --ignore=__pypackages__ --ignore=.uv --ignore=.cache \
            --ignore=.local --ignore=.playwright-mcp --ignore=.coverage --ignore=.hypothesis \
            --locale ru --locale bs --locale en
        working-directory: src/backend

      - name: Run pytest with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run pytest -m "not seed" -n auto --dist loadgroup --tb=short --cov --durations=10 --cov-report=term --cov-report=xml --reuse-db
        working-directory: src/backend

      # SLO regression gate (13-PERF-001, Block B3): assert the search endpoint
      # stays within the ≤2s SLO at seed volume (≥50 PUBLISHED ads). This dedicated
      # step makes the latency assertion a visible, named gate in every PR —
      # separate from the coverage run — so regressions cannot be hidden in noise.
      - name: Run SLO regression test (≤2s search latency)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run pytest -k TestSearchResponseSLORegression -n auto --dist loadgroup --tb=short --reuse-db -v
        working-directory: src/backend

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: src/backend/coverage.xml
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Run ruff
        run: uv run ruff check src/

  typecheck:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Run basedpyright
        run: uv run basedpyright src/

  lint-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Run djlint
        run: uv run djlint templates/
        working-directory: src/backend
        env:
          PYTHONPATH: .

  i18n:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py bootstrap_reference_data
        working-directory: src/backend

      - name: Install gettext (for compilemessages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Compile translations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
        run: |
          uv run python manage.py compilemessages \
            --ignore=.venv --ignore=.git --ignore=.kilo --ignore=__pycache__ --ignore='*.pyc' \
            --ignore=.mypy_cache --ignore=.ruff_cache --ignore=.pytest_cache --ignore=node_modules \
            --ignore=.tox --ignore=.nox --ignore=__pypackages__ --ignore=.uv --ignore=.cache \
            --ignore=.local --ignore=.playwright-mcp --ignore=.coverage --ignore=.hypothesis \
            --locale ru --locale bs --locale en
        working-directory: src/backend

      - name: Run i18n completeness tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
        run: uv run pytest apps/ads/tests/test_i18n_completeness.py apps/ads/tests/test_i18n_pipeline.py -v
        working-directory: src/backend

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      # --- Dependency vulnerability scanning ---
      - name: Run pip-audit (dependency vulnerabilities)
        run: uv run pip-audit
        working-directory: src/backend

      # --- Filesystem vulnerability + config scanning ---
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --- Secret scanning ---
      - name: Run gitleaks secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --exit-code 1 --report-format sarif --report-path gitleaks-results.sarif

      # --- SAST (static application security testing) ---
      # Runs from the repository root: pyproject.toml (the only bandit config in
      # the repo) and the scan roots are repo-relative. `working-directory:
      # src/backend` resolved the roots to src/backend/src/backend (absent) and
      # the config to src/backend/pyproject.toml (absent), so bandit aborted with
      # exit 2 and scanned nothing (12-OPS-001). Test trees are excluded via
      # [tool.bandit] exclude_dirs so the scan reports production code only.
      - name: Run SAST (bandit)
        run: uv run bandit -r src/backend src/telegram_bot -c pyproject.toml
        working-directory: .

      # --- SARIF uploads (runs even if scans find issues) ---
      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload gitleaks SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  load-test:
    runs-on: ubuntu-latest
    needs: build
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

      - name: Run migrations + seed reference data
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py bootstrap_reference_data
        working-directory: src/backend

      - name: Seed >100 published ads for load test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: |
          uv run python manage.py shell -c "
          from apps.ads.models import Ad, AdStatus
          from apps.categories.models import Category
          from apps.locations.models import City
          from django.contrib.auth import get_user_model
          from decimal import Decimal
          from django.db import transaction
          cat = Category.objects.first()
          city = City.objects.first()
          User = get_user_model()
          seller = User.objects.first() or User.objects.create_user('seller', telegram_id=999999)
          with transaction.atomic():
              for i in range(120):
                  Ad.objects.create(
                      title=f'Load test ad {i}',
                      category=cat,
                      city=city,
                      seller=seller,
                      price=Decimal('100'),
                      status=AdStatus.PUBLISHED,
                  )
          print('Seeded 120 published ads for load test')
          "
        working-directory: src/backend

      # Start the web server in the background
      - name: Start web server
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
        run: |
          uv run gunicorn config.wsgi:application \
            --bind 0.0.0.0:8000 --workers 2 --timeout 30 &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/ >/dev/null 2>&1; then
              echo "Web server ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Web server not ready" >&2
          exit 1

      - name: Run Locust load test
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
        run: |
          # The p95 gate is the locustfile's `_assert_p95` hook: it raises and
          # sets process_exit_code=1 when the run records no requests or when the
          # p95 exceeds PerformanceSLO.P95_SLO_MS (500 ms). The hook is the single
          # source of truth — there is deliberately no second CSV parser here.
          # The old step read column $6 of the stats CSV, which is "Average
          # Response Time", not a percentile: it compared the wrong number and
          # could not fail on p95. (PERF-001 validated 2026-09.)
          #
          # `pipefail` is required: `locust … | tee` alone returns tee's exit
          # status (0), so without it a non-zero locust exit — the hook's failure
          # signal — would be swallowed and the step would pass on a breach.
          set -e
          set -o pipefail
          uv run locust -f src/benchmark/locustfile.py \
            --headless --host http://localhost:8000 \
            --users 50 --spawn-rate 10 --run-time 60s \
            -L info \
            --csv=/tmp/locust-results 2>&1 | tee /tmp/locust-run.log
          # Positive control: the hooks must have emitted both verdicts. If an
          # event never fired (a locust API change) the gate is dead, and this
          # assertion turns that into a loud failure instead of a silent pass.
          # Only the within-SLO and zero-failure lines are accepted; a breach
          # would already have failed the step via pipefail.
          #
          # The failure verdict is what makes the run measure a site that
          # exists: a request to a non-existent route returns 404, which is
          # FAST, so it passes the p95 gate while discovering nothing. The
          # `_assert_no_failures` hook fails the job on any recorded failure,
          # so a slug that stops resolving cannot hide behind a good p95.
          # (PERF-012a validated 2026-09.)
          if ! grep -q "p95 response time .* is within SLO" /tmp/locust-run.log; then
            echo "::error::p95 gate did not report a within-SLO verdict"
            exit 1
          fi
          if ! grep -q "recorded no failed requests" /tmp/locust-run.log; then
            echo "::error::load test did not report a zero-failure verdict"
            exit 1
          fi

  # Deploy-check gate (12-OPS-021): run manage.py check --deploy against the
  # production settings module so deployment warnings (W-series) fail the
  # build. The previous step ran against config.settings.test and produced
  # 6 false-positive warnings that masked real gaps. No DB service container
  # is required: check --deploy is static (no custom deploy checks, no DB
  # connection). All required production env vars are set to valid non-secret
  # placeholders so the full prod settings import path is exercised.
  # The env block below is also read by the test job's
  # config/settings/tests/test_deploy_check_env_parity.py, which imports
  # config.settings.prod with exactly this set. Keep the block a non-empty YAML
  # mapping, and never add DJANGO_BUILD or DJANGO_ONESHOT here: either one
  # suppresses the guards and makes this gate pass without checking anything.
  deploy-check:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: "ci-deploy-check-secret-key-not-for-production-use-1234567890"
      BOT_TOKEN: ci-test-bot-token
      # Underscores: a real Telegram handle matches ^[A-Za-z0-9_]{3,32}$, and the
      # prod.py guard now requires BOT_USERNAME, so this fixture must be realistic.
      BOT_USERNAME: ci_test_bot
      GOOGLE_TRANSLATE_API_KEY: ci-test-translate-key
      SITE_URL: https://example.com
      ALLOWED_HOSTS: example.com
      CSRF_TRUSTED_ORIGINS: https://example.com
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
      EMAIL_HOST: smtp.example.com
      REDIS_URL: redis://localhost:6379/0
      LOG_MASK_KEY: ci-deploy-check-log-mask-key-not-for-production-use
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Run Django deploy checks
        run: uv run python manage.py check --deploy --fail-level WARNING
        working-directory: src/backend
