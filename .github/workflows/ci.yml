name: CI

on:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: mko-bazuna:ci
          cache-from: type=registry,ref=ghcr.io/manicko/mko-bazuna:buildcache
          cache-to: type=registry,ref=ghcr.io/manicko/mko-bazuna:buildcache,mode=max

      - name: Scan Docker image for vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mko-bazuna:ci
          exit-code: 1
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Docker image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py bootstrap_reference_data
        working-directory: src/backend

      - name: Install gettext (for compilemessages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Compile translations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
        run: |
          uv run python manage.py compilemessages \
            --ignore=.venv --ignore=.git --ignore=.kilo --ignore=__pycache__ --ignore='*.pyc' \
            --ignore=.mypy_cache --ignore=.ruff_cache --ignore=.pytest_cache --ignore=node_modules \
            --ignore=.tox --ignore=.nox --ignore=__pypackages__ --ignore=.uv --ignore=.cache \
            --ignore=.local --ignore=.playwright-mcp --ignore=.coverage --ignore=.hypothesis \
            --locale ru --locale bs --locale en
        working-directory: src/backend

      - name: Run pytest with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run pytest -m "not seed" -n auto --dist loadgroup --tb=short --cov --durations=10 --cov-report=term --cov-report=xml --reuse-db
        working-directory: src/backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/backend/coverage.xml
          retention-days: 30

      - name: Django deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py check --deploy
        working-directory: src/backend

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Run ruff
        run: uv run ruff check .
        working-directory: src/backend

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Run basedpyright
        run: uv run basedpyright .
        working-directory: src/backend

  lint-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Run djlint
        run: uv run djlint templates/
        working-directory: src/backend
        env:
          PYTHONPATH: .

  i18n:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py bootstrap_reference_data
        working-directory: src/backend

      - name: Install gettext (for compilemessages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Compile translations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
        run: |
          uv run python manage.py compilemessages \
            --ignore=.venv --ignore=.git --ignore=.kilo --ignore=__pycache__ --ignore='*.pyc' \
            --ignore=.mypy_cache --ignore=.ruff_cache --ignore=.pytest_cache --ignore=node_modules \
            --ignore=.tox --ignore=.nox --ignore=__pypackages__ --ignore=.uv --ignore=.cache \
            --ignore=.local --ignore=.playwright-mcp --ignore=.coverage --ignore=.hypothesis \
            --locale ru --locale bs --locale en
        working-directory: src/backend

      - name: Run i18n completeness tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
        run: uv run pytest apps/ads/tests/test_i18n_completeness.py apps/ads/tests/test_i18n_pipeline.py -v
        working-directory: src/backend

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check
        working-directory: src/backend

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group dev
        working-directory: src/backend

      # --- Dependency vulnerability scanning ---
      - name: Run pip-audit (dependency vulnerabilities)
        run: uv run pip-audit
        working-directory: src/backend

      # --- Filesystem vulnerability + config scanning ---
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --- Secret scanning ---
      - name: Run gitleaks secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --exit-code 1 --report-format sarif --report-path gitleaks-results.sarif

      # --- SARIF uploads (runs even if scans find issues) ---
      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload gitleaks SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks
