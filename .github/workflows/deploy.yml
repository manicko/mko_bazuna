name: Deploy

# B4 / finding 12-OPS-005: Formal deployment workflow replacing manual
# `docker compose up -d` with a gated, backup-then-pull-then-health-check
# procedure. Triggered manually via workflow_dispatch with GitHub Environments
# manual approval (environment: production).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA from the CI build to deploy. Defaults to the current commit SHA."
        required: false
        default: ""

permissions:
  contents: read
  packages: read

# Do NOT cancel in progress (12-OPS-009): two manual dispatches would otherwise
# interleave `pull` and `up -d` against one production host, and a half-applied
# mix of images can report green. A deploy must always run to completion or
# fail loudly.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image tag
        id: set_tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
            echo "No image_tag provided; using current commit SHA: $TAG"
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          # Coordinate note (12-OPS-009): the image is built by ci.yml under the
          # canonical ghcr.io/mko-bazuna/mko_bazuna coordinate. On the host, the
          # same coordinate is resolved by compose from .env.prod's
          # REGISTRY/REPOSITORY (docker-compose.prod.yml default matches).
          echo "Deploying coordinate: ghcr.io/mko-bazuna/mko_bazuna:$TAG"

      - name: Deploy to production via SSH
        id: deploy
        # appleboy/ssh-action receives the production SSH private key; pinning it
        # to a full commit SHA keeps that trust boundary immutable (12-OPS-017).
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          IMAGE_TAG: ${{ steps.set_tag.outputs.image_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /app

            # Capture the CI-provided image tag before sourcing .env.prod.
            # .env.prod ships a concrete pinned IMAGE_TAG (never a `latest`
            # default), and this value is threaded through explicitly below.
            CI_IMAGE_TAG="${IMAGE_TAG}"

            # Load production environment variables for POSTGRES_* and REGISTRY/REPOSITORY.
            set -a
            source .env.prod
            set +a

            # Restore the CI-provided image tag captured above, overriding any
            # IMAGE_TAG that .env.prod happens to define.
            export IMAGE_TAG="${CI_IMAGE_TAG}"

            # The production service set is declared ONCE, by
            # docker-compose.prod.yml itself (12-OPS-007). This deploy path does
            # NOT restate the set: it activates every profile-gated service and
            # runs `up -d --remove-orphans` with no service filter, so the
            # manifest is the single source of truth and a service added there
            # (with `restart:`) is started by the next deploy automatically. The
            # guard in test_deploy_workflow.py derives the restart:-carrying set
            # from the manifest and fails if the deploy path ever filters it out.
            COMPOSE_PROFILES="--profile scheduler --profile backup --profile pgbouncer"

            echo "=== Starting deployment of IMAGE_TAG=${IMAGE_TAG} ==="

            # Capture the currently running image tag before pulling/recreating.
            # Must be captured while old containers still run (before pull/up),
            # so it reflects the last-known-good IMAGE_TAG for potential rollback.
            PREVIOUS_IMAGE_TAG=$(docker compose images --format '{{.Tag}}' web | head -1)
            echo "Previous image tag: ${PREVIOUS_IMAGE_TAG:-none}"

            # a. Create a timestamped database backup (pre-deploy safety net).
            # The filename follows the ONE dump convention (dump_<timestamp>.dump,
            # 12-OPS-021): the compose backup loop, the Makefile, Makefile.ps1 and
            # every prune site match `dump_*.dump`, so a `backup-*.dump` name here
            # was never pruned and accumulated until the disk filled.
            echo "=== Step 1: Pre-deploy database backup ==="
            mkdir -p /app/backups
            docker compose ${COMPOSE_PROFILES} exec -T db pg_dump -U "${POSTGRES_USER}" "${POSTGRES_DB}" -F c \
              > "/app/backups/dump_$(date +%Y%m%d_%H%M%S).dump"
            echo "Database backup created."

            # b. Pull the new image (profiles so the profile-gated services are
            #    pulled too — scheduler, backup and pgbouncer).
            echo "=== Step 2: Pull new image ==="
            IMAGE_TAG="${IMAGE_TAG}" docker compose ${COMPOSE_PROFILES} -f docker-compose.yml -f docker-compose.prod.yml pull

            # c. Recreate every service (brief downtime; acceptable for this
            #    classifieds board). No service filter: the manifest decides the
            #    set, so the scheduler is not left on a stale image and the daily
            #    backup job is started.
            echo "=== Step 3: Recreate services ==="
            IMAGE_TAG="${IMAGE_TAG}" docker compose ${COMPOSE_PROFILES} -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # d. Health-check gate: poll /health/ready/ until 200 or timeout (60s)
            echo "=== Step 4: Health check gate ==="
            if timeout 60 bash -c 'while ! docker compose exec -T web curl -sf http://localhost:8000/health/ready/ > /dev/null 2>&1; do sleep 2; done'; then
              echo "Health check passed — /health/ready/ returned 200."
            else
              echo "ERROR: Health check FAILED after 60s timeout."
              echo "=== Attempting automated rollback ==="

              # No previous tag available — cannot roll back automatically.
              if [ -z "${PREVIOUS_IMAGE_TAG}" ] || [ "${PREVIOUS_IMAGE_TAG}" = "<none>" ]; then
                echo "ERROR: No previous image tag available for rollback (PREVIOUS_IMAGE_TAG is empty or '<none>')."
                echo "Manual rollback required. Runbook: https://github.com/manicko/mko_bazuna/blob/main/docs/ops/rollback.md"
                exit 1
              fi

              echo "Rolling back to previous image: ${PREVIOUS_IMAGE_TAG}"

              # Revert IMAGE_TAG to the previous known-good tag and pull it.
              IMAGE_TAG="${PREVIOUS_IMAGE_TAG}" docker compose ${COMPOSE_PROFILES} -f docker-compose.yml -f docker-compose.prod.yml pull

              # Recreate every service with the previous image (force-recreate so
              # Docker does not reuse containers keyed on the old image digest).
              # No service filter: a rollback that leaves the scheduler on the
              # image just judged faulty is not a rollback.
              echo "=== Step 4b: Recreate services with previous image ==="
              IMAGE_TAG="${PREVIOUS_IMAGE_TAG}" docker compose ${COMPOSE_PROFILES} -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

              # Re-poll /health/ready/ with a 30-second timeout to confirm rollback
              # restored a healthy state (curl runs inside the web container —
              # port 8000 is not published on the host).
              echo "=== Re-running health check for rollback validation (30s timeout) ==="
              if timeout 30 bash -c 'while ! docker compose exec -T web curl -sf http://localhost:8000/health/ready/ > /dev/null 2>&1; do sleep 2; done'; then
                echo "Rollback health check passed — /health/ready/ returned 200."
                echo "=== Rollback complete: reverted to IMAGE_TAG=${PREVIOUS_IMAGE_TAG} ==="
              else
                echo "ERROR: Rollback health check ALSO FAILED after 30s timeout."
                echo "Manual intervention required. Runbook: https://github.com/manicko/mko_bazuna/blob/main/docs/ops/rollback.md"
                exit 1
              fi
            fi

            echo "=== Deployment complete: IMAGE_TAG=${IMAGE_TAG} ==="

      - name: Deployment failed — rollback reference
        if: failure()
        run: |
          echo "::error::Deployment failed. See deploy step logs above for details."
          echo "::error::Follow the rollback procedure: https://github.com/manicko/mko_bazuna/blob/main/docs/ops/rollback.md"
          echo "::error::Or read the local copy: docs/ops/rollback.md"
