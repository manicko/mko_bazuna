name: Restore Test

# B5 / finding 12-OPS-006: Monthly automated restore-test validation.
# Validates backup integrity by restoring a test backup into an isolated
# PostgreSQL instance and verifying Django ORM migration compatibility via
# migrate --plan --check against the production app image.
on:
  schedule:
    - cron: "0 3 1-7 * 1" # First Monday of each month at 03:00 UTC
  workflow_dispatch: # Manual trigger for on-demand restore-test runs

concurrency:
  group: restore-test
  # Do NOT cancel — a restore-test must complete to validate backup integrity.
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
      # Recorded known-good application image for the migrate --plan --check step
      # (12-OPS-004). On a `schedule` trigger the commit-SHA expression is the
      # default-branch tip at fire time, which may have no pushed image, so the
      # monthly drill could fail at `docker pull` for a reason unrelated to backup
      # integrity. This tag is deliberately a RECORDED, CONCRETE release tag, not a
      # moving pointer: bump it when a new known-good release is published. The
      # guard test_restore_test_workflow.py::test_restore_test_pins_a_recorded_app_image
      # fails if this line regresses to a commit-SHA expression.
      RESTORE_APP_IMAGE_TAG: "2026.10.03"
    # B4 dependency: ci.yml build job pushes a SHA-tagged image to GHCR.
    # This job restores a real artifact and checks migration compatibility of
    # the RESTORE_APP_IMAGE_TAG image against the restored schema.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

      - name: Run migrations (bootstrap reference data)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py bootstrap_reference_data
        working-directory: src/backend

      - name: Generate self-generated smoke dump (ADDITIONAL check, not a real artifact)
        # HONEST LABEL (12-OPS-004): this dump is generated from the CI database
        # three steps earlier, so restoring it proves only that the round trip
        # works — NOT that any production artifact is restorable. It is kept as an
        # ADDITIONAL smoke test, labelled as what it is. The real-artifact half
        # (fetching the newest OFF-HOST production dump) is OPEN: see the
        # "Off-host real-artifact acquisition — OPEN NAMED TASK" note below.
        run: |
          mkdir -p backups
          pg_dump --no-sync -h localhost -U postgres -d mko_bazuna -F c > backups/test_backup.dump

      # ---------------------------------------------------------------------
      # Off-host real-artifact acquisition — OPEN NAMED TASK (12-OPS-004)
      # ---------------------------------------------------------------------
      # The 2026-10-04 coordinator ruling keeps the off-host half OPEN because
      # it is NOT implementable from this repository:
      #   * the `backup` container is postgres:18.6-alpine with `cap_drop: [ALL]`
      #     and `read_only: true` and tmpfs on /tmp only, so it has NO
      #     object-storage client binary (aws/gsutil/rclone are absent);
      #   * no storage SDK is in pyproject.toml;
      #   * any new credential would have to land in ALLOWED_ENV_VARS plus all
      #     four .env.*.example files in one commit.
      # Named infrastructure task: "Configure an off-host push from the `backup`
      # service (credentials + retention policy + a stated restore path) and make
      # restore-test.yml download and restore the newest production artifact."
      # Recorded in docs/ops/restore.md's scope statement. Until it lands, the
      # drill proves a real round trip of a labelled ADDITIONAL dump, not an
      # off-host production artifact.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull recorded known-good app image
        run: docker pull ghcr.io/mko-bazuna/mko_bazuna:${{ env.RESTORE_APP_IMAGE_TAG }}

      - name: Run restore-test with migrate --plan --check
        run: make restore-test BACKUP_FILE=backups/test_backup.dump APP_IMAGE=ghcr.io/mko-bazuna/mko_bazuna:${{ env.RESTORE_APP_IMAGE_TAG }}
