name: Restore Test

# B5 / finding 12-OPS-006: Monthly automated restore-test validation.
# Validates backup integrity by restoring a test backup into an isolated
# PostgreSQL instance and verifying Django ORM migration compatibility via
# migrate --plan --check against the production app image.
on:
  schedule:
    - cron: "0 3 1-7 * 1" # First Monday of each month at 03:00 UTC
  workflow_dispatch: # Manual trigger for on-demand restore-test runs

concurrency:
  group: restore-test
  # Do NOT cancel — a restore-test must complete to validate backup integrity.
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/backend
      # Pinned application image for the migrate --plan --check step (12-OPS-004).
      #
      # Why a DIGEST, not a tag (12-OPS-008): a tag is a mutable label, not an
      # identity. The previous pin (2026.10.03) was a placeholder copied from
      # .env.prod.example that never resolved in GHCR, so the monthly drill failed
      # at `docker pull` for a reason unrelated to backup integrity. An
      # unauthenticated tag->manifest probe was observed to be unreliable (401/404
      # under rate limiting), so the pin names the immutable digest directly
      # instead of depending on that resolution path.
      #
      # This value is a RECORDED, verified-published artifact identity — never a
      # run-time commit-SHA expression. It is bumped MANUALLY by an operator when
      # they decide a newer known-good image is needed; no automatic staleness
      # check exists, and a bump must update BOTH this digest and the
      # `source-commit:` comment below together.
      #
      # Why an OLDER pin is correct: the drill asks whether THIS image can operate
      # against a DB migrated by the checked-out HEAD tree. Pinning HEAD would make
      # the check trivially green and defeat its purpose; a schema newer than the
      # pinned image is exactly the drift the check exists to surface.
      #
      # Guard: src/backend/tests/test_restore_test_workflow.py::
      #   test_restore_test_pins_a_digest_of_a_published_image
      # source-commit: 57966ea0e6f8c5f41c3bdf20a98ba3e31a9204a8 (2026-10-15)
      RESTORE_APP_IMAGE: "ghcr.io/manicko/mko_bazuna@sha256:87cf5756a2e3ca57127d2f5ecaaa9fb02ab389a413fbb3ab9a9c04543a05fa70"
    # B4 dependency: ci.yml build job pushes an immutable SHA-tagged image to GHCR.
    # This job restores a real artifact and checks migration compatibility of
    # the digest-pinned RESTORE_APP_IMAGE against the restored schema.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mko_bazuna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "import psycopg; psycopg.connect('postgres://postgres:postgres@localhost:5432/mko_bazuna')" 2>/dev/null; then
              echo "Database ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Database unavailable after 30s" >&2
          exit 1
        working-directory: src/backend

      - name: Run migrations (bootstrap reference data)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mko_bazuna
          DJANGO_SECRET_KEY: test-secret-key-for-testing-only
        run: uv run python manage.py bootstrap_reference_data
        working-directory: src/backend

      - name: Generate self-generated smoke dump (ADDITIONAL check, not a real artifact)
        # HONEST LABEL (12-OPS-004): this dump is generated from the CI database
        # three steps earlier, so restoring it proves only that the round trip
        # works — NOT that any production artifact is restorable. It is kept as an
        # ADDITIONAL smoke test, labelled as what it is. The real-artifact half
        # (fetching the newest OFF-HOST production dump) is OPEN: see the
        # "Off-host real-artifact acquisition — OPEN NAMED TASK" note below.
        run: |
          mkdir -p backups
          pg_dump --no-sync "postgres://postgres:postgres@localhost:5432/mko_bazuna" -F c > backups/test_backup.dump

      # ---------------------------------------------------------------------
      # Off-host real-artifact acquisition — OPEN NAMED TASK (12-OPS-004)
      # ---------------------------------------------------------------------
      # The 2026-10-04 coordinator ruling keeps the off-host half OPEN because
      # it is NOT implementable from this repository:
      #   * the `backup` container is postgres:18.6-alpine with `cap_drop: [ALL]`
      #     and `read_only: true` and tmpfs on /tmp only, so it has NO
      #     object-storage client binary (aws/gsutil/rclone are absent);
      #   * no storage SDK is in pyproject.toml;
      #   * any new credential would have to land in ALLOWED_ENV_VARS plus all
      #     four .env.*.example files in one commit.
      # Named infrastructure task: "Configure an off-host push from the `backup`
      # service (credentials + retention policy + a stated restore path) and make
      # restore-test.yml download and restore the newest production artifact."
      # Recorded in docs/ops/restore.md's scope statement. Until it lands, the
      # drill proves a real round trip of a labelled ADDITIONAL dump, not an
      # off-host production artifact.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned app image resolves
        # Fail-fast preflight (12-OPS-004): a stale or mistyped pin must fail
        # LOUDLY and actionably BEFORE any restore work, never as a cryptic pull
        # error unrelated to backup integrity.
        #
        # The pinned handle is an OCI index (multi-arch). `docker manifest inspect`
        # proves the handle RESOLVES; it is not the authoritative existence/auth
        # proof — the `docker pull` step below remains authoritative for both.
        # Do NOT "fix" this to a platform-specific manifest: the index is the
        # published identity and that is what the pin names.
        #
        # The `|| { ...; exit 1; }` form is intentional and self-contained: this
        # step does not rely on `set -e` to propagate the failure.
        run: |
          docker manifest inspect "$RESTORE_APP_IMAGE" >/dev/null || {
            echo "::error::pinned restore-test image $RESTORE_APP_IMAGE does not resolve in GHCR — re-pin a known-good main commit's digest (12-OPS-004)"
            exit 1
          }

      - name: Pull recorded known-good app image
        run: docker pull "$RESTORE_APP_IMAGE"

      - name: Run restore-test with migrate --plan --check
        run: make restore-test BACKUP_FILE=backups/test_backup.dump APP_IMAGE=${{ env.RESTORE_APP_IMAGE }}
