{% load i18n %}
{% if not request.user.is_authenticated %}
    <a href="{% url 'consent:login_issue' %}"
       class="flex items-center justify-center w-11 h-11 rounded-lg text-gray-600 hover:bg-gray-100"
       aria-label="{% trans "Login" %}"
       data-header-auth-entry>
        <!-- Outline UserIcon, 20x20 -->
        <svg class="w-5 h-5"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             viewBox="0 0 24 24"
             aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
    </a>
{% else %}
    <button type="button"
            class="flex items-center justify-center w-11 h-11 rounded-lg hover:bg-gray-100"
            aria-label="{% trans "Account menu" %}"
            aria-haspopup="true"
            aria-expanded="false"
            data-header-auth-toggle>
        {% if request.user.avatar_url %}
            <img src="{{ request.user.avatar_url }}"
                 alt="{% trans "Account" %}"
                 class="w-8 h-8 rounded-full object-cover">
        {% else %}
            <!-- Filled UserIcon fallback, 20x20 -->
            <svg class="w-5 h-5"
                 fill="currentColor"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
        {% endif %}
    </button>
    <!-- Dropdown menu (hidden by default; toggled via vanilla JS) -->
    <div class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg z-50 hidden"
         data-header-auth-menu>
        <div class="py-1">
            <a href="{% url 'cabinet:home' %}"
               class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">{% trans "Cabinet" %}</a>
            <a href="{% url 'ads:dashboard' %}"
               class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">{% trans "My ads" %}</a>
            <a href="{% url 'cabinet:favorites' %}"
               class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">{% trans "Favorites" %}</a>
            {% if request.user.is_staff %}
                <a href="/admin/"
                   class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">{% trans "Admin" %}</a>
            {% endif %}
            <a href="{% url 'cabinet:settings' %}"
               class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">{% trans "Settings" %}</a>
            <form method="post" action="{% url 'consent:logout' %}" class="inline">
                {% csrf_token %}
                <button type="submit"
                        class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">{% trans "Logout" %}</button>
            </form>
        </div>
    </div>
{% endif %}
