{# HTMX heart toggle for favorite an ad. Rendered on listing cards and the
   detail page. POSTs to ads:favorite_toggle and swaps itself via outerHTML;
   anonymous taps swap in the login_prompt fragment instead (no 302). #}
{% load i18n %}
<form class="inline-block"
      hx-post="{% url 'ads:favorite_toggle' ad.id %}"
      hx-target="closest form"
      hx-swap="outerHTML"
      hx-on::after-request="document.dispatchEvent(new Event('favorite:toggled'))"
      aria-label="{% if is_favorited %}{% trans "Remove from favorites" %}{% else %}{% trans "Add to favorites" %}{% endif %}">
    <button type="submit"
            class="favorite-btn flex items-center justify-center w-9 h-9 rounded-full transition-colors
                   {% if is_favorited %}text-red-500{% else %}text-gray-400 hover:text-red-500{% endif %}"
            aria-pressed="{% if is_favorited %}true{% else %}false{% endif %}">
        {% if is_favorited %}
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        {% else %}
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 8.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
        {% endif %}
    </button>
</form>
