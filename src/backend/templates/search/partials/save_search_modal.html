<!-- HTMX-compatible modal for saving search alerts (FT-002).
     Posts to search:save-search and replaces itself with a success fragment.
     The dangling search:list hx-get was removed (that route does not exist). -->
{% load i18n %}
{% load localized_content %}

<div id="save-search-modal"
     class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">

    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
        <h3 class="text-lg font-semibold mb-4">🔔 {% trans "Save search alert" %}</h3>

        <form id="save-search-form"
              hx-post="{% url 'search:save-search' %}"
              hx-target="#save-search-modal"
              hx-swap="outerHTML"
              class="space-y-4">

            <!-- Query display (read-only) -->
            <div>
                <label class="block text-sm font-medium mb-1">{% trans "Search query" %}</label>
                <input type="text" name="query" value="{{ query|default:'' }}"
                       class="w-full px-3 py-2 border rounded-lg bg-gray-50" readonly>
            </div>

            <!-- City filter -->
            <div>
                <label class="block text-sm font-medium mb-1">{% trans "City (optional)" %}</label>
                <select name="city_id" class="w-full px-3 py-2 border rounded-lg">
                    <option value="">{% trans "Any city" %}</option>
                    {% for city in cities %}
                    <option value="{{ city.id }}"
                            {% if selected_city == city.id %}selected{% endif %}>
                        {{ city|get_city_name:LANGUAGE_CODE }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Category filter -->
            <div>
                <label class="block text-sm font-medium mb-1">{% trans "Category (optional)" %}</label>
                <select name="category_id" class="w-full px-3 py-2 border rounded-lg">
                    <option value="">{% trans "Any category" %}</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}"
                            {% if selected_category == category.id %}selected{% endif %}>
                        {{ category|get_category_name:LANGUAGE_CODE }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Price range -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-sm font-medium mb-1">{% trans "Min price (EUR)" %}</label>
                    <input type="number" name="min_price" value="{{ min_price|default:'' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="0" min="0">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">{% trans "Max price (EUR)" %}</label>
                    <input type="number" name="max_price" value="{{ max_price|default:'' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="999999" min="0">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-4">
                <button type="button"
                        onclick="var m=document.getElementById('save-search-modal'); if(m) m.remove();"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                    {% trans "Cancel" %}
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    {% trans "Save alert" %}
                </button>
            </div>
        </form>
    </div>
</div>
