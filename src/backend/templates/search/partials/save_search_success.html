<!-- Success fragment shown after a saved search is created (FT-002).
     Replaces the save-search modal via outerHTML swap. -->
{% load i18n %}
<div id="save-search-modal"
     class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
        <h3 class="text-lg font-semibold mb-2 text-green-600">✅ {% trans "Search saved" %}</h3>
        <p class="text-sm text-gray-600 mb-4">
            {% trans "You'll get a Telegram alert when new ads match this search." %}
        </p>
        <div class="flex justify-end pt-2">
            <button type="button"
                    onclick="var m=document.getElementById('save-search-modal'); if(m) m.remove();"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                {% trans "Close" %}
            </button>
        </div>
    </div>
</div>
