



<!DOCTYPE html>

<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm border-b">
        <div class="container mx-auto px-4 py-4">
            <h1 class="text-2xl font-bold text-gray-800">
                <a href="/">Mko Bazuna</a>

<div class="relative inline-block" id="lang-switcher">
    
    <button
        type="button"
        class="flex items-center gap-1 px-3 py-1 text-sm rounded hover:bg-gray-100 transition-colors"
        aria-haspopup="true"
        aria-expanded="false"
        data-lang-switcher-toggle
    >
        <span class="font-medium">RU</span>
        <svg class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>

    
    <div
        class="absolute right-0 mt-1 w-36 bg-white border border-gray-200 rounded-md shadow-lg z-50 hidden"
        data-lang-switcher-menu
    >
        
        
        

        
            <a
                href="?lang=ru"
                class="block px-4 py-2 text-sm transition-colors bg-gray-100 text-gray-900 font-medium cursor-default"
                data-lang="ru"
                data-lang-switcher-link
                aria-current="true"
            >
                Русский
            </a>
        
            <a
                href="?lang=bs"
                class="block px-4 py-2 text-sm transition-colors text-gray-700 hover:bg-gray-50 hover:text-gray-900"
                data-lang="bs"
                data-lang-switcher-link
                
            >
                bosanski
            </a>
        
            <a
                href="?lang=en"
                class="block px-4 py-2 text-sm transition-colors text-gray-700 hover:bg-gray-50 hover:text-gray-900"
                data-lang="en"
                data-lang-switcher-link
                
            >
                English
            </a>
        
    </div>
</div>

<script>
(function() {
    'use strict';

    const COOKIE_NAME = 'lang_pref';
    const COOKIE_PATH = '/';
    const COOKIE_MAX_AGE = 365 * 24 * 60 * 60; // 1 year in seconds
    const container = document.getElementById('lang-switcher');
    if (!container) return;

    const toggleBtn = container.querySelector('[data-lang-switcher-toggle]');
    const menu = container.querySelector('[data-lang-switcher-menu]');
    const links = container.querySelectorAll('[data-lang-switcher-link]');

    /**
     * Set a cookie with the given name, value, and options.
     */
    function setCookie(name, value, maxAge, path) {
        var parts = [
            encodeURIComponent(name) + '=' + encodeURIComponent(value),
            'max-age=' + maxAge,
            'path=' + path,
            'SameSite=Lax'
        ];
        document.cookie = parts.join('; ');
    }

    /**
     * Toggle dropdown visibility.
     */
    function toggleDropdown() {
        var isHidden = menu.classList.contains('hidden');
        if (isHidden) {
            menu.classList.remove('hidden');
            toggleBtn.setAttribute('aria-expanded', 'true');
        } else {
            menu.classList.add('hidden');
            toggleBtn.setAttribute('aria-expanded', 'false');
        }
    }

    /**
     * Close dropdown and reset ARIA state.
     */
    function closeDropdown() {
        menu.classList.add('hidden');
        toggleBtn.setAttribute('aria-expanded', 'false');
    }

    // Toggle on button click
    toggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleDropdown();
    });

    // On language link click: set cookie, then allow default navigation
    links.forEach(function(link) {
        link.addEventListener('click', function(e) {
            var lang = link.getAttribute('data-lang');
            if (lang) {
                setCookie(COOKIE_NAME, lang, COOKIE_MAX_AGE, COOKIE_PATH);
            }
            // Allow default browser navigation (href carries ?lang=X)
            closeDropdown();
        });
    });

    // Close dropdown on click outside
    document.addEventListener('click', function(e) {
        if (!container.contains(e.target)) {
            closeDropdown();
        }
    });

    // Close dropdown on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeDropdown();
            toggleBtn.focus();
        }
    });
})();
</script>
