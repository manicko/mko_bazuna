deployment_instructions:
  local_development:
    - step: 1
      action: "Copy .env.example to .env"
      command: "cp .env.example .env"
      
    - step: 2
      action: "Set ADMIN_PASSWORD in .env"
      note: "Set a development password for admin access"
      
    - step: 3
      action: "Start development environment"
      command: "docker compose -f docker-compose.yml -f docker-compose.dev.override.yml up -d"
      
    - step: 4
      action: "Apply migrations"
      command: "docker compose run --rm migrate"
      
    - step: 5
      action: "Create admin user (if not auto-created)"
      command: "docker compose run --rm web uv run python src/backend/manage.py create_admin_user --username admin --password <your-password> --telegram-id -1"
      
    - step: 6
      action: "Access Django admin"
      note: "Navigate to http://localhost:8000/admin/ and login with telegram_id=-1"
      
  production:
    - step: 1
      action: "Set environment variables"
      note: |
        Set the following in your production environment:
        - ADMIN_USERNAME (optional, default: admin)
        - ADMIN_PASSWORD (required - use secret management)
        - ADMIN_TELEGRAM_ID (optional, default: -1)
        
      secret_management_example: |
        # Using Docker secrets
        echo "your-secure-password" | docker secret create admin_password -
        
        # Or using environment file (not recommended for production)
        echo "ADMIN_PASSWORD=your-secure-password" >> .env.production
        
    - step: 2
      action: "Build and start services"
      command: "docker compose build && docker compose up -d"
      
    - step: 3
      action: "Verify admin user creation"
      command: "docker compose logs create_admin"
      
    - step: 4
      action: "Verify admin access"
      note: "Navigate to https://your-domain.com/admin/ and login with telegram_id=-1"
      
  ci_cd_integration:
    - step: 1
      action: "Add admin creation step after migrations"
      example: |
        # Example GitLab CI
        create_admin_user:
          stage: deploy
          script:
            - docker compose run --rm web uv run python src/backend/manage.py create_admin_user \
                --username "${ADMIN_USERNAME}" \
                --password "${ADMIN_PASSWORD}" \
                --telegram-id "${ADMIN_TELEGRAM_ID:- -1}"
          only:
            - main
            
    - step: 2
      action: "Ensure ADMIN_PASSWORD is available in CI environment"
      note: "Use CI secret variables or external secret management"

security_considerations:
  - "Use strong, unique passwords for admin accounts"
  - "In production, inject ADMIN_PASSWORD via secret management (Vault, AWS Secrets, Docker secrets)"
  - "Negative telegram_id (-1) prevents collision with real Telegram IDs"
  - "Never commit .env files to version control"
  - "Rotate admin passwords periodically"
  - "Admin user visible in Django admin list (expected behavior)"

rollback_procedure:
  - step: 1
    action: "To change admin password"
    command: |
      docker compose run --rm web uv run python -c "
      import os, django
      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings.prod')
      django.setup()
      from django.contrib.auth import get_user_model
      User = get_user_model()
      user = User.objects.get(telegram_id=-1)
      user.set_password('new-password')
      user.save()
      print('Password updated')
      "
      
  - step: 2
    action: "To delete admin user"
    command: |
      docker compose run --rm web uv run python -c "
      import os, django
      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings.prod')
      django.setup()
      from django.contrib.auth import get_user_model
      User = get_user_model()
      user = User.objects.get(telegram_id=-1)
      user.delete()
      print('Admin user deleted')
      "

