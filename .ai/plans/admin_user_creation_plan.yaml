# Admin User Creation Implementation Plan
# Mko Bazuna Django Project
# Created: 2026-07-22

---
overview: |
  The Mko Bazuna project uses a custom Django User model with `telegram_id` as the `USERNAME_FIELD`.
  This creates a conflict with Django's default admin authentication which expects a username field.
  
  This plan implements a management command `create_admin_user` that:
  1. Creates an admin user with a placeholder `telegram_id` (-1) for username/password authentication
  2. Integrates into the Docker deployment workflow as a one-shot service
  3. Follows project patterns for idempotent, environment-variable-based configuration
  4. Is skipped if ADMIN_PASSWORD is not set (allowing manual creation in development)

implementation_tasks:
  - task_id: "1"
    title: "Create management command create_admin_user.py"
    file_path: "src/backend/apps/core/management/commands/create_admin_user.py"
    description: |
      Create a Django management command that creates an admin user with:
      - Placeholder telegram_id (-1) for authentication
      - is_staff=True and is_superuser=True flags
      - Idempotent behavior (skips if user exists)
      - Optional dry-run mode for verification
      
    code_snippet: |
      """
      Management command to create an admin user for Django admin site.
      
      Creates a user with placeholder telegram_id for username/password authentication.
      This is needed because the User model uses telegram_id as USERNAME_FIELD.
      """
      
      import logging
      from django.core.management.base import BaseCommand
      from django.contrib.auth import get_user_model
      
      logger = logging.getLogger(__name__)
      
      
      class Command(BaseCommand):
          help = "Create an admin user for Django admin site (idempotent)"
      
          def add_arguments(self, parser) -> None:
              parser.add_argument(
                  "--username",
                  type=str,
                  required=True,
                  help="Admin username (stored in username field)",
              )
              parser.add_argument(
                  "--password",
                  type=str,
                  required=True,
                  help="Admin password",
              )
              parser.add_argument(
                  "--telegram-id",
                  type=int,
                  default=-1,
                  help="Placeholder telegram_id for admin user (default: -1)",
              )
              parser.add_argument(
                  "--email",
                  type=str,
                  default="",
                  help="Admin email (optional)",
              )
              parser.add_argument(
                  "--dry-run",
                  action="store_true",
                  help="Print what would be done without creating user",
              )
      
          def handle(self, *args, **options) -> None:
              username = options["username"]
              password = options["password"]
              telegram_id = options["telegram_id"]
              email = options["email"]
              dry_run = options["dry_run"]
      
              User = get_user_model()
      
              # Idempotent: skip if user already exists
              if User.objects.filter(telegram_id=telegram_id).exists():
                  self.stdout.write(self.style.WARNING(
                      f"Admin user with telegram_id={telegram_id} already exists, skipping"
                  ))
                  return
      
              if User.objects.filter(username=username).exists():
                  self.stdout.write(self.style.WARNING(
                      f"User with username='{username}' already exists, skipping"
                  ))
                  return
      
              if dry_run:
                  self.stdout.write(self.style.WARNING(
                      f"DRY RUN: Would create admin user:\n"
                      f"  username: {username}\n"
                      f"  telegram_id: {telegram_id}\n"
                      f"  email: {email}\n"
                      f"  is_staff: True\n"
                      f"  is_superuser: True"
                  ))
                  return
      
              # Create the admin user
              user = User.objects.create(
                  username=username,
                  telegram_id=telegram_id,
                  chat_id=telegram_id,
                  email=email,
                  is_staff=True,
                  is_superuser=True,
              )
              user.set_password(password)
              user.save()
      
              logger.info("Admin user created: %s (telegram_id=%s)", username, telegram_id)
              self.stdout.write(self.style.SUCCESS(
                  f"Admin user created:\n"
                  f"  username: {username}\n"
                  f"  telegram_id: {telegram_id}\n"
                  f"  is_staff: True\n"
                  f"  is_superuser: True"
              ))
      
    verification_steps:
      - "Run: uv run python src/backend/manage.py create_admin_user --username testadmin --password testpass123 --telegram-id -1 --dry-run"
      - "Verify output shows DRY RUN message"
      - "Run without --dry-run and verify user is created in database"
      - "Run again to verify idempotent behavior (should skip)"
      
  - task_id: "2"
    title: "Create __init__.py files for management directory structure"
    file_paths:
      - "src/backend/apps/core/management/__init__.py"
      - "src/backend/apps/core/management/commands/__init__.py"
    description: |
      Create the required __init__.py files to make the management 
      directories Python packages. These files must exist for Django 
      to discover management commands.
      
    verification_steps:
      - "Verify files exist: ls src/backend/apps/core/management/__init__.py"
      - "Verify files exist: ls src/backend/apps/core/management/commands/__init__.py"
      - "Run: uv run python src/backend/manage.py help create_admin_user"
      - "Verify command is listed in help output"
      
  - task_id: "3"
    title: "Update .env.example with admin credentials"
    file_path: ".env.example"
    description: |
      Add environment variables for admin user configuration:
      - ADMIN_USERNAME: Admin username (default: admin)
      - ADMIN_PASSWORD: Admin password (required for auto-creation)
      - ADMIN_TELEGRAM_ID: Placeholder telegram_id (default: -1)
      
    code_snippet: |
      # Admin user credentials for Django admin site
      # Note: Admin login uses telegram_id, so enter the telegram_id value 
      # as the username in the admin login form.
      ADMIN_USERNAME=admin
      ADMIN_PASSWORD=  # Set in production via secret management
      ADMIN_TELEGRAM_ID=-1  # Placeholder ID for admin users
      
    verification_steps:
      - "Verify variables are added to .env.example"
      - "Check format matches existing variable style"
      - "Ensure no trailing whitespace or syntax errors"
      
  - task_id: "4"
    title: "Update docker-compose.yml with create_admin service"
    file_path: "docker-compose.yml"
    description: |
      Add a new one-shot service `create_admin` that:
      - Runs after migrations complete
      - Creates admin user if ADMIN_PASSWORD is set
      - Is idempotent (safe to run multiple times)
      - Skips gracefully if ADMIN_PASSWORD not set
      
    code_snippet: |
      create_admin:
        build:
          context: .
          dockerfile: docker/Dockerfile
        command: >
          uv run python src/backend/manage.py create_admin_user
          --username "${ADMIN_USERNAME:-admin}"
          --password "${ADMIN_PASSWORD}"
          --telegram-id "${ADMIN_TELEGRAM_ID:--1}"
        depends_on:
          migrate:
            condition: service_completed_successfully
        environment:
          - UV_PROJECT_ENVIRONMENT=/opt/venv
          - DJANGO_SETTINGS_MODULE=config.settings.prod
        env_file:
          - .env
        # One-shot service: runs once, then exits
      
    placement: |
      Add the create_admin service after the migrate service (around line 41).
      The service should be placed before web and bot services.
      
    verification_steps:
      - "Verify service is added after migrate service"
      - "Run: docker compose config to validate YAML syntax"
      - "Check service dependencies are correct"
      
  - task_id: "5"
    title: "Update docs/ops/docker-deployment.md with admin setup instructions"
    file_path: "docs/ops/docker-deployment.md"
    description: |
      Add documentation for:
      - Admin user creation process
      - Environment variable configuration
      - Manual creation commands
      - Security considerations for production
      
    code_snippet: |
      ## Admin User Setup
      
      ### Automatic Creation
      
      The `create_admin` service automatically creates an admin user during 
      deployment if `ADMIN_PASSWORD` is set in the environment.
      
      ### Environment Variables
      
      | Variable | Required | Default | Description |
      |----------|----------|---------|-------------|
      | `ADMIN_USERNAME` | No | `admin` | Admin username |
      | `ADMIN_PASSWORD` | Yes* | - | Admin password |
      | `ADMIN_TELEGRAM_ID` | No | `-1` | Placeholder telegram_id |
      
      *Required for automatic creation; admin can be created manually if not set.
      
      ### Manual Creation
      
      If `ADMIN_PASSWORD` is not set, create the admin user manually:
      
      ```bash
      docker compose run --rm web uv run python src/backend/manage.py create_admin_user \
          --username admin \
          --password your_secure_password \
          --telegram-id -1
      ```
      
      ### Admin Login
      
      The Django admin login form will show "Telegram ID" as the login field.
      Enter the `ADMIN_TELEGRAM_ID` value (default: `-1`) as the username.
      
      ### Security Notes
      
      - Use strong, unique passwords
      - In production, inject `ADMIN_PASSWORD` via secret management
      - Never commit `.env` file to version control
      - Rotate admin passwords periodically

