# Search Autocomplete Enhancement Implementation Plan
# Generated: 2026-07-26
# Phase: 2 Plan 1
#
# Execution DAG: Tasks ordered by dependencies (top = no dependencies, bottom = depends on above)

tasks:
  # T1: PopularSearch model - NEW MODEL (HIGH RISK)
  # Creates the popular searches tracking table for recording search frequency
  - task_id: T1
    description: |
      Create PopularSearch model in apps/analytics/models.py for tracking popular search terms.
      Model stores normalized search queries with hit counts and timestamps.
    target_symbol: AnalyticsEvent
    target_file: src/backend/apps/analytics/models.py
    dependencies: []
    risk: high
    rationale: |
      New database model requires migration. Must follow existing patterns:
      - Use StrEnum for any constants (none needed here)
      - Include db_table naming convention
      - Indexed on query field for fast prefix lookups
    operations:
      - add_model: PopularSearch
        fields:
          - id: BigAutoField (primary key)
          - query: CharField(max_length=200, db_index=True)
          - hit_count: PositiveIntegerField(default=1)
          - last_searched_at: DateTimeField(auto_now=True)
      - add_db_index: IX_popular_searches_query_gist (optional for prefix search)
      - add_to_meta_indexes:
        - name: IX_popular_searches_query
          fields: [query]

  # T2: SearchHistory model - NEW MODEL (HIGH RISK)
  - task_id: T2
    description: |
      Create SearchHistory model in apps/analytics/models.py for user-specific search history.
      Model links searches to authenticated users with timestamps.
    target_symbol: PopularSearch
    target_file: src/backend/apps/analytics/models.py
    dependencies: [T1]
    risk: high
    rationale: |
      New database model requires migration. Depends on User and AnalyticsEventType models.
      Must follow existing patterns:
      - Nullable user field (browsing users have no history)
      - Indexed for user-specific lookups
      - Clean CASCADE on user deletion
    operations:
      - add_model: SearchHistory
        fields:
          - id: BigAutoField (primary key)
          - user: ForeignKey(to='users.User', on_delete=models.CASCADE, null=True, blank=True)
          - query: CharField(max_length=200)
          - created_at: DateTimeField(auto_now_add=True)
      - add_to_meta_indexes:
        - name: IX_search_history_user
          fields: [user_id, "-created_at"]

  # T3: SearchSuggestionSource enum - NEW ENUM (LOW RISK)
  - task_id: T3
    description: |
      Add SearchSuggestionSource StrEnum to apps/core/enums.py for categorizing
      autocomplete suggestion origins.
    target_symbol: AnalyticsEventType
    target_file: src/backend/apps/core/enums.py
    dependencies: []
    risk: low
    rationale: |
      New enum type following existing StrEnum patterns. Used by services layer
      to distinguish suggestion sources in responses.
    operations:
      - add_enum: SearchSuggestionSource
        values:
          - USER_HISTORY: "user_history"
          - POPULAR_SEARCH: "popular_search"
          - CATEGORY: "category"
          - CITY: "city"

  # T4: Migration for new models - DATABASE MIGRATION (HIGH RISK)
  - task_id: T4
    description: |
      Generate Django migration for PopularSearch and SearchHistory models.
      Migration file: apps/analytics/migrations/0002_search_autocomplete.py
    target_symbol: Migration
    target_file: src/backend/apps/analytics/migrations/0002_search_autocomplete.py
    dependencies: [T1, T2]
    risk: high
    rationale: |
      Database schema change. Must be atomic - both models in single migration.
      Migration will be auto-generated via `python manage.py makemigrations`.
    operations:
      - create_migration: apps/analytics/migrations/0002_search_autocomplete.py

  # T5: Query sanitization utility - REUSE EXISTING
  - task_id: T5
    description: |
      Create sanitize_autocomplete_query function in apps/core/utils/sanitize.py.
      Extends existing sanitization with autocomplete-specific rules:
      - Minimum 2 characters for non-trivial suggestions
      - Maximum 100 characters to prevent abuse
      - Remove SQL injection patterns
    target_symbol: sanitize_query_for_log
    target_file: src/backend/apps/core/utils/sanitize.py
    dependencies: []
    risk: low
    rationale: |
      Extension of existing sanitization utility. Follows established pattern.
      Not a new file - extends existing module.
    operations:
      - add_function: sanitize_autocomplete_query
        signature: (query: str) -> str
        args:
          - query: str (raw user input, 2-100 chars expected)
        returns: Sanitized query string safe for database operations

  # T6: Rate limiting utility - SHARED SERVICE
  - task_id: T6
    description: |
      Create rate_limit_autocomplete function in apps/search/services/rate_limit.py.
      Implements IP-based rate limiting using Django cache.
      Limits: 30 requests per minute per IP (configurable).
    target_file: src/backend/apps/search/services/rate_limit.py
    dependencies: [T5]
    risk: medium
    rationale: |
      New service module. Uses Django cache for distributed rate limiting.
      Must handle anonymous users (no session) via IP address.
      Rate limit constants should use module-level Final values (following rule 10).
    operations:
      - create_module: src/backend/apps/search/services/rate_limit.py
      - add_function: rate_limit_autocomplete
        signature: (request: HttpRequest) -> bool (True = allowed, False = rate limited)

  # T7: Popular search service - BUSINESS LOGIC
  - task_id: T7
    description: |
      Create increment_popular_search and get_popular_suggestions functions
      in apps/search/services/popular_search.py.
      Uses PopularSearch model for tracking and suggesting popular queries.
    target_symbol: translate_cached
    target_file: src/backend/apps/search/services/popular_search.py
    dependencies: [T1, T6]
    risk: medium
    rationale: |
      Pure service functions following existing patterns (query_translator.py).
      No mutation of existing models. Safe isolated addition.
    operations:
      - create_module: src/backend/apps/search/services/popular_search.py
      - add_function: increment_popular_search
        signature: (query: str) -> None
      - add_function: get_popular_suggestions
        signature: (prefix: str, limit: int = 5) -> list[str]

  # T8: Search history service - BUSINESS LOGIC
  - task_id: T8
    description: |
      Create get_user_search_history function in apps/search/services/search_history.py.
      Returns recent search queries for authenticated users only.
    target_symbol: translate_cached
    target_file: src/backend/apps/search/services/search_history.py
    dependencies: [T2, T6]
    risk: medium
    rationale: |
      Pure service function. Depends on SearchHistory model.
      Must check user authentication before returning history.
    operations:
      - create_module: src/backend/apps/search/services/search_history.py
      - add_function: get_user_search_history
        signature: (user: User | AnonymousUser, limit: int = 5) -> list[str]

  # T9: Entity name suggestions service - BUSINESS LOGIC
  - task_id: T9
    description: |
      Create get_entity_suggestions function in apps/search/services/entity_suggestions.py.
      Returns matching category and city names for autocomplete.
      Uses existing Category and City models.
    target_symbol: translate_cached
    target_file: src/backend/apps/search/services/entity_suggestions.py
    dependencies: [T3, T5]
    risk: low
    rationale: |
      Service function using existing models. No schema changes.
      Must filter active categories and use case-insensitive prefix matching.
    operations:
      - create_module: src/backend/apps/search/services/entity_suggestions.py
      - add_function: get_entity_suggestions
        signature: (prefix: str, limit: int = 5) -> list[str]

  # T10: AutocompleteView - API ENDPOINT
  - task_id: T10
    description: |
      Create AutocompleteView in apps/search/views/autocomplete.py.
      Endpoints: GET /api/search/autocomplete
      Returns JSON with suggestions from all sources merged and deduplicated.
      Query parameters: q (search prefix), limit (optional)
    target_symbol: search
    target_file: src/backend/apps/search/views/autocomplete.py
    dependencies: [T3, T5, T6, T7, T8, T9]
    risk: medium
    rationale: |
      New view that aggregates multiple suggestion sources.
      Must implement:
      - Query parameter parsing
      - Source prioritization (history > popular > entities)
      - Response format with source attribution
      - Rate limiting check before processing
    operations:
      - create_module: src/backend/apps/search/views/autocomplete.py
      - add_view: AutocompleteView
        methods: [get]
        response_format: JSON with suggestions list

  # T11: URL routing - CONFIGURATION
  - task_id: T11
    description: |
      Add autocomplete endpoint to apps/search/urls.py.
      Route: /api/search/autocomplete -> AutocompleteView
    target_symbol: search
    target_file: src/backend/apps/search/urls.py
    dependencies: [T10]
    risk: low
    rationale: |
      Configuration-only change. Adds new route without modifying existing patterns.
      Uses class-based view pattern consistent with Django conventions.
    operations:
      - add_route:
        path: api/search/autocomplete/
        view: AutocompleteView
        name: autocomplete

  # T12: Search view integration - UPDATE EXISTING
  - task_id: T12
    description: |
      Update apps/search/views/search.py to record searches in PopularSearch
      and SearchHistory after successful search execution.
    target_symbol: search
    target_file: src/backend/apps/search/views/search.py
    dependencies: [T1, T2, T7, T8]
    risk: medium
    rationale: |
      Modifies existing production code. Must be careful to:
      - Call tracking AFTER successful search (not on empty/failed)
      - Not break existing page rendering logic
      - Handle edge cases (no query, anonymous users)
    operations:
      - add_import: apps.search.services.popular_search
      - add_import: apps.search.services.search_history
      - modify_function: search
        additions:
          - After line 71 (after analytics event): record popular search
          - After analytics: record user history if authenticated

  # T13: Tests - VERIFICATION
  - task_id: T13
    description: |
      Create tests/test_autocomplete.py in apps/search/tests/.
      Test cases:
      - PopularSearch model creation and hit count incrementing
      - SearchHistory model creation for authenticated users
      - sanitize_autocomplete_query edge cases
      - Rate limiting enforcement
      - get_popular_suggestions returns sorted results
      - get_user_search_history returns empty for anonymous
      - AutocompleteView returns merged suggestions
      - Endpoints accessible without authentication
    target_symbol: search
    target_file: src/backend/apps/search/tests/test_autocomplete.py
    dependencies: [T1, T2, T5, T6, T7, T8, T9, T10]
    risk: low
    rationale: |
      New test file. Tests integration of all components.
      Uses existing test patterns from tests.py.
    operations:
      - create_test_file: src/backend/apps/search/tests/test_autocomplete.py

