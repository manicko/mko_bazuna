id: TASK_065_Final_regeneration_output_css

title: Final regeneration of output.css (safety re-run after template edits)

priority: medium

depends_on:
  - TASK_064_Replace_prose_wrapper_detail_html

source_reference: .ai/plans/08_design-system-css-pipeline_plan.md
source_section: TSK-005 — Final regeneration of output.css

description: >
  Re-run the Tailwind CLI build after the prose template edit to guarantee
  class coverage is still correct. TSK-004 only removes non-Tailwind
  classes (prose, max-w-none) and swaps in mb-6 (already covered), so
  the regenerated output.css is expected to be byte-identical to TSK-003.
  Included per spec §8 sequencing rule: regenerate AFTER any template edits.

goals:
  - Confirm no class was inadvertently dropped after template edit
  - Produce byte-identical (or equivalent) output.css
  - Maintain spec sequencing discipline for future template changes

files:
  - path: src/theme/static/theme/css/output.css

changes:

  - action: run_command

    description: >
      Re-run the same Docker Tailwind CLI build command.

    code_hint: |
      docker compose exec web tailwindcss -i src/theme/static/theme/css/input.css -o src/theme/static/theme/css/output.css --minify

acceptance_criteria:
  - Build succeeds (exit code 0)
  - output.css selector count remains ~291 (no regression)
  - 17 acceptance classes from VFY-001 checklist remain present
  - File committed if different from TSK-003 result (expected: no diff)

risk_level: low
risk_mitigation: >
  No build-config changes since TSK-003. Same CLI, same input.
  Re-run is a safety measure per spec §8 Risk table sequencing rule.
