id: task_032_phase1_web_search_views

title: Web listing + FTS search views

priority: high

depends_on:
  - task_022_phase1_core_models
  - task_023_phase1_categories_locations
  - task_027_phase1_lifecycle_indexes

source_reference: .ai/plans/01_detailed_plan_publish_discover.md
source_section: Task 11 — Web Listing + FTS Search Views

description: >
  Public browsing + search (US-B1/B2/B3/B6/B7). HTMX MPA, no login for PUBLISHED ads.

goals:
  - listings view: category subtree (get_descendants), city (exact + difflib did-you-mean), price range, sort date/price, empty-state
  - search view: FTS on search_vector (GIN), Bosnian->Russian via deep-translator (timeout ~500ms, fallback, 5-min cache), one-word fuzzy category detect
  - templates: list.html, detail.html with contact button (decision C, deep-link logic Phase 3)
  - XSS-safe templates

files:
  - path: src/backend/apps/ads/views/listings.py
    targets:
      - type: module
        name: apps.ads.views.listings
  - path: src/backend/apps/search/views/search.py
    targets:
      - type: module
        name: apps.search.views.search
  - path: src/backend/apps/search/services/query_translator.py
    targets:
      - type: module
        name: apps.search.services.query_translator
  - path: src/backend/templates/ads/list.html
    targets:
      - type: file
        name: templates/ads/list.html
  - path: src/backend/templates/ads/detail.html
    targets:
      - type: file
        name: templates/ads/detail.html

changes:
  - action: add_code
    description: Implement listing/search views, query translator, templates.

acceptance_criteria:
  - no login required for PUBLISHED ads
  - search uses GIN search_vector; Bosnian query translated before search
  - did-you-mean for city typos via difflib.get_close_matches
  - one-word queries apply fuzzy category_id filter
  - templates autoescape / XSS-safe
  - empty-state friendly message
