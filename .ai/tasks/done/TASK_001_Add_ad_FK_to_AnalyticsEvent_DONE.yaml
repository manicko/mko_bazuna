id: TASK_001_Add_ad_FK_to_AnalyticsEvent

title: Add ad ForeignKey to AnalyticsEvent model

priority: high

source_reference: .ai/plans/02/Seller Dashboard Statistics/plan.md
source_section: T0: Add ad_id ForeignKey to AnalyticsEvent (BLOCKING PREREQUISITE)

description: >
  Add nullable ForeignKey field `ad` to AnalyticsEvent model to associate events
  with specific ads. Without this field, per-ad statistics are impossible.

goals:
  - Enable per-ad analytics tracking
  - Preserve existing events without ad association (nullable field)
  - Maintain referential integrity with CASCADE deletion

files:
  - path: src/backend/apps/analytics/models.py

    targets:
      - type: class
        name: AnalyticsEvent

    semantic_anchors:
      insert_after:
        type: field
        name: user

      insert_before:
        type: method
        value: save

changes:
  - action: add_field

    description: >
      Add nullable ForeignKey field ad to AnalyticsEvent class for ad association.

    code_hint: |
      ad = models.ForeignKey(
          "ads.Ad",
          on_delete=models.CASCADE,
          null=True,
          blank=True,
          related_name="analytics_events",
          help_text="Ad associated with this event (null for non-ad events)",
      )

acceptance_criteria:
  - Migration creates successfully with --check --dry-run
  - Field is nullable in database schema
  - related_name allows reverse lookup from Ad to analytics_events
  - Type checking passes on models.py
  - Lint check passes on models.py

risk_level: medium
risk_mitigation: >
  Field is nullable for events without ad association.
  on_delete=CASCADE ensures referential integrity.
  Migration can be tested locally before production.