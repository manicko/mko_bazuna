      Import and call TrustCalculator.calculate_and_save after ad publish.

    code_hint: |
      # In _pass_moderation():
      from apps.trust.services.trust_calculator import TrustCalculator
      TrustCalculator().calculate_and_save(ad.user)

acceptance_criteria:
  - TrustCalculator imported in auto_moderation.py
  - Called after set_published(ad)
  - Type checking passes on auto_moderation.py
  - Lint check passes on auto_moderation.py

risk_level: medium
risk_mitigation: >
  Changes additive to existing flow.
  Score calculation isolated from core moderation logic.