id: TASK_053_Hook_trust_score_to_auto_moderation

title: Hook trust score calculation to ad publish

priority: medium

depends_on:
  - TASK_020_Create_TrustCalculator_service
  - TASK_001_Add_ad_FK_to_AnalyticsEvent

source_reference: .ai/plans/02/Trust Signals System/plan.md
source_section: T13: Hook Score Updates to Publish

description: >
  Update _pass_moderation() in apps/moderation/services/auto_moderation.py
  to call TrustCalculator after successful ad publish.

goals:
  - Calculate trust score after ad published
  - Update both AnalyticsEvent and SellerTrustScore
  - Maintain performance with async pattern

files:
