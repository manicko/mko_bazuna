id: task_044_phase3_consent_soft_delete

title: Consent revocation + soft delete (decision F/K, R1)

priority: high

depends_on:
  - task_025_phase1_moderation_analytics_models

source_reference: .ai/plans/03_detailed_plan_contact_dashboard.md
source_section: Task 4 — Consent Revocation + Soft Delete (decision F/K, R1)

description: >
  Proper erasure flow (US-S8). Phase 3 implements consent state + immediate soft-delete;
  hard-delete is Phase 4. Two distinct consent states (zone R3).

goals:
  - DECLINE (browse-only, decision K): blocks only seller actions; consent_revoked_at NOT set; is_deleted NOT set; NO deletion; contact button still works
  - WITHDRAW/DELETE (decision F): consent_revoked_at=now(); is_deleted=True, deleted_at=now(); telegram_id/username NULLed IMMEDIATELY; all user ads+images soft-deleted
  - Phase 3 does NOT implement 30-day sweep (Phase 4 consent_hard_delete)
  - Phase 4 handoff: 30 days after consent_revoked_at -> hard delete via IX_users_erasure_sweep

files:
  - path: src/backend/apps/users/services/deletion.py
    targets:
      - type: module
        name: apps.users.services.deletion

changes:
  - action: add_code
    description: Implement decline vs withdraw flows + immediate soft-delete + PII nulling.

acceptance_criteria:
  - decline: no consent_revoked_at, no deletion, contact works
  - withdraw: sets consent_revoked_at + is_deleted, immediately nulls PII, soft-deletes ads
  - 30-day sweep NOT implemented in Phase 3 (Phase 4 owns it)
  - two consent states clearly separated (decline != withdraw)
