id: task_043_phase3_account_states

title: Account states separation (O1/R4)

priority: high

depends_on:
  - task_022_phase1_core_models

source_reference: .ai/plans/03_detailed_plan_contact_dashboard.md
source_section: Task 3 — Account States Separation (O1/R4)

description: >
  Distinguish ban vs delete vs publish-restriction (US-S9, US-A4). Three independent flags.

goals:
  - is_banned=True (admin): blocks login/publish; PII retained; admin can unban; bot rejects new ads
  - is_deleted=True + consent_revoked_at (withdrawal): immediate soft-delete cascade + 30-day hard delete (Phase 4); telegram_id/username nulled immediately
  - ads_auto_publish=False (US-S9): bot rejects NEW ads; existing ads hidden while flag active; NOT linked to ban/delete
  - dashboard shows state badges
  - bot permission middleware checks all three flags on every message

files:
  - path: src/backend/apps/users/services/account_state.py
    targets:
      - type: module
        name: apps.users.services.account_state
  - path: src/telegram_bot/middlewares/permissions.py
    targets:
      - type: module
        name: telegram_bot.middlewares.permissions

changes:
  - action: add_code
    description: Implement account-state service + bot permission middleware.

acceptance_criteria:
  - three flags independent and correctly enforced
  - banned: PII kept, unban via admin
  - ads_auto_publish=False: new ads rejected, existing hidden, reversible
  - bot middleware checks all three flags per message
  - no conflation of ban vs delete vs restriction
