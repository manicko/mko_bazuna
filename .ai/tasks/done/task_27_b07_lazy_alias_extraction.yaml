    - "uv run ruff check src/telegram_bot/handlers/ad_create/submit.py"
    - "uv run basedpyright src/telegram_bot/handlers/ad_create/submit.py"
  assertion_level: >
    Lock-timeout tests green (ru/bs rendering); fresh extraction keeps the three msgids; reverse
