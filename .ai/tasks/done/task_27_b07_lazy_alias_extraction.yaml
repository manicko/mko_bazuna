  - telegram_bot/tests/test_lock_timeout_boundary.py is green (the three replies render in ru/bs)
  - the three msgids remain present in all three catalogs with non-empty ru/bs msgstr
  - _EXTRACTION_GAP_MSGIDS is retired (or retained with a pointer to the ruling); the reverse gate
    stays green
  - no "gettext_lazy as _lazy" alias remains anywhere in src/
  - i18n gates (test_i18n_completeness.py, test_i18n_pipeline.py, test_i18n_category_city.py) and the
    fast gate are green; ruff/basedpyright clean on the touched module
  - POT-Creation-Date stays synced across the three catalogs

