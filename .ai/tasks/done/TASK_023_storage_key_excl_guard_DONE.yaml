id: task_023_storage_key_excl_guard

title: Guard storage-key write against collision (MED-006)

priority: medium

depends_on:
  - task_021_media_delete_helper

source_reference: .ai/audit/99-validation/07-media-validated-findings.md
source_section: "MED-006"

description: >
  save_photo opens the media path with no existence check, so a (negligible)
  UUID-v4 collision would silently overwrite another ad's photo. Use
  os.open with O_CREAT | O_EXCL | O_WRONLY; on collision regenerate the key and
  retry.

goals:
  - write is atomic and collision-safe
  - never silently overwrites an existing file

files:
  - path: src/telegram_bot/services/media.py
    targets:
      - type: function
        name: save_photo (write path)
    semantic_anchors:
      edit_block:
        type: statement
        value: "open(media_path, \"wb\")"

changes:
  - action: replace
    description: >
      Replace open().write() with os.open(O_CREAT|O_EXCL|O_WRONLY) + os.write,
      regenerating the storage key on FileExistsError.

acceptance_criteria:
  - collision triggers key regeneration, not overwrite
  - happy-path write unchanged
