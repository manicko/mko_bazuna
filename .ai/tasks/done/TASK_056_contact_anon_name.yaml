id: task_056_contact_anon_name

title: Send anonymous label instead of buyer real name (EXT-004)

priority: high

depends_on:
  - task_032_contact_delegate

source_reference: .ai/audit/99-validation/09-external-api-validated-findings.md
source_section: "EXT-004"

description: >
  handle_contact builds the seller notification from the buyer's real
  first_name/last_name, contradicting the documented anonymous/no-PII design.
  Replace the buyer display name with a fixed anonymous label ("Покупатель" /
  "Buyer"); the buyer may disclose identity voluntarily in free text. Update the
  module docstring to reflect anonymous forwarding.

goals:
  - no buyer real name leaked to the seller
  - docstring matches actual anonymous behavior

files:
  - path: src/telegram_bot/handlers/contact.py
    targets:
      - type: function
        name: handle_contact (notification)
    semantic_anchors:
      edit_line:
        type: statement
        value: "buyer_name = _get_buyer_display_name(message.from_user)"

changes:
  - action: replace
    description: Use a fixed anonymous label in the seller notification; update module docstring.

acceptance_criteria:
  - seller notification contains no buyer real name
  - docstring reflects anonymous forwarding
