id: task_024_draft_photo_cleanup

title: Unlink physical files on draft cancel / delete (AD-004, MED-004)

priority: medium

depends_on:
  - task_017_atomic_domain_writes
  - task_021_media_delete_helper

source_reference: .ai/audit/99-validation/05-ad-lifecycle-validated-findings.md
source_section: "AD-004"
source_reference_2: .ai/audit/99-validation/07-media-validated-findings.md
source_section_2: "MED-004"

description: >
  DRAFT photos written to MEDIA_ROOT during the FSM photo step are never
  removed when the user cancels, the bot crashes, or moderation fails before
  commit. Track storage_keys written during the FSM photo step and unlink each
  via delete_photo() in delete_draft and cmd_cancel before ORM deletion.
  (sweep_drafts unlink is handled in task_045.)

goals:
  - no orphaned DRAFT photo files after cancel/timeout/delete
  - reuses existing immediate-write pattern (no temp-staging redesign)

files:
  - path: src/telegram_bot/handlers/ad_create.py
    targets:
      - type: function
        name: delete_draft
    semantic_anchors:
      insert_before:
        type: statement
        value: "Ad.objects.filter(...).delete()"

  - path: src/telegram_bot/handlers/ad_create.py
    targets:
      - type: function
        name: cmd_cancel
    semantic_anchors:
      insert_before:
        type: statement
        value: "delete_draft(...)"

changes:
  - action: add_code
    description: >
      Track photo storage_keys in FSM state during the photo step; call
      delete_photo() for each before deleting the Ad row in delete_draft and
      cmd_cancel.

acceptance_criteria:
  - cancelled/aborted DRAFT uploads leave no files in MEDIA_ROOT
  - delete_draft still removes the ORM row
