id: task_013_remove_root_scripts

title: Remove root-level scaffold/scratch scripts with print() (QLT-006)

priority: low

depends_on: []

source_reference: .ai/audit/99-validation/10-code-quality-validated-findings.md
source_section: "QLT-006"

description: >
  Repo root contains main.py (Django template stub) and count_*.py scratch
  scripts that use print() and are not part of the installed application. They
  violate the no-print rule and can confuse contributors. Remove them.

goals:
  - eliminate root-level scratch scripts using print()
  - avoid no-print-rule violations if repo-level lint is ever enabled

files:
  - path: main.py
  - path: count_cats.py
  - path: count_cities.py
  - path: count_seeds.py

changes:
  - action: delete_file
    description: Delete the four repo-root scaffold/scratch files.

acceptance_criteria:
  - root-level main.py / count_*.py removed
  - production src/ code unaffected (no references to these scripts)
