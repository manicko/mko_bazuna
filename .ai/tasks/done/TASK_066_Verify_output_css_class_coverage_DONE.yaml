id: TASK_066_Verify_output_css_class_coverage

title: Verify output.css class coverage after regeneration

priority: high

type: verification

depends_on:
  - TASK_063_Regenerate_output_css

verifies:
  - TASK_061_Migrate_input_css_v4_native_syntax
  - TASK_062_Delete_tailwind_config_js
  - TASK_063_Regenerate_output_css

source_reference: .ai/plans/08_design-system-css-pipeline_plan.md
source_section: VFY-001 — Verify output.css class coverage

description: >
  Read-only verification that the regenerated output.css contains every
  utility class referenced by the 16 templates. Uses the 17-class
  acceptance checklist from the spec Appendix.

verification_steps:
  - grep: "Confirm all 17 classes present in output.css"
  - count: "Confirm selector count ~291 (range 280-300)"
  - check: "Confirm no v3 @tailwind directives in output.css"
  - check: "Confirm output.css header shows tailwindcss v4.3.3"

files:
  - path: src/theme/static/theme/css/output.css
  - path: src/theme/static/theme/css/input.css
  - path: tailwind.config.js

acceptance_criteria:
  - All 17 classes present with non-zero count: bg-blue-600, text-blue-600, hover:bg-blue-700, rounded-lg, shadow-sm, shadow, bg-gray-50, bg-white, border-gray-300, text-gray-700, text-gray-600, text-gray-800, object-cover, line-clamp-2, line-clamp-3, container, min-h-screen, divide-y
  - Selector count ~291
  - No @tailwind base/components/utilities directives
  - File header confirms v4.3.3

pass_criteria: All 17 classes present; selector count in 280-300 range; no v3 directives
failure_action: Return TASK_061, TASK_062, or TASK_063 to rework — do not proceed to TASK_064
