      - type: catalog_entry
        name: "Please accept the personal data storage consent first."
    semantic_anchors:
      note: non-empty ru msgstr for both; POT-Creation-Date must equal the other two catalogs.

  - path: src/backend/locale/bs/LC_MESSAGES/django.po
