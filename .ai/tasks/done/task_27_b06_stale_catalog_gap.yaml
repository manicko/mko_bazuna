changes:

  - action: update_catalog
    description: >
      Add both msgids to all three catalogs. Extract FIRST into a WHOLE-SOURCE-TREE scratch copy
      (outside the working tree), diff against the tracked .po, then apply only the enumerated
      targeted additive change. Extraction command (both flags):
    code_hint: |
      # scratch only (NEVER against the tracked tree):
      #   copy the WHOLE src/ tree to a scratch dir; run makemessages there:
      python backend/manage.py makemessages -l ru -l bs -l en --no-location --no-obsolete \
        --ignore=.venv --ignore=__pycache__
      # then hand-apply ONLY the two ADDED msgids; do NOT apply the REMOVED (three _lazy) entries.

  - action: update_doc
    description: >
      docs/99-agent/architecture.md — mark the 04-AUT-005 deferral RESOLVED with the commit pointer;
      record that the second consent msgid (submission.py et al.) is now also in the catalog.

  - action: no_source_change
    description: >
      No source-code change: both call sites already use gettext_lazy. Do NOT edit any .py.

acceptance_criteria:
  - BOTH msgids exist in ALL THREE catalogs; ru/bs msgstr non-empty; en msgstr empty per convention
  - a fresh full extraction produces NO msgid/msgstr changes (only POT-Creation-Date may differ, and it
    must be byte-identical across all three catalogs)
  - test_i18n_completeness.py and test_i18n_pipeline.py are green; the fast gate is green
  - docs/99-agent/architecture.md's deferral section is marked resolved with the commit pointer
  - no catalog change beyond the enumerated extraction diff (no unrelated re-ordering, no --no-obsolete
    prune of the three _lazy entries — those are B-07's concern)
  - no source-code change
  - no second freshness gate created

test_contract:
  how: >
    The existing i18n gates are the contract. The Validator re-runs the extraction against a fresh
    whole-tree scratch copy and proves the msgid/msgstr diff is empty.
  commands:
    - "$dc = 'docker compose --project-name mko-bazuna-test --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml'"
    - "$dc run --rm -e PYTEST_OPTS=\"src/backend/apps/ads/tests/test_i18n_completeness.py src/backend/apps/ads/tests/test_i18n_pipeline.py --tb=short\" test"
    - ".\Makefile.ps1 test   # fast gate"
    - "# validator: fresh extraction in a whole-tree scratch copy; assert msgid/msgstr diff empty"
  assertion_level: >
    Non-empty ru/bs msgstr for both msgids in all three catalogs; extraction diff empty (only
    POT-Creation-Date, equal across the three).

binding_constraints:
  - extract into a WHOLE-SOURCE-TREE scratch copy, NEVER in place (C-08-1: a scratch LOCALE_PATHS
    alone does NOT redirect the write — makemessages' directory walk inserts the in-tree locale/ at index 0)
  - BOTH msgids are in scope (C-03-1); a password-policy-only fix is INCOMPLETE
  - use --no-location --no-obsolete for every extraction (DRIFT-1)
  - .po-only change; no .py, no view, no migration
  - POT-Creation-Date must stay byte-identical across the three catalogs (one invocation, all locales)
  - do NOT prune the three _lazy entries (B-07 owns them); do NOT create a second freshness gate
  - never modify .ai/audit/**
  - serialize: B-06 runs BEFORE B-07 and B-08 (cluster order, plan §C.4)

