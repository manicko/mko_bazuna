description: >
  A legitimate full makemessages run surfaces msgids absent from the checked-in catalogs. The
  Stage-0 audit's isolated extraction (CORRECTION C-03-1) proves the forward gap is TWO msgids per
  locale, not one: (1) "Password does not meet the password policy: %(errors)s" (create_admin_user.py,
  gettext_lazy) and (2) the bare string "Please accept the personal data storage consent first."
  (apps/ads/services/submission.py:229, also at apps/ads/views/edit.py:153 and
  telegram_bot/handlers/ad_create/submit.py:188). The catalogs today hold only the DIFFERENT string
  "To manage ads, please accept the personal data storage consent first." A fix filling only the
  password-policy msgid still produces a non-empty extraction diff and a red test_no_empty_msgstr.
  Fill BOTH msgids in all three catalogs (ru/bs non-empty; en empty per convention).

goals:
  - add BOTH forward-gap msgids to ru, bs and en catalogs
  - fill ru/bs msgstr; leave en msgstr empty per convention
  - keep POT-Creation-Date synced across the three catalogs
  - mark the architecture.md deferral section resolved
  - do NOT create a second freshness gate (plan 25 BLOCK 11 owns it)

# ── CORRECTIONS folded in (must be honoured) ──
# C-03-1: the forward gap is TWO msgids. Both are IN SCOPE (NF-3's own AC "a fresh extraction is a
#         no-op" is unreachable otherwise). Not a new product gate — the second string is already a
#         live, user-facing consent message with gettext_lazy at three call sites.
# DRIFT-1: every extraction uses --no-location --no-obsolete (plan 25 BLOCK 10). NEVER --no-location only.

