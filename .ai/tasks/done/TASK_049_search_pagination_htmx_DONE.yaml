id: task_049_search_pagination_htmx

title: Add pagination + real HTMX partial to search/listings (SRH-003, SRH-009)

priority: high

depends_on:
  - task_033_adsort_strenum

source_reference: .ai/audit/99-validation/08-search-fts-validated-findings.md
source_section: "SRH-003 / SRH-009"

description: >
  Neither search nor listings view limits or paginates results (DoS/latency
  risk), and both branch on HX-Request but render the same full template (dead
  branch). Add Django Paginator (20-40/page) to search and listings, and make
  the HX-Request branch render a partial fragment (ads/partials/ad_list.html)
  so filters update without full reload (US-B3).

goals:
  - bounded, paginated result sets
  - HTMX partial actually differs from full page

files:
  - path: src/backend/apps/search/views/search.py
  - path: src/backend/apps/ads/views/listings.py
  - path: src/backend/templates/ads/list.html
  - path: src/backend/templates/ads/partials/ad_list.html

changes:
  - action: add_code
    description: Add Paginator to both views; render ad_list partial on HX-Request; include pagination controls.

acceptance_criteria:
  - result sets are paginated (no unbounded queryset to template)
  - HX-Request renders the partial fragment
