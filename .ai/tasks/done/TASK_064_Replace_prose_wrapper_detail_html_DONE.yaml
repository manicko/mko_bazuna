id: TASK_064_Replace_prose_wrapper_detail_html

title: Replace prose wrapper in ads/detail.html with utility-only div

priority: high

depends_on:
  - TASK_066_Verify_output_css_class_coverage

source_reference: .ai/plans/08_design-system-css-pipeline_plan.md
source_section: TSK-004 — Replace prose wrapper in ads/detail.html

description: >
  Replace the @tailwindcss/typography-only "prose max-w-none" wrapper in
  ads/detail.html with a utility-only "mb-6" div. The description is plain
  text (whitespace-pre-wrap on a single <p>), so no typography plugin
  styling is needed. The mb-6 class is already present in the regenerated
  output.css.

goals:
  - Remove the prose class (unavailable under no-plugin constraint)
  - Preserve text rendering: text-gray-700, whitespace-pre-wrap
  - Use mb-6 for bottom margin (same as before)

files:
  - path: src/backend/templates/ads/detail.html

    targets:
      - type: template_tag
        name: prose_max_w_none_wrapper

    semantic_anchors:
      replace_class:
        old: "prose max-w-none mb-6"
        new: "mb-6"

changes:

  - action: edit_html

    description: >
      In ads/detail.html, replace the description wrapper div class.
      Only the outer div changes; the inner <p> is untouched.

    code_hint: |
      <!-- Before -->
      <div class="prose max-w-none mb-6">
          <p class="text-gray-700 whitespace-pre-wrap">{{ ad|get_description:LANGUAGE_CODE }}</p>
      </div>

      <!-- After -->
      <div class="mb-6">
          <p class="text-gray-700 whitespace-pre-wrap">{{ ad|get_description:LANGUAGE_CODE }}</p>
      </div>

acceptance_criteria:
  - ads/detail.html no longer contains the "prose" class
  - Wrapper div uses class="mb-6" as sole class
  - Inner <p class="text-gray-700 whitespace-pre-wrap"> is unchanged
  - mb-6 is confirmed present in output.css (from VFY-001)

risk_level: low
risk_mitigation: >
  Description is plain text with autoescape enabled. whitespace-pre-wrap
  preserves formatting. mb-6 already covered in regenerated output.css.
  No new classes introduced.

scope_note: >
  A second "prose" usage exists in admin/moderation/review.html (line 62).
  This is an admin-only template outside the spec scope (spec R5: only
  ads/detail.html). Not addressed in this task.
