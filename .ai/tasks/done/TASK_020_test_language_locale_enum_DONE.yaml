id: task_020
title: Test — LanguageLocale Enum and fts_config Property

priority: medium
type: test
depends_on:
  - task_001

# ── Verification ──
verifies:
  - task_001

verification_steps:
  - build: uv run basedpyright src/backend/apps/core/enums.py
  - test: uv run pytest src/backend/apps/core/tests/test_language_locale.py -v
  - smoke_check: uv run python -c "from apps.core.enums import LanguageLocale; print(LanguageLocale.RUSSIAN.fts_config)"

pass_criteria:
  - All LanguageLocale enum values importable
  - fts_config returns correct PostgreSQL config ("russian", "simple", "english")
  - Type checking passes
  - Unit tests pass

# ── Test Specification
test_specification:
  - description: >
      test_language_locale_values:
        - LanguageLocale.RUSSIAN.value == "ru"
        - LanguageLocale.BOSNIAN.value == "bs"
        - LanguageLocale.ENGLISH.value == "en"
  - description: >
      test_fts_config_property:
        - LanguageLocale.RUSSIAN.fts_config == "russian"
        - LanguageLocale.BOSNIAN.fts_config == "simple"
        - LanguageLocale.ENGLISH.fts_config == "english"