id: task_017_atomic_domain_writes

title: Make multi-row domain writes atomic (DB-002)

priority: critical

depends_on:
  - task_016_exif_strip

depends_on_previous_task_in_chain:
  - task_016_exif_strip

source_reference: .ai/audit/99-validation/03-db-concurrency-validated-findings.md
source_section: "DB-002"

description: >
  No transaction.atomic exists anywhere. update_ad_and_moderate() performs
  sequential ORM writes (AdImage.create xN, ad.save, AnalyticsEvent.create)
  that can partially commit on failure; consent_hard_delete.py issues three
  independent statements that can orphan rows. Wrap each multi-statement
  sequence in transaction.atomic().

goals:
  - publish path is all-or-nothing (no orphaned AdImage / missing event)
  - hard-delete cascade is atomic (no dangling references)

files:
  - path: src/telegram_bot/handlers/ad_create.py
    targets:
      - type: function
        name: update_ad_and_moderate (inner write sequence)
    semantic_anchors:
      insert_before:
        type: statement
        value: "AdImage.objects.create(...)"

  - path: src/backend/apps/core/management/commands/consent_hard_delete.py
    targets:
      - type: function
        name: handle (mutate section)
    semantic_anchors:
      insert_before:
        type: statement
        value: "AnalyticsEvent.objects...update(...)"

changes:
  - action: wrap
    description: >
      Wrap the inner write sequence of update_ad_and_moderate and the three
      statements of consent_hard_delete in transaction.atomic(). Keep blocks
      minimal and focused.

acceptance_criteria:
  - no partial commit on mid-write failure for either path
  - existing successful publish / hard-delete behavior unchanged
  - grep confirms transaction.atomic now present
