id: task_014_wrap_save_photo

title: Wrap save_photo filesystem write off the event loop (ENT-003, EXT-007)

priority: high

depends_on:
  - task_007_fix_bot_import_order

depends_on_previous_task_in_chain: []

source_reference: .ai/audit/99-validation/01-entry-architecture-validated-findings.md
source_section: "ENT-003"
source_reference_2: .ai/audit/99-validation/09-external-api-validated-findings.md
source_section_2: "EXT-007"

description: >
  save_photo() is an async def performing synchronous os.makedirs + open().write()
  directly on the aiogram event loop, stalling all concurrent updates. Wrap the
  write in asyncio.to_thread (or sync_to_async) so it runs off the loop,
  consistent with every other ORM helper in the file.

goals:
  - media writes no longer block the bot event loop
  - behavior identical (bytes still persisted to MEDIA_ROOT)

files:
  - path: src/telegram_bot/handlers/ad_create.py
    targets:
      - type: function
        name: save_photo
    semantic_anchors:
      insert_before:
        type: statement
        value: "os.makedirs(os.path.dirname(media_path), exist_ok=True)"

changes:
  - action: wrap
    description: >
      Move the makedirs + open().write() body into asyncio.to_thread (or
      sync_to_async) while keeping the async signature and the await at the
      call site (ad_create.py:282).

acceptance_criteria:
  - photo bytes still written correctly to MEDIA_ROOT
  - save_photo no longer executes blocking IO on the event loop
  - existing call site unchanged in behavior
