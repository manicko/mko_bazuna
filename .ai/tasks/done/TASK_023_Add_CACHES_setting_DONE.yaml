id: TASK_023_Add_CACHES_setting

title: Add CACHES Django setting to base.py

priority: high

source_reference: .ai/plans/02/Seller Dashboard Statistics/plan.md
source_section: T3: Add CACHES setting to base.py

description: >
  Add explicit CACHES Django setting to base.py for consistent caching
  across multiple workers in production.

goals:
  - Enable Django cache framework
  - Use LocMemCache as default backend
  - Support SellerStats caching

files:
  - path: src/backend/config/settings/base.py

    targets:
      - type: module
        name: base

    semantic_anchors:
      insert_after:
        type: import
        value: django.conf

changes:
  - action: add_top_level

    description: >
      Add CACHES configuration with LocMemCache backend.

    code_hint: |
      CACHES = {
          "default": {
              "BACKEND": "django.core.cache.backends.locmem.LocMemCache",
          }
      }

acceptance_criteria:
  - CACHES setting added to base.py
  - LocMemCache backend configured
  - Type checking passes on base.py
  - Lint check passes on base.py

risk_level: medium
risk_mitigation: >
  Config-only change; no data migration required.
  Redis documented as future enhancement.