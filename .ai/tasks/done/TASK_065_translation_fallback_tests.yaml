id: task_065_translation_fallback_tests

title: Test translation fallback (mock network) (TST-006)

priority: high

depends_on:
  - task_047_query_timeout_nonblock

source_reference: .ai/audit/99-validation/11-test-coverage-validated-findings.md
source_section: "TST-006"

description: >
  translate_query_bs_to_ru has no test and its happy path hits the network. Add
  unit tests mocking deep_translator.GoogleTranslator.translate: (1) success
  returns translated string; (2) exception/timeout returns original query
  (fallback); (3) empty/whitespace short-circuits. Mock at the network boundary
  so CI never calls Google.

goals:
  - fallback behavior regression-guarded
  - no real network calls in CI

files:
  - path: src/backend/apps/search/tests/test_query_translator.py

changes:
  - action: add_code
    description: Add mocked translation fallback unit tests.

acceptance_criteria:
  - success/fallback/empty cases asserted
  - Google never called in tests
