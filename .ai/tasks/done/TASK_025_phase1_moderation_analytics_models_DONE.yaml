id: task_025_phase1_moderation_analytics_models

title: Moderation + Analytics models

priority: high

depends_on:
  - task_021_phase1_structure_enums

source_reference: .ai/plans/01_detailed_plan_publish_discover.md
source_section: Task 4 — Moderation + Analytics Models

description: >
  Moderation singleton, action log, and product analytics model.

goals:
  - ModerationCriteria singleton with exact fields (no min_price/max_price)
  - ModeratorActionLog: ad_id FK, user_id FK, action_type, reason TEXT, created_at
  - AnalyticsEvent: event_type, timestamp, user_id nullable SET NULL on erasure

files:
  - path: src/backend/apps/moderation/models.py
    targets:
      - type: class
        name: ModerationCriteria
      - type: class
        name: ModeratorActionLog
  - path: src/backend/apps/analytics/models.py
    targets:
      - type: class
        name: AnalyticsEvent

changes:
  - action: add_code
    description: Define models; add migrations.

acceptance_criteria:
  - ModerationCriteria fields EXACTLY: title_min/max_length, description_min/max_length, price_required, min_images, max_images, banned_words (JSONB), max_ads_per_user, duplicate_title_threshold, updated_at, updated_by FK
  - ModeratorActionLog.reason is TEXT (never shown to seller)
  - AnalyticsEvent.user_id SET NULL on erasure preserves aggregates
  - '"uv run basedpyright" passes'
  - '"uv run manage.py migrate" applies'
