id: task_022_drop_unused_storage_key

title: Delete unused AdImage.generate_storage_key (MED-005)

priority: medium

depends_on:
  - task_021_media_delete_helper

source_reference: .ai/audit/99-validation/07-media-validated-findings.md
source_section: "MED-005"

description: >
  Two divergent generate_storage_key implementations exist. The model method
  AdImage.generate_storage_key returns bare uuid4 (no .jpg), which would make
  nginx serve application/octet-stream. It is unused in production (only test
  fixtures). Delete the model method and fix the AdImage.image docstring to
  state the true format: bare UUID v4 + .jpg, no ad_id/user/telegram prefix.

goals:
  - remove the divergent/unused storage-key generator
  - documentation reflects the canonical {uuid}.jpg format

files:
  - path: src/backend/apps/ads/models.py
    targets:
      - type: method
        name: AdImage.generate_storage_key
    semantic_anchors:
      remove_block:
        type: method
        value: "def generate_storage_key"

  - path: src/backend/apps/ads/models.py
    targets:
      - type: field
        name: AdImage.image docstring

changes:
  - action: delete_symbol
    description: Delete AdImage.generate_storage_key; update AdImage.image docstring to the true format.

acceptance_criteria:
  - model method removed; production still uses telegram_bot.services.media.generate_storage_key
  - docstring documents {uuid}.jpg with no PII prefix
