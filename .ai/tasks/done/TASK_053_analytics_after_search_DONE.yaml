id: task_053_analytics_after_search

title: Record search analytics after execution (SRH-007)

priority: low

depends_on: []

source_reference: .ai/audit/99-validation/08-search-fts-validated-findings.md
source_section: "SRH-007"

description: >
  SEARCH_PERFORMED is recorded unconditionally before translation and FTS
  execution, inflating the counter with failed searches. Move the
  AnalyticsEvent creation to after a successful search execution.

goals:
  - analytics reflect actual performed searches
  - no count inflation from failed searches

files:
  - path: src/backend/apps/search/views/search.py
    targets:
      - type: function
        name: search (analytics)
    semantic_anchors:
      edit_line:
        type: statement
        value: "AnalyticsEvent.objects.create(...)"

changes:
  - action: move
    description: Move the AnalyticsEvent creation to after successful FTS execution.

acceptance_criteria:
  - analytics event created only for executed searches
  - metric accuracy improved
