id: task_024
title: Test — Language Middleware

priority: medium
type: test
depends_on:
  - task_005

verifies:
  - task_005

verification_steps:
  - build: uv run basedpyright src/backend/apps/core/middleware/language.py
  - test: uv run pytest src/backend/apps/core/tests/test_language_middleware.py -v
  - smoke_check: uv run python -c "from apps.core.middleware.language import LanguagePreMiddleware; print('Middleware importable')"

pass_criteria:
  - Middleware imports successfully
  - Request LANGUAGE_CODE set correctly from ?lang parameter
  - Cookie read and language set correctly
  - Accept-Language header parsing works
  - Default to Russian when no preference found
  - Unit tests pass

test_specification:
  - description: >
      Test middleware language detection priority:
        - ?lang=X overrides cookie
        - Cookie overrides Accept-Language
        - Accept-Language parsed for supported locales
        - Default Russian when nothing detected
  - description: >
      Test cookie setting on language change
      Test session storage for authenticated users