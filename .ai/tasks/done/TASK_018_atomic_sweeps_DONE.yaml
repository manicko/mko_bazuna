id: task_018_atomic_sweeps

title: Hold advisory lock across whole sweep via transaction.atomic (DB-001)

priority: high

depends_on:
  - task_017_atomic_domain_writes

source_reference: .ai/audit/99-validation/03-db-concurrency-validated-findings.md
source_section: "DB-001"

description: >
  advisory_lock(..., session=False) uses pg_advisory_xact_lock, released at
  transaction end. Django management commands run in autocommit, so the lock
  spans only per-statement under the with-block, letting two concurrent sweeps
  interleave between count() and mutate(). Wrap each sweep body (inside the
  advisory_lock with-block, from first queryset op to final update/delete) in
  transaction.atomic() so the lock covers count->mutate.

goals:
  - sweep lock held for the entire count->mutate sequence
  - concurrent identical sweeps cannot double-process

files:
  - path: src/backend/apps/core/utils/advisory_lock.py
    targets:
      - type: function
        name: advisory_lock
    semantic_anchors:
      docstring_update:
        type: comment
        value: "docstring claims whole-operation lock"

  - path: src/backend/apps/core/management/commands/archive_sweep.py
  - path: src/backend/apps/core/management/commands/delete_sweep.py
  - path: src/backend/apps/core/management/commands/sweep_drafts.py
  - path: src/backend/apps/core/management/commands/purge_failed_ads.py
  - path: src/backend/apps/core/management/commands/purge_rejected_ads.py
  - path: src/backend/apps/core/management/commands/consent_hard_delete.py
  - path: src/backend/apps/core/management/commands/cleanup_login_tokens.py

changes:
  - action: wrap
    description: >
      Wrap the body inside each `with advisory_lock(..., session=False):` block
      in transaction.atomic(). Update the advisory_lock docstring to clarify
      the transaction-scoped release behavior.

acceptance_criteria:
  - each sweep's count->mutate executes in one transaction under the lock
  - advisory_lock docstring documents the transaction requirement
  - idempotency preserved under concurrent triggers
