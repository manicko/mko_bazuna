id: task_035_withdraw_route

title: Make WITHDRAW reachable (route + view + admin action) (PII-002)

priority: critical

depends_on:
  - task_034_pii_chat_id

source_reference: .ai/audit/99-validation/06-pii-consent-validated-findings.md
source_section: "PII-002"

description: >
  withdraw_consent() is defined but never invoked — no consent/withdraw/ route,
  no admin action, no bot entry point. Add a consent/withdraw/ URL + view that
  calls withdraw_consent (surfaced from the consent banner / account page) and
  a Django admin action in users/admin.py to call it for operator-triggered
  deletions.

goals:
  - users can initiate withdrawal via the site
  - admins can trigger withdrawal from the admin

files:
  - path: src/backend/apps/users/urls.py
    targets:
      - type: module
        name: users urlpatterns
    semantic_anchors:
      insert_after:
        type: path
        value: "consent/decline/"

  - path: src/backend/apps/users/views/consent.py
    targets:
      - type: function
        name: consent_withdraw
    semantic_anchors:
      insert_after:
        type: function
        value: "consent_decline"

  - path: src/backend/apps/users/admin.py
    targets:
      - type: class
        name: UserAdmin
    semantic_anchors:
      insert_after:
        type: action
        value: "admin actions list"

changes:
  - action: add_code
    description: Add withdraw route + view + admin action invoking withdraw_consent.

acceptance_criteria:
  - consent/withdraw/ route exists and calls withdraw_consent
  - admin action triggers withdrawal
  - 30-day erasure flow now has a producer
