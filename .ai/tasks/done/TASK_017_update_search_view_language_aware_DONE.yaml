id: task_017
title: Update Search View for Language-Aware Search

priority: medium
depends_on:
  - task_007
  - task_016

# ── Plan/Audit report source ──
source_reference: .ai\plans\i18n\plan.md
source_section: Task 3.2 — Update Search View for Language-Aware Search

description: >
  Update search view to detect query language or use request.LANGUAGE_CODE,
  translate query appropriately, and use matching FTS search configuration.

files:
  - path: src/backend/apps/search/views/search.py

    targets:
      - type: function
        name: search

    semantic_anchors:
      insert_after:
        type: function_call
        value: translate

      insert_after:
        type: variable
        value: query

changes:
  - action: modify
    description: >
      Modify search() function to:
      - Detect query language or use request.LANGUAGE_CODE
      - Translate query to target search language (Russian) for existing search vector
      - Prepare for multi-language search vector when Phase 1 complete

    code_hint: |
      # Current:
      query = (request.GET.get("q") or "").strip()
      translated_query = translate_query_bs_to_ru(query)

      # Future:
      query_language = detect_query_language(query) or request.LANGUAGE_CODE
      if query_language != "ru":
          translated_query = translate_query(query, query_language, "ru")
      else:
          translated_query = query

acceptance_criteria:
  - Search works with language-aware query translation
  - Results use appropriate search vector
  - uv run pytest src/backend/apps/search/tests.py passes
  - Cross-language search tested for Bosnian and English queries