id: TASK_028_Add_AdImage_thumbnail_url_properties

title: Add thumbnail URL properties to AdImage model

priority: medium

depends_on:
  - TASK_012_Add_AdImage_thumbnail_fields

source_reference: .ai/plans/02/Photo Thumbnail Generation/plan.md
source_section: T3.1: AdImage Thumbnail URL Properties

description: >
  Add thumbnail_small_url, thumbnail_medium_url, thumbnail_large_url properties
  to AdImage model following the AdImage naming convention.

goals:
  - Provide URL accessors for thumbnails
  - Return None if thumbnail not generated
  - Use MEDIA_URL configuration

files:
  - path: src/backend/apps/ads/models.py

    targets:
      - type: class
        name: AdImage

    semantic_anchors:
      insert_after:
        type: property
        name: image_url

changes:
  - action: add_method

    description: >
      Add three URL property methods to AdImage class.

    code_hint: |
      @property
      def thumbnail_small_url(self) -> str | None:
          if self.thumbnail_small:
              return f"{settings.MEDIA_URL}{self.thumbnail_small}"
          return None

      # Similar for medium and large

acceptance_criteria:
  - All three thumbnail URL properties added
  - Proper MEDIA_URL usage
  - Type checking passes on models.py
  - Lint check passes on models.py

risk_level: low
risk_mitigation: >
  Properties are read-only; no data mutation.
  Returns None gracefully for missing thumbnails.