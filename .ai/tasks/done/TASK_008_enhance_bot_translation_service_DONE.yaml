description: >
  Refactor bot translation to translate to all languages in parallel on ad creation.
  Add translate_all_languages function and update update_ad_and_moderate to handle
  multi-language content.

files:
  - path: src/telegram_bot/handlers/ad_create.py

    targets:
      - type: function
        name: translate_to_russian

      - type: function
        name: update_ad_and_moderate

    semantic_anchors:
      insert_after:
        type: function
        name: _do_translate
        value: translate

    changes:
      - action: add_code
        description: >
          Add translate_all_languages function that translates to ru, bs, en in parallel
          using asyncio.gather. Update update_ad_and_moderate to store translations
          in respective columns and capture original_language.

        code_hint: |
          async def translate_all_languages(text: str, target_locales: list[str]) -> dict[str, str]:
              """Translate text to all target languages in parallel."""
              async def translate_one(text: str, target: str) -> str:
                  try:
                      return await asyncio.wait_for(
                          asyncio.to_thread(_do_translate_multi, text, target),
                          timeout=15.0,
                      )
                  except Exception:
                      return text

              # Use asyncio.gather for parallel translation
              results = await asyncio.gather(
                  *[translate_one(text, loc) for loc in target_locales]
              )
              return dict(zip(target_locales, results))

          # Update update_ad_and_moderate:
          # - Detect source language with translate_all_languages
          # - Store title_bs, title_en, description_bs, description_en
          # - Set original_language field
          # - Keep title_ru/description_ru as base

    acceptance_criteria:
      - Translations generated for all three languages
      - original_language captured correctly
      - Backward compatibility maintained
      - uv run pytest src/telegram_bot/tests/test_ad_lifecycle.py passes