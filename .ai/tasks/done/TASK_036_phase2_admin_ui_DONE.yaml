id: task_036_phase2_admin_ui

title: Admin moderation UI (US-A11)

priority: high

depends_on:
  - task_032_phase1_web_search_views
  - task_035_phase2_action_log
  - task_024_phase1_admin_registration

source_reference: .ai/plans/02_detailed_plan_moderation.md
source_section: Task 3 — Admin Moderation UI (US-A11)

description: >
  Manual review interface for moderator=admin role (decision A).

goals:
  - admin list filter: status ON_MODERATION, ON_MODERATION_FAILED, REJECTED
  - detail: photo grid (lazy), metadata, Reject action with Layer-2 checklist + reason TEXT
  - outcomes: REJECT -> REJECTED + rejected_at + log; BAN_ACCOUNT -> is_banned + log; SOFT_DELETE
  - bulk approve/reject
  - admin access restricted to is_staff/is_superuser

files:
  - path: src/backend/apps/ads/admin.py
    targets:
      - type: module
        name: apps.ads.admin
  - path: src/backend/templates/admin/moderation/review.html
    targets:
      - type: file
        name: templates/admin/moderation/review.html
  - path: src/backend/apps/moderation/admin_actions.py
    targets:
      - type: module
        name: apps.moderation.admin_actions

changes:
  - action: add_code
    description: Add admin moderation views/actions + review template.

acceptance_criteria:
  - failed/moderation/rejected queues filterable
  - reject writes REJECTED + rejected_at + ModeratorActionLog
  - ban sets is_banned + BAN_ACCOUNT log
  - 'admin only; "uv run ruff check" + "uv run basedpyright" pass'
