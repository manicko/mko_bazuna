id: task_010_docker_makefile

title: Makefile + dev shortcuts (Makefile.ps1 parity)

priority: low

depends_on:
  - task_004_docker_compose_dev

source_reference: .ai/plans/00_detailed_plan_docker_environment.md
source_section: Task 10 — Makefile + Dev Shortcuts

description: >
  Provide ergonomic developer commands for container-based workflow. Windows/WSL2 is the primary
  dev path, so Makefile.ps1 with parity is REQUIRED.

goals:
  - targets: up, down, test, lint, typecheck, shell, migrate, makemigrations, logs, backup, restore
  - test runs in test compose; lint/typecheck inside web container
  - backup target with 7-day rotation (find/PowerShell)
  - Makefile.ps1 parity

files:
  - path: Makefile
    targets:
      - type: file
        name: Makefile
  - path: Makefile.ps1
    targets:
      - type: file
        name: Makefile.ps1

changes:
  - action: add_code
    description: Write Makefile + Makefile.ps1.

acceptance_criteria:
  - '"make help" lists all targets'
  - '"make lint" exits 0 on clean code'
  - Makefile.ps1 mirrors targets
