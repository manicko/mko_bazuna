id: task_009_postgres_password_failfast

title: POSTGRES_PASSWORD fail-fast (no empty-string default) (CFG-002)

priority: medium

depends_on:
  - task_008_bot_token_failfast

source_reference: .ai/audit/99-validation/02-config-secrets-validated-findings.md
source_section: "CFG-002"

description: >
  In the discrete-vars DB path, POSTGRES_PASSWORD defaults to "" when unset,
  silently accepted, causing opaque auth errors later. Require it explicitly
  (no default) so a missing credential fails clearly at boot, mirroring
  SECRET_KEY behavior.

goals:
  - no silent empty-string default for the DB password
  - clear boot failure when credential is absent

files:
  - path: src/backend/config/settings/base.py
    targets:
      - type: function
        name: DATABASES configuration (discrete path)
    semantic_anchors:
      edit_line:
        type: assignment
        value: "\"PASSWORD\": os.getenv(\"POSTGRES_PASSWORD\", \"\")"

changes:
  - action: replace
    description: >
      Replace the empty-string default with env("POSTGRES_PASSWORD") (no
      default) in the discrete DATABASES path, or derive the whole entry from
      DATABASE_URL only.

acceptance_criteria:
  - missing POSTGRES_PASSWORD raises ImproperlyConfigured
  - present POSTGRES_PASSWORD connects normally
  - fail-fast message contains no secret value
