id: TASK_050_Create_search_history_service

title: Create search_history service functions

priority: high

depends_on:
  - TASK_015_Create_SearchHistory_model

source_reference: .ai/plans/02/Search Autocomplete/plan.md
source_section: T6: Create search_history Service

description: >
  Create record_search_history and get_user_search_history functions
  in apps/search/services/search_history.py.

goals:
  - Record user search queries with deduplication
  - Limit to 50 entries per user
  - Support authenticated and anonymous users

files:
  - path: src/backend/apps/search/services/search_history.py

    targets:
      - type: function
        name: record_search_history

      - type: function
        name: get_user_search_history

changes:
  - action: add_top_level

    description: >
      Create search_history.py with recording and retrieval functions.

    code_hint: |
      def record_search_history(user_id: int | None, query: str) -> None: ...
      def get_user_search_history(user_id: int | None, limit: int = 5) -> list[str]: ...

acceptance_criteria:
  - Both functions created in services directory
  - Deduplication via delete-before-create pattern
  - Pruning to 50 entries per user
  - Type checking passes
  - Lint check passes

risk_level: medium
risk_mitigation: >
  Service isolated; deduplication prevents duplicates.
  Anonymous users handled gracefully.