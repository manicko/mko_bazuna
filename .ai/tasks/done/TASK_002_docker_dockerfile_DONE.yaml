id: task_002_docker_dockerfile

title: Multi-stage Dockerfile with non-root user + Tailwind build + collectstatic

priority: high

depends_on:
  - task_001_docker_pyproject_reconcile

source_reference: .ai/plans/00_detailed_plan_docker_environment.md
source_section: Task 1 — Multi-Stage Dockerfile with Non-Root User + Tailwind Build + collectstatic

description: >
  Create a secure, production-ready multi-stage Dockerfile supporting both web and bot services.
  Uses python:3.14-slim, compiles psycopg3, builds Tailwind CSS before collectstatic, and ships
  a non-root runtime stage.

goals:
  - python:3.14-slim base
  - builder installs gcc libpq-dev for psycopg3
  - uv sync --frozen --no-install-project into /opt/venv
  - Tailwind build BEFORE collectstatic
  - runtime stage: non-root user app (uid 1000), write access /app/media
  - runtime libpq5 for psycopg3
  - PATH/UV_PROJECT_ENVIRONMENT wiring

files:
  - path: docker/Dockerfile
    targets:
      - type: file
        name: docker/Dockerfile
  - path: docker/entrypoint.sh
    targets:
      - type: file
        name: docker/entrypoint.sh

changes:
  - action: add_code
    description: Rewrite Dockerfile (builder + runtime stages) and create entrypoint.sh.

acceptance_criteria:
  - '"docker build -t mko-bazuna:dev -f docker/Dockerfile ." succeeds'
  - final image has no gcc/libpq-dev; non-root user only
  - Tailwind CSS generated before collectstatic
  - libpq5 present at runtime
