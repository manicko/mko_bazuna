id: task_009
title: Create Locale Directory Structure

priority: medium
depends_on:
  - task_001

# ── Plan/Audit report source ──
source_reference: .ai\plans\i18n\plan.md
source_section: Task 2.1 — Create Locale Directory Structure

description: >
  Create locale directory structure with LC_MESSAGES subdirectories for each
  supported language (ru, bs, en) and generate initial django.po/django.mo files.

files:
  - path: src/backend/locale/

    targets:
      - type: directory
        name: locale

    semantic_anchors:
      insert_after:
        type: directory
        name: backend

      create_subdirs:
        - locale/ru/LC_MESSAGES/
        - locale/bs/LC_MESSAGES/
        - locale/en/LC_MESSAGES/

    changes:
      - action: create_directory
        description: >
          Create locale directory structure and initialize django.po files with
          standard Django header.

    acceptance_criteria:
      - All locale directories created
      - django.po files exist for all three languages
      - uv run django-admin compilemessages succeeds

# ── Verification ──
verification_steps:
  - build: uv run django-admin compilemessages
  - smoke_check: uv run ls -la src/backend/locale/*/LC_MESSAGES/