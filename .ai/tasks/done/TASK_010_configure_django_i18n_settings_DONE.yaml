id: task_010
title: Configure Django i18n Settings

priority: medium
depends_on:
  - task_001

# ── Plan/Audit report source ──
source_reference: .ai\plans\i18n\plan.md
source_section: Task 2.2 — Configure Django i18n Settings

description: >
  Configure Django internationalization settings including LANGUAGE_CODE,
  USE_I18N, LANGUAGES list, and LOCALE_PATHS.

files:
  - path: src/backend/config/settings/base.py

    targets:
      - type: module
        name: config.settings.base

    semantic_anchors:
      insert_before:
        type: config_block
        value: SESSION_COOKIE_SECURE

    changes:
      - action: add_code
        description: >
          Add i18n settings to base.py:
          - LANGUAGE_CODE = "ru" (default)
          - USE_I18N = True
          - LANGUAGES = [("ru", "Russian"), ("bs", "Bosnian"), ("en", "English")]
          - LOCALE_PATHS = [BASE_DIR / "backend" / "locale"]

        code_hint: |
          # Internationalization
          LANGUAGE_CODE = "ru"
          USE_I18N = True
          LANGUAGES = [
              ("ru", "Russian"),
              ("bs", "Bosnian"),
              ("en", "English"),
          ]
          LOCALE_PATHS = [BASE_DIR / "backend" / "locale"]

    acceptance_criteria:
      - Settings load without errors
      - Languages configured correctly
      - Locale path points to correct directory
      - uv run pytest verifies configuration