id: task_014_docker_backup

title: DB backup script + restore runbook

priority: medium

depends_on:
  - task_002_docker_dockerfile

source_reference: .ai/plans/00_detailed_plan_docker_environment.md
source_section: Task 13 — DB Backup Script + Restore Runbook

description: >
  Daily logical backups with retention for operational safety. pg_dump -F c, 7-day rotation,
  restore runbook in docs/ops/restore.md.

goals:
  - backup service/cron sidecar runs pg_dump -F c daily
  - ./backups/dump_YYYYMMDD.dump
  - 7-day rotation
  - Makefile backup target
  - docs/ops/restore.md runbook

files:
  - path: docker-compose.prod.yml
    targets:
      - type: file
        name: docker-compose.prod.yml
  - path: docs/ops/restore.md
    targets:
      - type: file
        name: docs/ops/restore.md

changes:
  - action: add_code
    description: Add backup service + restore runbook.

acceptance_criteria:
  - '"make backup" creates dump in ./backups/'
  - backup script idempotent

