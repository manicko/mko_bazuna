id: task_019_login_getorcreate_race

title: Fix login User.get_or_create read-modify-write race (DB-004)

priority: low

depends_on: []

source_reference: .ai/audit/99-validation/03-db-concurrency-validated-findings.md
source_section: "DB-004"

description: >
  get_or_create_user uses User.objects.get_or_create(telegram_id=...) which can
  raise IntegrityError on concurrent identical logins (unique telegram_id),
  currently unhandled. Wrap in transaction.atomic() and on IntegrityError re-get
  the existing user, mirroring the claim_login_token retry pattern.

goals:
  - concurrent first-time logins do not surface unhandled IntegrityError
  - idempotent user grab

files:
  - path: src/telegram_bot/handlers/login.py
    targets:
      - type: function
        name: get_or_create_user
    semantic_anchors:
      insert_before:
        type: statement
        value: "User.objects.get_or_create(telegram_id=telegram_id, ...)"

changes:
  - action: wrap
    description: >
      Wrap get_or_create in transaction.atomic(); on IntegrityError perform
      User.objects.get(telegram_id=telegram_id) and return it.

acceptance_criteria:
  - concurrent identical /start logins both resolve to the same user
  - no unhandled IntegrityError surfaced to the user
