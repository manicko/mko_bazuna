id: task_052_narrow_except

title: Narrow overly broad exception handling in translator (SRH-006)

priority: low

depends_on: []

source_reference: .ai/audit/99-validation/08-search-fts-validated-findings.md
source_section: "SRH-006"

description: >
  query_translator catches except (TimeoutError, RequestException, Exception),
  making the specific types redundant and masking programming errors. Remove the
  bare Exception catch and log genuine errors at ERROR.

goals:
  - genuine bugs surface instead of being swallowed
  - specific expected errors still handled

files:
  - path: src/backend/apps/search/services/query_translator.py
    targets:
      - type: function
        name: translate_query_bs_to_ru (except)
    semantic_anchors:
      edit_line:
        type: statement
        value: "except (TimeoutError, RequestException, Exception) as e:"

changes:
  - action: replace
    description: Drop the broad Exception catch; keep TimeoutError/RequestException; log at ERROR.

acceptance_criteria:
  - no catch-all Exception masks bugs
  - expected translation failures still fall back
