id: task_011_env_dev_placeholders

title: Align .env.dev.example with angle-bracket placeholders (CFG-006)

priority: low

depends_on: []

source_reference: .ai/audit/99-validation/02-config-secrets-validated-findings.md
source_section: "CFG-006"

description: >
  .env.dev.example uses concrete weak values (POSTGRES_PASSWORD=111, a real
  looking DATABASE_URL) that could be copied verbatim into non-dev environments.
  Align it with the .env.example angle-bracket placeholder style so no example
  file carries a value mistaken for a usable secret.

goals:
  - no weak/real-looking credentials in example env files
  - consistent placeholder style across example files

files:
  - path: .env.dev.example
    targets:
      - type: key
        name: POSTGRES_PASSWORD / DATABASE_URL
    semantic_anchors:
      edit_line:
        type: assignment
        value: "POSTGRES_PASSWORD=111"

changes:
  - action: replace_value
    description: >
      Replace concrete weak values with placeholders such as
      POSTGRES_PASSWORD=<dev-db-password> and a placeholder DATABASE_URL.

acceptance_criteria:
  - .env.dev.example contains no real-looking credentials
  - placeholder style matches .env.example
