id: task_016_exif_strip

title: Strip EXIF/metadata on photo store (MED-002)

priority: critical

depends_on:
  - task_014_wrap_save_photo

source_reference: .ai/audit/99-validation/07-media-validated-findings.md
source_section: "MED-002"

description: >
  validate_photo() only reads image size; save_photo() writes photo_bytes
  verbatim, so GPS/device EXIF persists in served images (PII). Re-encode via
  Pillow: ImageOps.exif_transpose, pop exif from img.info, save with
  optimize=True. This also hardens against malicious JPEGs.

goals:
  - no EXIF/metadata in stored images
  - stored bytes are re-encoded (decoder-hardened)

files:
  - path: src/telegram_bot/services/media.py
    targets:
      - type: function
        name: validate_photo
    semantic_anchors:
      insert_after:
        type: function_call
        value: "Image.open(io.BytesIO(photo_bytes))"

  - path: src/telegram_bot/handlers/ad_create.py
    targets:
      - type: function
        name: save_photo
    semantic_anchors:
      insert_before:
        type: statement
        value: "with open(media_path, \"wb\") as f:"

changes:
  - action: add_code
    description: >
      Re-encode the image (exif_transpose, strip exif, optimize save) before
      persistence. Keep validation dims/size checks in validate_photo.

acceptance_criteria:
  - stored JPEG has no EXIF metadata
  - image still renders correctly
  - malicious/odd JPEGs are safely re-encoded
