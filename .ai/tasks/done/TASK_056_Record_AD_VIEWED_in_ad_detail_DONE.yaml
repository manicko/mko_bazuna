id: TASK_056_Record_AD_VIEWED_in_ad_detail

title: Record AD_VIEWED event in ad detail view

priority: medium

depends_on:
  - TASK_004_Extend_AnalyticsEventType_trust_moderation

source_reference: .ai/plans/02/Seller Dashboard Statistics/plan.md
source_section: T6: Record AD_VIEWED in ad_detail

description: >
  Add AnalyticsEvent creation in ad_detail view for tracking ad views.
  Note: user_id is the seller (ad owner), NOT the viewer.

goals:
  - Create AD_VIEWED event on successful ad view
  - Associate event with correct seller
  - Support per-ad statistics

files:
  - path: src/backend/apps/ads/views/listings.py

    targets:
      - type: function
        name: ad_detail

changes:
  - action: add_code

    description: >
      Create AnalyticsEvent after Ad.objects.get() in ad_detail.

    code_hint: |
      AnalyticsEvent.objects.create(
          event_type=AnalyticsEventType.AD_VIEWED,
          user_id=ad.user_id,  # Seller, not viewer
          ad_id=ad.id,
      )

acceptance_criteria:
  - Event created in ad_detail view
  - Correct user_id assignment (seller)
  - Type checking passes on listings.py
  - Lint check passes on listings.py

risk_level: medium
risk_mitigation: >
  Fire-and-forget sync ORM create.
  No impact on page load performance.