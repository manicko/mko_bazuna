id: task_012_delete_orphan_env

title: Delete orphaned src/backend/.env (CFG-001)

priority: low

depends_on: []

source_reference: .ai/audit/99-validation/02-config-secrets-validated-findings.md
source_section: "CFG-001"

description: >
  src/backend/.env exists on disk but is never read by the settings layer
  (BASE_DIR resolves to repo root). It contains a SQLite URL and duplicate
  DJANGO_SECRET_KEY, violating the PostgreSQL-only rule and misleading
  operators. Delete the orphaned file (git-ignored, not a VCS leak).

goals:
  - remove the misleading orphan env file from the working tree
  - document that .env must live at the repository root

files:
  - path: src/backend/.env
    targets:
      - type: file
        name: src/backend/.env

changes:
  - action: delete_file
    description: Remove src/backend/.env from the working tree (untracked, safe to delete).

acceptance_criteria:
  - src/backend/.env no longer present
  - settings still read .env from repo root as before
