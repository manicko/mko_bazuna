id: task_011
title: Create Language Switcher UI Component

priority: medium
depends_on:
  - task_006
  - task_007

# ── Plan/Audit report source ──
source_reference: .ai\plans\i18n\plan.md
source_section: Task 2.3 — Language Switcher UI Component

description: >
  Create language switcher dropdown component with flags/icons for ru, bs, en.
  Links use ?lang=X parameter and JavaScript sets lang_pref cookie on selection.

files:
  - path: src/backend/templates/components/language_switcher.html

    targets:
      - type: module
        name: components.language_switcher

    semantic_anchors:
      insert_after:
        type: directory
        name: templates/components

    changes:
      - action: create_file
        description: >
          Create language switcher template with:
          - Button showing current language (uppercase)
          - Dropdown with language options
          - Links with ?lang=X parameter
          - JavaScript to set lang_pref cookie on selection

        code_hint: |
          <div class="relative inline-block" id="lang-switcher">
              <button type="button" class="flex items-center gap-1 px-3 py-1 text-sm rounded hover:bg-gray-100">
                  <span>{{ LANGUAGE_CODE|upper }}</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
              </button>
              <div class="absolute right-0 mt-1 w-32 bg-white border rounded-md shadow-lg hidden">
                  <a href="?lang=ru" class="block px-4 py-2 text-sm hover:bg-gray-100" data-lang="ru">Русский</a>
                  <a href="?lang=bs" class="block px-4 py-2 text-sm hover:bg-gray-100" data-lang="bs">Боснийский</a>
                  <a href="?lang=en" class="block px-4 py-2 text-sm hover:bg-gray-100" data-lang="en">English</a>
              </div>
          </div>

    acceptance_criteria:
      - Component renders in templates
      - Dropdown shows on click
      - Cookie set on language selection
      - Language preference preserved across requests