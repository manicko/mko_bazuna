id: task_024_phase1_admin_registration

title: Django admin registration (US-A1/A2/A3/A7/A11)

priority: high

depends_on:
  - task_022_phase1_core_models
  - task_023_phase1_categories_locations
  - task_025_phase1_moderation_analytics_models

source_reference: .ai/plans/01_detailed_plan_publish_discover.md
source_section: Task 3.5 — Django Admin Registration

description: >
  Register all models in Django admin for administrative access and moderation.

goals:
  - users admin: telegram_id, is_banned, is_deleted, ads_auto_publish, consent timestamps
  - ads admin: listing with status/category/city/date filters, reject/ban actions
  - categories admin: add/edit/deactivate via mptt admin
  - locations admin: city management
  - moderation admin: ModerationCriteria singleton edit, ModeratorActionLog read-only
  - admin restricted to is_staff/is_superuser; failed-ads list shows reason (never to seller)

files:
  - path: src/backend/apps/users/admin.py
    targets:
      - type: module
        name: apps.users.admin
  - path: src/backend/apps/ads/admin.py
    targets:
      - type: module
        name: apps.ads.admin
  - path: src/backend/apps/categories/admin.py
    targets:
      - type: module
        name: apps.categories.admin
  - path: src/backend/apps/locations/admin.py
    targets:
      - type: module
        name: apps.locations.admin
  - path: src/backend/apps/moderation/admin.py
    targets:
      - type: module
        name: apps.moderation.admin

changes:
  - action: add_code
    description: Register models + admin actions.

acceptance_criteria:
  - all models registered in admin
  - admin access restricted to staff/superuser
  - failed-ads view shows reason field (display only, never surfaced to sellers)
  - '"uv run ruff check" passes'
