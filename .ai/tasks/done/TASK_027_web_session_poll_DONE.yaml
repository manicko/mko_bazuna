id: task_027_web_session_poll

title: Establish web session from claim via status-poll (AUT-003)

priority: high

status: blocked

blocked_by: task_005_research_login_flow

depends_on:
  - task_026_web_consumption
  - task_005_research_login_flow

source_reference: .ai/audit/99-validation/04-auth-login-validated-findings.md
source_section: "AUT-003"

description: >
  No web session is established from a successful claim — there is no login
  view calling auth.login / session.cycle_key, so web login is non-functional.
  Implement GET /login/status/ that checks LoginToken for telegram_id set and
  consumed_at IS NULL, then (phase 2) atomically sets consumed_at, retrieves/
  creates User by telegram_id, calls django.contrib.auth.login, and invokes
  session.cycle_key to defeat fixation. Returns 200 with session cookie when
  claimed, 204 while pending, 410 when expired/invalid.

goals:
  - successful claim yields an authenticated web session
  - session fixation defeated via cycle_key
  - decoupled from bot (no bot->web callback)

files:
  - path: src/backend/apps/users/views/consent.py
    targets:
      - type: function
        name: login status-poll view
    semantic_anchors:
      insert_after:
        type: function
        value: "token consumption step"

  - path: src/backend/apps/users/urls.py
    targets:
      - type: module
        name: users urlpatterns

changes:
  - action: add_code
    description: >
      Add GET /login/status/ view performing phase-2 consumption + auth.login +
      cycle_key with the documented response codes.

acceptance_criteria:
  - polling returns 200 + session cookie once claimed
  - 204 while pending, 410 when expired/invalid
  - web dashboard accessible after claim
