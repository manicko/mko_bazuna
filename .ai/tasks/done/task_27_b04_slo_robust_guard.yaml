goals:
  - Researcher records the robust-guard shape and the bound derivation FIRST (short decision note)
  - Implementor replaces the single-sample bound with warm-up (untimed) + median of N timed samples
  - N >= 5 (e.g. 7); assert the MEDIAN <= PerformanceSLO.SEARCH_SLO_MS (2000 ms)
  - keep the test self-documenting that it is a robust guard, not a percentile instrument
  - keep the CI load-test p95 job as the SOLE percentile instrument (do NOT modify ci.yml; do NOT duplicate the p95 gate)
  - any bound change must carry its derivation (do NOT raise/delete/blind-xfail — forbidden)
  - the modified test must reliably pass under load (Validator runs it >= 3 times)

# ── Design recorded (Q4-ruled) ──
#   Robust in-repo guard: one (or more) untimed warm-up request(s), then N>=5 timed samples; assert the
#   median <= SEARCH_SLO_MS. The median absorbs the single-sample host spikes that make the current test
#   flaky. Because the flakiness is live (2986 ms / 2547 ms), the guard must be justified to absorb that.
#   Prefer NOT changing SEARCH_SLO_MS unless the Researcher's derivation demands it; if a change is
#   derived, record the derivation in the brief and the decision note. Do NOT duplicate the load-test
#   p95 gate inside the unit suite.

