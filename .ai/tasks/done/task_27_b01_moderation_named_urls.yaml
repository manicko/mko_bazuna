# Task brief — Plan 27 BLOCK B-01 (NF-1)
# Implements: moderation review page named URL tags.
# Follows .ai/tasks/templates/task_template.yaml.
# Project constraints: production code is king; small modules/functions; follow existing
# patterns; semantic targets only (NO line numbers).

id: task_27_b01_moderation_named_urls

title: NF-1 — Replace relative form actions in moderation/review.html with named {% url %} tags

priority: high

depends_on: []

source_reference: .ai/audit/problems/01-moderation-review-relative-form-actions.md
source_section: "NF-1 §2 Exact defect, §6 Option A, §8 Acceptance criteria, §9 Test contract"
source_plan: .ai/plans/27-multi-problem-remediation-execution.md
source_blocks:
  - "B-01 — NF-1: moderation review page — named URL tags"

description: >
  The staff moderation review page at /moderation/review/<ad_id>/ renders five navigation
  targets as relative references (../, ../approve/…, ../reject/…, ../ban/…). Because the page
  is served at a trailing-slash URL one path segment deeper than the template was authored for,
  every reference resolves one level too deep (RFC 3986 replaces the last path segment for each
  ".."). The four form actions POST to non-existent URLs (404); the back link points at
  /moderation/review/ (404). The fix is Option A: replace all five references with named
  {% url %} tags, which are origin-independent (correct from /moderation/review/<id>/ AND from
  the B-4 invalid-reason re-render origin /moderation/reject/<id>/).

goals:
  - replace the 5 relative references with named {% url %} tags
  - add a regression test that asserts the rendered targets using reverse()
  - change no view, urlconf, model, migration or settings
  - do NOT retire the page (that is an unresolved product decision — default Option A)

# ── Product decision (recorded) ──
# keep-vs-link-vs-retire is a PRODUCT decision and is UNRESOLVED. This brief defaults to
# Option A (named {% url %}), which keeps the page. Do NOT delete the page. See plan §F.1.

files:

  - path: src/backend/templates/admin/moderation/review.html

    targets:
      - type: template_block
        name: back_link
        anchor: 'href="../"'

      - type: template_block
        name: approve_form_on_moderation
        anchor: 'action="../approve/{{ ad.id }}/"'

      - type: template_block
        name: approve_form_on_moderation_failed
        anchor: 'action="../approve/{{ ad.id }}/"'

      - type: template_block
        name: reject_modal_form
        anchor: 'action="../reject/{{ ad.id }}/"'

      - type: template_block
        name: ban_modal_form
        anchor: 'action="../ban/{{ ad.id }}/"'

    semantic_anchors:
      note: >
        There are exactly five relative references. The approve action appears TWICE (the
        on_moderation block and the on_moderation_failed block); both are replaced. There is NO
        /moderation/ root route, so the back link must target the queue by name.

  - path: src/backend/apps/moderation/tests/test_moderation_views.py

    targets:
      - type: class
        name: existing moderation view test class (append a new test method)

    semantic_anchors:
      note: >
        Add a NEW test method; do NOT modify the existing tests or assertions (they POST to
        absolute URLs directly). The existing tests remain green and unchanged.

changes:

  - action: replace_code
    description: >
      Back link: replace href="../" with the named queue route.
    code_hint: |
      <a href="{% url 'moderation:queue' %}">&larr; Back to moderation queue</a>

  - action: replace_code
    description: >
      Approve forms (BOTH occurrences): replace action="../approve/{{ ad.id }}/" with the
      named approve route.
    code_hint: |
      <form method="post" action="{% url 'moderation:approve' ad.id %}" class="inline">

  - action: replace_code
    description: >
      Reject modal form: replace action="../reject/{{ ad.id }}/" with the named reject route.
    code_hint: |
      <form method="post" action="{% url 'moderation:reject' ad.id %}">

  - action: replace_code
    description: >
      Ban modal form: replace action="../ban/{{ ad.id }}/" with the named ban route.
    code_hint: |
      <form method="post" action="{% url 'moderation:ban' ad.id %}">

  - action: add_test
    description: >
      Add a regression test asserting the five rendered targets from BOTH render origins,
      building expectations with reverse() (never hardcoded /moderation/... strings). Use a
      response.content string match on the action="…"/href="…" attributes.
    code_hint: |
      # from /moderation/review/<id>/ (on_moderation and on_moderation_failed ads)
      #   assert action == reverse("moderation:approve", args=[ad.id])  (both forms)
      #   assert action == reverse("moderation:reject", args=[ad.id])
      #   assert action == reverse("moderation:ban", args=[ad.id])
      #   assert href   == reverse("moderation:queue")
      # from /moderation/reject/<id>/ (POST an invalid reason_category — the B-4 re-render path)
      #   assert the same five absolute targets

acceptance_criteria:
  - from /moderation/review/<id>/ the two approve forms, the reject modal, the ban modal and the
    back link carry the reverse() URLs (approve/reject/ban with args=[id]; queue without args)
  - from the B-4 re-render origin /moderation/reject/<id>/ the same five absolute targets render
  - no action="../ or href="../ reference remains in review.html
  - the recursive template sweep still finds no relative/root-absolute form actions outside review.html
  - existing moderation tests are unchanged and green; the new test uses reverse() (no hardcoded paths)
  - fast gate green; djlint clean on the touched template using the NF-5 workaround
    (PYTHONPATH=src/backend) — see B-02
  - no view, URLconf, model or migration change; the page is NOT retired

test_contract:
  how: >
    .\Makefile.ps1 test — or the Docker test service with PYTEST_OPTS targeting the moderation
    test module.
  commands:
    - "$dc = 'docker compose --project-name mko-bazuna-test --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml'"
    - "$dc run --rm -e PYTEST_OPTS=\"src/backend/apps/moderation/tests/test_moderation_views.py --tb=short\" test"
    - "uv run ruff check src/backend/apps/moderation/tests/test_moderation_views.py"
    - "$env:PYTHONPATH='src/backend'; uv run djlint src/backend/templates/admin/moderation/review.html"
  assertion_level: >
    response.content string match on action="…"/href="…" — this is a URL contract, so a string
    assertion is correct (unlike cosmetic markup).

binding_constraints:
  - template + test only; no view/urlconf/model/migration/settings change
  - build expectations with reverse(); do not hardcode /moderation/... strings
  - do not modify existing tests or assertions
  - do not retire the page (unresolved product decision)
  - djlint uses the NF-5 workaround until B-02 lands

rollback: >
  Revert src/backend/templates/admin/moderation/review.html and remove the added test method.
  Single-file template revert; no data, no schema.

dod:
  - all five references converted to {% url %}; acceptance criteria met
  - verify-do-not-assume: (i) route names moderation:queue/:approve/:reject/:ban exist at this HEAD
    (read src/backend/apps/moderation/urls.py); (ii) the sweep finds no sibling template
  - "git add src/backend/templates/admin/moderation/review.html src/backend/apps/moderation/tests/test_moderation_views.py"
  - explicit-path staging only; never git add -A; never git reset/checkout/stash
