id: task_061_login_claim_tests

title: Test login-token atomic claim (replay/expiry/used) (TST-001)

priority: critical

depends_on:
  - task_028_claim_toctou_fix
  - task_026_web_consumption

source_reference: .ai/audit/99-validation/11-test-coverage-validated-findings.md
source_section: "TST-001"

description: >
  The atomic claim (bot sets telegram_id, web sets consumed_at) and replay
  protection are untested. Add backend tests driving claim_login_token (or the
  login handler) against the real ORM: (1) fresh unclaimed+unexpired -> claimed;
  (2) re-claim -> None (replay blocked); (3) expired -> None; (4) already
  consumed/claimed -> None.

goals:
  - claim replay/expiry/already-used guarded by tests

files:
  - path: src/telegram_bot/tests/test_login_claim.py

changes:
  - action: add_code
    description: Add claim-token tests covering the four cases against the real ORM.

acceptance_criteria:
  - all four claim cases asserted
  - tests fail if claim conditions regress
