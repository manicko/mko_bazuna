id: task_003_research_pii_chat_id

title: Research — PII-001 stable bot identity (chat_id) schema & lookup rewrite

priority: critical

depends_on: []

type: research

description: >
  PII-001 (CRITICAL): withdraw_consent NULLs telegram_id, so the bot middleware
  lookup User.objects.get(telegram_id=...) raises DoesNotExist and treats the
  withdrawn user as a fresh unrestricted user — full bot access granted to a
  revoked identity. Research the schema change: add a stable chat_id BigInteger
  column (unique, indexed, NOT NULL) set on first bot contact, never nullified
  on withdraw. Map every consumer of telegram_id as the bot lookup key
  (permissions.py _check_user_state, login flow, contact flow, analytics) and
  assess migration impact (backfill from existing telegram_id, uniqueness,
  downtime). Confirm the gating logic (is_deleted, consent_revoked_at) can be
  enforced via chat_id lookup.

goals:
  - design chat_id column + migration + backfill strategy
  - enumerate all telegram_id-based bot lookups to migrate
  - produce go / go-with-changes recommendation for task_034

files:
  - path: src/backend/apps/users/models.py
  - path: src/telegram_bot/middlewares/permissions.py
  - path: src/backend/apps/users/services/deletion.py

acceptance_criteria:
  - migration plan with backfill documented
  - list of lookup call sites to rewrite provided
  - explicit go / go-with-changes verdict emitted


