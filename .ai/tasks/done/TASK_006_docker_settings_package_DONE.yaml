acceptance_criteria:
  - DJANGO_SETTINGS_MODULE=config.settings.dev manage.py check passes
  - config.settings.prod check passes
  - config.settings.test check passes in test container
  - no sqlite fallback; CONN_MAX_AGE=0 + prepare_threshold=None present
