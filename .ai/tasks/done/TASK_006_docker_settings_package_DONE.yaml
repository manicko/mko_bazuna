id: task_006_docker_settings_package

title: Settings package split (base/dev/prod/test)

priority: high

depends_on:
  - task_001_docker_pyproject_reconcile

source_reference: .ai/plans/00_detailed_plan_docker_environment.md
source_section: Task 6 — Settings Package Split (base/dev/prod/test)

description: >
  Split single config/settings.py into environment-aware package selected by DJANGO_SETTINGS_MODULE.
  PostgreSQL ONLY (no SQLite fallback per zone C5). CONN_MAX_AGE=0 + prepare_threshold=None for
  psycopg3/PgBouncer compatibility.

goals:
  - settings/ package: __init__, base, dev, prod, test
  - base: INSTALLED_APPS, MIDDLEWARE, DATABASES (PostgreSQL only), TEMPLATES, STORAGES
  - base: CONN_MAX_AGE=0, OPTIONS prepare_threshold=None
  - dev: DEBUG=True, console logging, no SSL redirect
  - prod: DEBUG=False, SECURE_SSL_REDIRECT, proxy SSL header, secure cookies
  - test: REAL PostgreSQL, faster hasher
  - django-environ for .env parsing
  - update manage.py/wsgi.py/asgi.py; delete old settings.py

