id: task_052_phase4_ci_quality_gates

title: CI/CD quality gates

priority: medium

depends_on:
  - task_033_phase1_docs_sync
  - task_011_docker_ci

source_reference: .ai/plans/04_detailed_plan_analytics_harden.md
source_section: Task 5 — CI/CD Quality Gates

description: >
  Automated lint + types + tests on GitHub Actions. (CI workflow file owned by Docker plan
  task_011; Phase 4 ensures quality-gate config in pyproject.)

goals:
  - .github/workflows/ci.yml jobs: build, lint (ruff select E,F,I,B,UP), typecheck (basedpyright standard), test (pytest + coverage vs real PG)
  - pyproject.toml has [tool.ruff] and [tool.basedpyright] config
  - all gates green before merge

files:
  - path: pyproject.toml
    targets:
      - type: file
        name: pyproject.toml
  - path: .github/workflows/ci.yml
    targets:
      - type: file
        name: .github/workflows/ci.yml

changes:
  - action: edit_content
    description: Add ruff/basedpyright config to pyproject; verify CI gate jobs.

acceptance_criteria:
  - '[tool.ruff] and [tool.basedpyright] present with project-select rules'
  - CI runs ruff + basedpyright + pytest
  - '"uv run ruff check src/" and "uv run basedpyright src/" pass locally'
