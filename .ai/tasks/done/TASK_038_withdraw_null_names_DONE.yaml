id: task_038_withdraw_null_names

title: Null first/last name on withdraw (PII-010)

priority: medium

depends_on:
  - task_037_deletion_timezone

source_reference: .ai/audit/99-validation/06-pii-consent-validated-findings.md
source_section: "PII-010"

description: >
  withdraw_consent NULLs telegram_id and username but leaves first_name/
  last_name populated for the full 30-day window. Null first_name and
  last_name at withdrawal, mirroring the existing telegram_id/username nulling,
  in line with GDPR data minimization.

goals:
  - name PII removed at withdrawal, not retained 30 days
  - consistent nulling behavior

files:
  - path: src/backend/apps/users/services/deletion.py
    targets:
      - type: function
        name: withdraw_consent
    semantic_anchors:
      insert_after:
        type: statement
        value: "user.telegram_id = None"

changes:
  - action: add_code
    description: Set user.first_name = None and user.last_name = None in withdraw_consent.

acceptance_criteria:
  - first_name/last_name nulled on withdrawal
  - existing telegram_id/username nulling preserved
