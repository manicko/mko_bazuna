id: TASK_018_Create_Trust_models

title: Create SellerTrustScore and SellerVerification models

priority: high

depends_on:
  - TASK_005_Add_TrustLevel_StrEnum

description: >
  Create SellerTrustScore and SellerVerification models in apps/trust/models.py
  for trust scoring and seller verification.

goals:
  - Enable trust score persistence for sellers
  - Track verification status (admin and phone)
  - Store ad count and rejection metrics

files:
  - path: src/backend/apps/trust/models.py

    targets:
      - type: class
        name: SellerTrustScore

      - type: class
        name: SellerVerification

    semantic_anchors:
      insert_position:
        type: module
        value: end

changes:
  - action: add_top_level

    description: >
      Create SellerTrustScore with trust_level, score, and metrics fields.
      Create SellerVerification with admin and phone verification fields.

    code_hint: |
      from django.db import models
      
      class SellerTrustScore(models.Model):
          user = models.OneToOneField("users.User", on_delete=models.CASCADE)
          trust_level = models.CharField(max_length=20, choices=[(l.value, l.label) for l in TrustLevel])
          score = models.PositiveSmallIntegerField(default=0)
          ad_count_lifetime = models.PositiveIntegerField(default=0)
          ad_count_active = models.PositiveIntegerField(default=0)
          rejection_rate = models.DecimalField(max_digits=5, decimal_places=2, default=0.0)
          contact_response_rate = models.DecimalField(max_digits=5, decimal_places=2, default=0.0)
          last_calculated = models.DateTimeField(auto_now=True)
      
      class SellerVerification(models.Model):
          user = models.OneToOneField("users.User", on_delete=models.CASCADE)
          phone_number = models.CharField(max_length=20, blank=True, null=True)
          verified_by_admin = models.BooleanField(default=False)
          verified_at = models.DateTimeField(blank=True, null=True)

acceptance_criteria:
  - Both models created in apps/trust/models.py
  - TrustLevel enum properly imported and used
  - One-to-one relations to User
  - Type checking passes
  - Lint check passes

risk_level: medium
risk_mitigation: |
  New models; no existing code affected.
  Separate trust app allows isolated development.