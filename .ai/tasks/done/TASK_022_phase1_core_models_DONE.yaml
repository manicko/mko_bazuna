id: task_022_phase1_core_models

title: Core models — User, LoginToken, Ad, AdImage

priority: high

depends_on:
  - task_021_phase1_structure_enums

source_reference: .ai/plans/01_detailed_plan_publish_discover.md
source_section: Task 2 — Core Models — User, LoginToken, Ad, AdImage

description: >
  Implement authentication and ad data models exactly per docs/02-database/db-schema.md.

goals:
  - users model: telegram_id, username, is_banned, is_deleted, ads_auto_publish, deleted_at, consent_given_at, consent_revoked_at, hard_delete_at
  - standalone LoginToken table (token_hash SHA-256, atomic claim)
  - Ad model with all lifecycle timestamps + search_vector TSVECTOR
  - AdImage with UUID v4 storage key
  - published_at resets on every PUBLISHED; original_published_at immutable
  - moderation_failed_at vs rejected_at mutually exclusive

files:
  - path: src/backend/apps/users/models.py
    targets:
      - type: class
        name: User
      - type: class
        name: LoginToken
  - path: src/backend/apps/ads/models.py
    targets:
      - type: class
        name: Ad
      - type: class
        name: AdImage

changes:
  - action: add_code
  description: Define models per docs/wiki/db-structure.md; add migrations.

acceptance_criteria:
  - LoginToken.token_hash CHAR(64) UNIQUE indexed; raw token never stored
  - Ad.category_name editable=False denormalized Russian name
  - Ad.search_vector TSVECTOR column present (NOT GENERATED ALWAYS)
  - Ad.published_at nullable; original_published_at nullable immutable
  - AdImage.image is UUID v4 key (no user/telegram PII)
  - '"uv run basedpyright" and "uv run ruff check" pass'
  - '"uv run manage.py migrate" applies'
