id: TASK_062_Delete_tailwind_config_js

title: Delete tailwind.config.js (dead under v4 standalone CLI)

priority: high

depends_on: []

source_reference: .ai/plans/08_design-system-css-pipeline_plan.md
source_section: TSK-002 — Delete tailwind.config.js

description: >
  Remove tailwind.config.js from the project root. Under the v4 standalone
  CLI (invoked without --config), the content key, theme.extend, and plugins
  are all ignored. django-tailwind template tags are not used anywhere;
  templates load CSS via {% static 'theme/css/output.css' %}.

goals:
  - Eliminate dead v3-only config that misleads maintainers
  - Prevent future confusion (v3 content key is ignored by v4 CLI)
  - No runtime impact (config not read by Django or CLI)

files:
  - path: tailwind.config.js
    action: delete_file

changes:

  - action: delete_file

    description: >
      Delete tailwind.config.js from the project root.

acceptance_criteria:
  - tailwind.config.js does not exist at project root
  - No Dockerfile or docker-compose file references --config
  - docker compose build succeeds without the file
  - No grep hits for django-tailwind template tags in templates

risk_level: low
risk_mitigation: >
  Grep-verified: django-tailwind tags not used; Dockerfile uses bare
  tailwindcss command without --config. Config is dead weight under v4.
