id: TASK_011_Implement_ThumbnailService

title: Implement ThumbnailService with Pillow

priority: high

depends_on:
  - TASK_010_Create_media_app_structure

source_reference: .ai/plans/02/Photo Thumbnail Generation/plan.md
source_section: T2.2: Implement ThumbnailService

description: >
  Implement ThumbnailService.generate_thumbnails() using Pillow with
  LANCZOS resampling, EXIF orientation correction, and proper size variants.

goals:
  - Generate three thumbnail sizes (240x180, 640x480, 1280x960)
  - Use Image.Resampling.LANCZOS constant (research fix)
  - Maintain aspect ratio with background color handling
  - Atomic writes using O_CREAT | O_EXCL | O_WRONLY
  - Progressive JPEG with quality=85

files:
  - path: src/backend/apps/media/services/thumbnails.py

    targets:
      - type: class
        name: ThumbnailService

    semantic_anchors:
      insert_position:
        type: module
        value: end

changes:
  - action: add_top_level

    description: >
      Create ThumbnailService class with generate_thumbnails method.

    code_hint: |
      class ThumbnailService:
          QUALITY = 85
          FORMAT = "JPEG"
          RESAMPLING = Image.Resampling.LANCZOS
          PROGRESSIVE = True
          SIZES = {
              ThumbnailSizeStrEnum.SMALL: (240, 180),
              ThumbnailSizeStrEnum.MEDIUM: (640, 480),
              ThumbnailSizeStrEnum.LARGE: (1280, 960),
          }
          
          @staticmethod
          def generate_thumbnails(photo_bytes: bytes, original_key: str) -> Dict[ThumbnailSizeStrEnum, str]: ...

acceptance_criteria:
  - ThumbnailService.generate_thumbnails implemented
  - Uses LANCZOS resampling constant
  - Storage key pattern <uuid>-<size>.jpg followed
  - Atomic write implementation with O_CREAT | O_EXCL
  - Quality=85 and progressive JPEG enabled
  - Type checking passes on thumbnails.py
  - Lint check passes on thumbnails.py

risk_level: low
risk_mitigation: >
  Service in isolation; no existing code modified.
  Original images preserved via separate storage.