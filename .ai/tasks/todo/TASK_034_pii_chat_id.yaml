id: task_034_pii_chat_id

title: Stable bot identity via chat_id column + lookup rewrite (PII-001)

priority: critical

status: blocked

blocked_by: task_003_research_pii_chat_id

depends_on:
  - task_003_research_pii_chat_id
  - task_007_fix_bot_import_order

source_reference: .ai/audit/99-validation/06-pii-consent-validated-findings.md
source_section: "PII-001"

description: >
  WITHDRAW NULLs telegram_id, so the bot middleware lookup
  User.objects.get(telegram_id=...) raises DoesNotExist and treats the
  withdrawn user as a fresh unrestricted user — full bot access granted to a
  revoked identity. Per research_003: add a stable chat_id BigInteger column
  (unique, indexed, NOT NULL) set on first bot contact and never nullified on
  withdraw; update permissions.py to look up by chat_id, then check is_deleted
  and consent_revoked_at. telegram_id remains for web login only. Create a
  migration (with backfill from existing telegram_id).

goals:
  - withdrawn/deleted users are blocked by the bot
  - bot lookup key survives telegram_id nulling
  - no hidden consumers of telegram_id-as-bot-key left behind

files:
  - path: src/backend/apps/users/models.py
    targets:
      - type: class
        name: User
    semantic_anchors:
      insert_after:
        type: field
        value: "telegram_id = ..."
    migrations:
      - create migration for chat_id with backfill

  - path: src/telegram_bot/middlewares/permissions.py
    targets:
      - type: function
        name: _check_user_state
    semantic_anchors:
      edit_line:
        type: statement
        value: "User.objects.get(telegram_id=telegram_id)"

  - path: src/telegram_bot/main.py
    targets:
      - type: function
        name: bot startup (set chat_id on contact)

changes:
  - action: add_field
    description: >
      Add chat_id column + migration/backfill; rewrite bot lookup to chat_id
      with is_deleted / consent_revoked_at gating.

acceptance_criteria:
  - withdrawn user is blocked by the bot (no full access)
  - chat_id set on first contact, never nullified on withdraw
  - existing users backfilled; migration applies cleanly
