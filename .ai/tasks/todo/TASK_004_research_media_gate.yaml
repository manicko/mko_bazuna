id: task_004_research_media_gate

title: Research — app-level media access gate (nginx X-Accel-Redirect handoff)

priority: critical

depends_on: []

type: research

description: >
  MED-001 (CRITICAL): nginx serves /media/ directly with no per-request access
  control, so unpublished/withdrawn/deleted ad photos are fetchable by URL
  (security by obscurity). Research the proxy handoff: add an internal nginx
  location + X-Accel-Redirect from a Django view that looks up AdImage -> Ad,
  asserts status == PUBLISHED (and staff moderation queue), then redirects to
  the internal location. Assess nginx config structure (existing media headers,
  proxy_pass, ssl), Django url/route placement, and template image_url usage.
  Confirm no regression for legitimately published media and for the admin
  moderation preview.

goals:
  - design internal location + X-Accel-Redirect handoff
  - identify route placement and view responsibilities
  - produce go / go-with-changes recommendation for task_044

files:
  - path: docker/nginx/nginx.conf
  - path: src/backend/config/urls.py
  - path: src/backend/apps/ads/urls.py
  - path: src/backend/apps/ads/views/listings.py

acceptance_criteria:
  - handoff design documenting internal location + view responsibilities
  - list of templates/consumers of /media/ URLs provided
  - explicit go / go-with-changes verdict emitted
