id: task_049_phase4_lifecycle_sweeps

title: Lifecycle sweep commands (decision J, locks 1-5)

priority: high

depends_on:
  - task_027_phase1_lifecycle_indexes
  - task_037_phase2_purge_failed
  - task_038_phase2_purge_rejected

source_reference: .ai/plans/04_detailed_plan_analytics_harden.md
source_section: Task 2 — Lifecycle Sweep Commands (decision J)

description: >
  Idempotent management commands for scheduled cleanup and consent erasure. ALL 5 commands MUST
  import advisory_lock from apps.core.utils.advisory_lock (DO NOT inline or recreate the util) and
  use transaction-scoped locks 1-5. This is the single source of truth per Docker plan (L-4).

goals:
  - archive_sweep (lock 1): PUBLISHED + published_at < now()-2mo -> ARCHIVED, archived_at; IX_ads_archive_sweep
  - delete_sweep (lock 2): ARCHIVED + published_at < now()-4mo -> delete + CASCADE images; IX_ads_delete_sweep
  - consent_hard_delete (lock 3): consent_revoked_at NOT NULL + < now()-30d -> NULL telegram_id/username, DELETE ads+images, SET NULL analytics_events.user_id + ModeratorActionLog.user_id; IX_users_erasure_sweep
  - sweep_drafts (lock 4): DRAFT + created_at < now()-30min -> delete
  - cleanup_login_tokens (lock 5): expires_at < now() OR (consumed_at NOT NULL AND created_at < now()-1d) -> delete
  - each: --dry-run flag, logger (no print), idempotent

files:
  - path: src/backend/apps/core/management/commands/archive_sweep.py
    targets:
      - type: module
        name: apps.core.management.commands.archive_sweep
  - path: src/backend/apps/core/management/commands/delete_sweep.py
    targets:
      - type: module
        name: apps.core.management.commands.delete_sweep
  - path: src/backend/apps/core/management/commands/consent_hard_delete.py
    targets:
      - type: module
        name: apps.core.management.commands.consent_hard_delete
  - path: src/backend/apps/core/management/commands/sweep_drafts.py
    targets:
      - type: module
        name: apps.core.management.commands.sweep_drafts
  - path: src/backend/apps/core/management/commands/cleanup_login_tokens.py
    targets:
      - type: module
        name: apps.core.management.commands.cleanup_login_tokens

changes:
  - action: add_code
    description: Implement 5 sweep commands, each wrapping advisory_lock(1..5) from core utils.

acceptance_criteria:
  - all 5 commands import advisory_lock from apps.core.utils.advisory_lock (lock ids 1-5)
  - archive_sweep uses IX_ads_archive_sweep; delete_sweep IX_ads_delete_sweep; consent_hard_delete IX_users_erasure_sweep
  - consent_hard_delete preserves reason/admin/timestamp (SET NULL user_id only)
  - all commands idempotent with --dry-run; log via logger
  - no recreation of advisory_lock.py
