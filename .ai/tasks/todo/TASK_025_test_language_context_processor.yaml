verification_steps:
  - build: uv run basedpyright src/backend/apps/core/context_processors.py
  - test: uv run pytest src/backend/apps/core/tests/test_context_processors.py -v
  - smoke_check: uv run python -c "from apps.core.context_processors import language; print('Context processor importable')"

pass_criteria:
