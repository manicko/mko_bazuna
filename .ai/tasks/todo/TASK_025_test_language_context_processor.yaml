  - Returns LANGUAGE_CODE in context dict
  - Default to Russian when not set
  - Unit tests pass

test_specification:
  - description: >
      Test language() function:
        - Returns {"LANGUAGE_CODE": value} dict
        - Correctly extracts LANGUAGE_CODE from request
        - Returns "ru" as default when not set