id: task_028_claim_toctou_fix

title: Fix login-token claim TOCTOU race (EXT-002)

priority: high

status: blocked

blocked_by: task_005_research_login_flow

depends_on:
  - task_019_login_getorcreate_race
  - task_005_research_login_flow

source_reference: .ai/audit/99-validation/09-external-api-validated-findings.md
source_section: "EXT-002"

description: >
  claim_login_token performs the claim as two separate queries (UPDATE then a
  separate GET), not guaranteed in one transaction under CONN_MAX_AGE=0, so two
  claimants can both win (replay). Use QuerySet.update(..., returning=True)
  (Django 3.1+) to return the updated row from a single atomic UPDATE inside
  transaction.atomic().

goals:
  - exactly one claimant wins under concurrency
  - no separate re-read outside the UPDATE scope

files:
  - path: src/telegram_bot/handlers/login.py
    targets:
      - type: function
        name: claim_login_token (inner _claim)
    semantic_anchors:
      edit_block:
        type: statement
        value: "LoginToken.objects.get(token_hash=token_hash)  # GET #2"

changes:
  - action: replace
    description: >
      Replace filter+update then get() with a single atomic update(...,
      returning=True) wrapped in transaction.atomic().

acceptance_criteria:
  - single atomic claim; concurrent claims cannot both succeed
  - returned row is the claimed LoginToken
