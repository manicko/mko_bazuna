id: task_010_web_restart_policy

title: Add restart policy to base web service (EXT-008)

priority: medium

depends_on: []

source_reference: .ai/audit/99-validation/09-external-api-validated-findings.md
source_section: "EXT-008"

description: >
  In docker-compose.yml the web (gunicorn) service has no restart key, while
  bot and nginx declare restart: unless-stopped. The production override adds
  it, but base compose is what `docker compose up` runs by default. Add an
  explicit restart policy to the base web service for consistent semantics.

goals:
  - web restarts on crash/OOM like bot and nginx
  - no split-brain where site is down while bot still accepts /post

files:
  - path: docker-compose.yml
    targets:
      - type: service
        name: web
    semantic_anchors:
      insert_after:
        type: key
        value: "web: command: gunicorn ..."

changes:
  - action: add_key
    description: Add `restart: unless-stopped` (or on-failure) to the base web service.

acceptance_criteria:
  - docker-compose.yml web service declares a restart policy
  - compose config validates
