id: task_048_phase4_analytics_tracking

title: Analytics event tracking (decision L)

priority: high

depends_on:
  - task_025_phase1_moderation_analytics_models
  - task_031_phase1_auto_moderation

source_reference: .ai/plans/04_detailed_plan_analytics_harden.md
source_section: Task 1 — Analytics Event Tracking (decision L)

description: >
  Cookieless web analytics + internal product metrics. Plausible JS snippet (NO Python dep,
  NO consent banner). AnalyticsEvent on REGISTRATION_CREATED/AD_PUBLISHED/SEARCH_PERFORMED/CONTACT_INITIATED.

goals:
  - templates/base.html: Plausible snippet via PLAUSIBLE_HOST env (cookieless, no banner)
  - AnalyticsEvent model already in Phase 1 (task_025); add recording hooks
  - events: REGISTRATION_CREATED (login), AD_PUBLISHED (auto-mod pass), SEARCH_PERFORMED (search view), CONTACT_INITIATED (contact deep-link)
  - admin metrics view + CLI show_metrics (ORM aggregates)
  - user_id SET NULL on erasure (zone R5)

files:
  - path: src/backend/templates/base.html
    targets:
      - type: file
        name: templates/base.html
  - path: src/backend/apps/analytics/admin.py
    targets:
      - type: module
        name: apps.analytics.admin
  - path: src/backend/apps/analytics/management/commands/show_metrics.py
    targets:
      - type: module
        name: apps.analytics.management.commands.show_metrics

changes:
  - action: add_code
    description: Wire Plausible snippet + event recording hooks + admin/CLI metrics.

acceptance_criteria:
  - Plausible snippet injected via env, no consent banner
  - 4 event types recorded at correct trigger points
  - admin metrics view + show_metrics CLI aggregate by type/date
  - user_id SET NULL on erasure preserves aggregates
  - '"uv run ruff check" passes'
