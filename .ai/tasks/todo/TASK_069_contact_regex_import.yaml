id: task_069_contact_regex_import

title: Import contact deep-link regex from source (TST-011)

priority: low

depends_on:
  - task_032_contact_delegate

source_reference: .ai/audit/99-validation/11-test-coverage-validated-findings.md
source_section: "TST-011"

description: >
  test_contact.py re-declares the contact deep-link regex inline instead of
  importing the source-of-truth constant from the bot handler, risking test/impl
  drift. Import the regex constant from contact.py in the test.

goals:
  - single source of truth for the deep-link pattern

files:
  - path: src/backend/apps/core/tests/test_contact.py
    targets:
      - type: module
        name: CONTACT_PATTERN
    semantic_anchors:
      edit_line:
        type: statement
        value: "CONTACT_PATTERN = re.compile(r\"^contact_(\\d+)$\")"

changes:
  - action: replace
    description: Import CONTACT_PATTERN from the bot handler instead of re-declaring.

acceptance_criteria:
  - test imports the regex from source
  - no local duplicate declaration
