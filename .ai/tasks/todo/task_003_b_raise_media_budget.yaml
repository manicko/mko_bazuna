# Task brief — Plan 003 BLOCK B
# Raise MEDIA_GATE rate-limit budget from 60/60s to 240/60s (4x headroom).

id: task_003_b_raise_media_budget

title: Block B — raise MEDIA_GATE budget to 240 req / 60s

priority: medium

depends_on: []

source_reference: .ai/plans/001-media-rate-limit-remediation.md
source_section: "§3 — Work Block B"
source_plan: .ai/plans/001-media-rate-limit-remediation.md
source_blocks:
  - "BLOCK B — Raise MEDIA_GATE rate-limit budget"

description: >
  The MEDIA_GATE budget of 60 requests / 60s is too tight for a 24-image listing
  page: 2.5 sorts exhaust it. This block raises the request count from 60 to 240
  (4x), allowing ~10 page loads within the 60s window. The period (60s) is
  unchanged — it is the reviewed, documented value. Block A (Cache-Control
  max-age) is the primary fix that eliminates most re-fetches; Block B provides
  headroom for the initial uncached browsing and shared-IP scenarios.

goals:
  - MEDIA_GATE requests = 240 (was 60)
  - MEDIA_GATE period = 60 (unchanged)
  - docstring updated to reflect new budget
  - tests pinning (60, 60) updated to (240, 60)
  - new test asserting 240 requests are allowed within the window

files:
  - path: src/backend/apps/core/enums.py
    targets:
      - type: class
        name: RateLimitBudget
        member: MEDIA_GATE
    semantic_anchors:
      replace_value:
        type: dictionary_value
        key: "RateLimitBudget.MEDIA_GATE"

changes:
  - action: modify_enum_value
    description: >
      In RateLimitBudget.requests property: change MEDIA_GATE dictionary value
      from 60 to 240 (line 63). Update docstring (lines 45-46) to reference
      240/60s.
    code_hint: |
      MEDIA_GATE: 240,  # was 60

acceptance_criteria:
  - RateLimitBudget.MEDIA_GATE.requests == 240
  - RateLimitBudget.MEDIA_GATE.period == 60
  - MEDIA_RATE_LIMIT_REQUESTS (derived constant) == 240
  - (MEDIA_RATE_LIMIT_REQUESTS, MEDIA_RATE_LIMIT_PERIOD) == (240, 60)
  - test_burst_over_budget_is_refused still passes (now with 240 iterations)
  - new test test_media_gate_budget_allows_ten_page_loads passes
  - all other budgets unchanged (SEARCH_PAGE=30, AUTOCOMPLETE=30, DEEP_LINK_RENDER=60, LOGIN_ISSUE=10)

test_contract:
  how: >
    Update test_budgets_are_the_reviewed_values and
    test_period_constant_is_the_documented_window to assert (240, 60).
    Add test_media_gate_budget_allows_ten_page_loads (240 requests in 60s allowed).
  commands:
    - "$dc = 'docker compose --project-name mko-bazuna-test --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml'"
    - "$dc run --rm -e PYTEST_OPTS='src/backend/apps/core/tests/test_rate_limit_budget.py src/backend/apps/ads/tests/test_media_security.py::TestMediaGateApplicationRateLimit --tb=short' test"
    - "uv run ruff check src/backend/apps/core/enums.py"
    - "uv run basedpyright src/backend/apps/core/enums.py"
  assertion_level: >
    Budget is exactly 240/60s; all existing budget tests updated; new test passes.

binding_constraints:
  - ONLY change the MEDIA_GATE value (60→240) and its docstring
  - period must remain 60
  - all other budgets must remain unchanged
  - no .ai/audit/** changes

rollback: >
  Revert the value change and docstring in enums.py, revert test updates.
  One-line value change + docstring; minimal blast radius.

dod:
  - MEDIA_GATE requests = 240, period = 60
  - docstring updated
  - test_budgets_are_the_reviewed_values passes with (240, 60)
  - test_period_constant_is_the_documented_window passes with (240, 60)
  - new test passes
  - ruff + basedpyright clean
  - git add <specific-files> && git commit -m "chore(rate_limit): raise MEDIA_GATE budget to 240/60s"

agents:
  auditor: no
  researcher: no
  planner: no
  implementor: yes
  validator: no
  docs_specialist: no
