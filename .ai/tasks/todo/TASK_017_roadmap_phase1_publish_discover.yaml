  - PostgreSQL triggers + GIN index (search_vector)
  - Publication + lifecycle indexes
  - TLS-ready settings contribution
  - Deployment wiring (consume Docker plan)
  - Telegram bot FSM (login + ad creation)
  - Auto-moderation service
  - Web listing + FTS search views
  - Documentation sync

