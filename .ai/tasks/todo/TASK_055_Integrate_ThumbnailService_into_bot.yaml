id: TASK_055_Integrate_ThumbnailService_into_bot

title: Integrate ThumbnailService into bot photo handler

priority: high

source_reference: .ai/plans/02/Photo Thumbnail Generation/plan.md
source_section: T3.2: Integrate with save_photo() and update_ad_and_moderate()

depends_on:
  - TASK_011_Implement_ThumbnailService
  - TASK_012_Add_AdImage_thumbnail_fields

description: >
  Update telegram_bot/handlers/ad_create.py to integrate ThumbnailService
  into the photo upload flow. Generate thumbnails in update_ad_and_moderate().

goals:
  - Import ThumbnailService in ad_create.py
  - Generate thumbnails for each uploaded photo in update_ad_and_moderate
  - Update AdImage records with thumbnail storage keys

files:
  - path: src/telegram_bot/handlers/ad_create.py

    targets:
      - type: function
        name: save_photo

      - type: function
        name: update_ad_and_moderate

changes:
  - action: add_code

    description: >
      Import ThumbnailService and integrate into photo saving flow in update_ad_and_moderate.

    code_hint: |
      from apps.media.services.thumbnails import ThumbnailService
      
      # In update_ad_and_moderate(), after AdImage.objects.create():
      # thumbnail_keys = ThumbnailService.generate_thumbnails(photo_bytes, storage_key)
      # ad_image.thumbnail_small = thumbnail_keys.get(ThumbnailSizeStrEnum.SMALL)
      # ad_image.thumbnail_medium = thumbnail_keys.get(ThumbnailSizeStrEnum.MEDIUM)
      # ad_image.thumbnail_large = thumbnail_keys.get(ThumbnailSizeStrEnum.LARGE)
      # ad_image.save()

acceptance_criteria:
  - ThumbnailService imported in ad_create.py
  - Thumbnails generated for each uploaded photo
  - AdImage records updated with thumbnail storage keys
  - Type checking passes on ad_create.py
  - Lint check passes on ad_create.py

risk_level: medium
risk_mitigation: >
  Original photos saved separately.
  Thumbnail failure falls back gracefully.