id: TASK_017_Create_SavedSearch_models

title: Create SavedSearch and SavedSearchNotification models

priority: high

source_reference: .ai/plans/02/Saved Search Alerts/plan.md
source_section: T1: SavedSearch & SavedSearchNotification Models

depends_on:
  - TASK_004_Extend_AnalyticsEventType_trust_moderation
  - TASK_027_Extend_AdvisoryLockId_for_phases

description: >
  Create SavedSearch and SavedSearchNotification models in apps/search/models.py
  for saved search alert functionality.

goals:
  - Enable users to save search queries
  - Track notification delivery to prevent duplicates
  - Support city, category, and price filters
  - Unique constraint on (saved_search, ad) pair

files:
  - path: src/backend/apps/search/models.py

    targets:
      - type: class
        name: SavedSearch

      - type: class
        name: SavedSearchNotification

    semantic_anchors:
      insert_position:
        type: module
        value: end

changes:
  - action: add_top_level

    description: >
      Create SavedSearch model with filters and SavedSearchNotification for deduplication.

    code_hint: |
      class SavedSearch(models.Model):
          user = models.ForeignKey("users.User", on_delete=models.CASCADE)
          query = models.TextField(blank=True, null=True)
          city = models.ForeignKey("locations.City", on_delete=models.SET_NULL, blank=True, null=True)
          category = models.ForeignKey("categories.Category", on_delete=models.SET_NULL, blank=True, null=True)
          min_price = models.PositiveIntegerField(blank=True, null=True)
          max_price = models.PositiveIntegerField(blank=True, null=True)
          is_active = models.BooleanField(default=True)
          created_at = models.DateTimeField(auto_now_add=True)
      
      class SavedSearchNotification(models.Model):
          saved_search = models.ForeignKey(SavedSearch, on_delete=models.CASCADE)
          ad = models.ForeignKey("ads.Ad", on_delete=models.CASCADE)
          sent_at = models.DateTimeField(auto_now_add=True)

acceptance_criteria:
  - Both models created in apps/search/models.py
  - One-to-many relationships correct
  - Unique constraint on (saved_search, ad)
  - Type checking passes
  - Lint check passes

risk_level: medium
risk_mitigation: |
  Models isolated to search app.
  Nullable filters allow flexible saved searches.