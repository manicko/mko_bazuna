id: task_015_wrap_translate

title: Wrap translate_to_russian off the event loop with timeout (ENT-004, EXT-003)

priority: high

depends_on:
  - task_014_wrap_save_photo

depends_on_previous_task_in_chain:
  - task_014_wrap_save_photo

source_reference: .ai/audit/99-validation/01-entry-architecture-validated-findings.md
source_section: "ENT-004"
source_reference_2: .ai/audit/99-validation/09-external-api-validated-findings.md
source_section_2: "EXT-003"

description: >
  translate_to_russian() performs a synchronous GoogleTranslator network call
  inside an async def with no timeout, freezing all Telegram updates during
  translation latency. Wrap it in asyncio.to_thread / sync_to_async with a hard
  timeout (asyncio.wait_for) and keep the original-text fallback.

goals:
  - translation no longer blocks the single event loop
  - stalled translator cannot hang the bot indefinitely
  - fallback to original text preserved

files:
  - path: src/telegram_bot/handlers/ad_create.py
    targets:
      - type: function
        name: translate_to_russian
    semantic_anchors:
      insert_before:
        type: statement
        value: "GoogleTranslator(source=\"auto\", target=\"ru\").translate(title)"

changes:
  - action: wrap
    description: >
      Run the GoogleTranslator calls via asyncio.to_thread and bound total
      latency with asyncio.wait_for; preserve the existing except -> original
      fallback.

acceptance_criteria:
  - translation executes off the event loop
  - a stalled endpoint raises/times out instead of blocking
  - ad submission latency is not gated by translator latency
