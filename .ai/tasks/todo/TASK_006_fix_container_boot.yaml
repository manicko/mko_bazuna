id: task_006_fix_container_boot

title: Fix container boot — import paths / package install (ENT-001, ENT-007)

priority: critical

status: blocked

blocked_by: task_001_research_boot_packaging

depends_on:
  - task_001_research_boot_packaging

source_reference: .ai/audit/99-validation/01-entry-architecture-validated-findings.md
source_section: "ENT-001 / ENT-007"

description: >
  Make all three container processes importable. Per research_001 verdict,
  either (a) install the project via `uv sync` without `--no-install-project`
  and correct `[tool.setuptools.packages.find]` to the real layout
  (src/backend/{apps,config,theme}, src/telegram_bot), or (b) set
  PYTHONPATH=/app/src/backend:/app/src in the Dockerfile ENV. Resolve the
  same root cause that also breaks the test suite entrypoint (ENT-006 merged).

goals:
  - all processes boot: web (gunicorn), bot (telegram_bot.main), migrate/scheduler
  - test suite becomes collectable/runnable from the CI entrypoint
  - pyproject package discovery matches real source layout

files:
  - path: docker/Dockerfile
    targets:
      - type: build_step
        name: uv sync / ENV PYTHONPATH
    semantic_anchors:
      insert_after:
        type: comment
        value: "uv sync --frozen --no-install-project"

  - path: pyproject.toml
    targets:
      - type: table
        name: "[tool.setuptools.packages.find]"
    semantic_anchors:
      edit_block:
        type: config_table
        value: "include = [\"mko_bazuna*\", ...]"

changes:
  - action: add_or_fix
    description: >
      Apply chosen strategy from research_001: remove --no-install-project and
      fix package discovery OR add PYTHONPATH ENV. Ensure both web and bot
      entrypoints resolve config/apps/telegram_bot.

acceptance_criteria:
  - docker image builds and `python -c "import config, apps, telegram_bot"` succeeds
  - bot process starts and reaches django.setup() cleanly
  - pytest collection works from CI/test entrypoint
