id: TASK_015_Create_SearchHistory_model

title: Create SearchHistory model for user tracking

priority: high

source_reference: .ai/plans/02/Search Autocomplete/plan.md
source_section: T2: Create SearchHistory Model

description: >
  Create SearchHistory model in apps/search/models.py to store user search
  history for personalized autocomplete.

goals:
  - Track user search queries
  - Enable personalized autocomplete
  - Support deduplication and max 50 entries per user

files:
  - path: src/backend/apps/search/models.py

    targets:
      - type: class
        name: SearchHistory

    semantic_anchors:
      insert_after:
        type: class
        name: PopularSearch

changes:
  - action: add_field

    description: >
      Add SearchHistory model with user, query, created_at fields.

    code_hint: |
      class SearchHistory(models.Model):
          user = models.ForeignKey(
              "users.User",
              on_delete=models.CASCADE,
              null=True,
              blank=True,
          )
          query = models.CharField(max_length=200)
          query_normalized = models.CharField(max_length=200, db_index=True)
          created_at = models.DateTimeField(auto_now_add=True)
      
          class Meta:
              db_table = "search_history"

acceptance_criteria:
  - SearchHistory model created in apps/search/models.py
  - Fields match specification including indexes
  - Type checking passes on models.py
  - Lint check passes on models.py

risk_level: low
risk_mitigation: |
  New model; no existing code affected.