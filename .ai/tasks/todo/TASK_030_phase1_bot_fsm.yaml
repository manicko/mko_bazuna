        name: telegram_bot.handlers.login
  - path: src/telegram_bot/handlers/ad_create.py
    targets:
      - type: module
        name: telegram_bot.handlers.ad_create
  - path: src/telegram_bot/services/media.py
    targets:
      - type: module
        name: telegram_bot.services.media
  - path: src/telegram_bot/main.py
    targets:
      - type: module
        name: telegram_bot.main

changes:
  - action: add_code
    description: Implement aiogram FSM, login handler, ad-create handler, media service, main.

acceptance_criteria:
  - AdCreateState has all 7 steps
  - login claim uses atomic UPDATE + hmac.compare_digest (zone C1)
  - photo validation rejects documents; accepts 1..5 JPEG
  - content translated to Russian before Ad create (decision G)
  - Ad(status=DRAFT) persisted in ORM; FSM only tracks steps (no DB FSM storage)
  - bot wraps ORM/photo ops in sync_to_async
  - '"uv run ruff check" + "uv run basedpyright" pass'
