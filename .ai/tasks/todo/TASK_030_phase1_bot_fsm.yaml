id: task_030_phase1_bot_fsm

title: Telegram bot FSM layer (aiogram 3.x)

priority: high

depends_on:
  - task_022_phase1_core_models
  - task_023_phase1_categories_locations
  - task_025_phase1_moderation_analytics_models
  - task_002_docker_dockerfile
  - task_003_docker_compose_base
  - task_007_docker_nginx

source_reference: .ai/plans/01_detailed_plan_publish_discover.md
source_section: Task 9 — Telegram Bot FSM Layer (aiogram 3.x)

description: >
  Login via deep-link + step-by-step ad creation (US-S1, US-S2). Content stored in Russian
  (deep-translator before create). Draft persisted as Ad(DRAFT) in ORM (no DB-backed FSM).

goals:
  - states: AdCreateState (CATEGORY, CITY, TITLE, DESCRIPTION, PRICE, PHOTOS, PREVIEW)
  - Pydantic v2 DTOs for message payloads (rule 11)
  - login handler: SHA-256 token, atomic claim via UPDATE, hmac.compare_digest
  - category step: TOP-3-5 suggest, free-text-as-category rejected
  - photo step: message.photo only, JPEG validate, 1..5, UUID v4 key, telegram_file_id metadata
  - submit: DRAFT -> ON_MODERATION, run auto-moderation, preview before send
  - translate title/description to Russian via deep-translator + cache
  - draft idle timeout 30 min (sweep in Phase 4)
  - bot django.setup() + sync_to_async

files:
  - path: src/telegram_bot/states.py
    targets:
      - type: module
        name: telegram_bot.states
  - path: src/telegram_bot/schemas/message_payloads.py
    targets:
      - type: module
        name: telegram_bot.schemas.message_payloads
  - path: src/telegram_bot/handlers/login.py
    targets:
