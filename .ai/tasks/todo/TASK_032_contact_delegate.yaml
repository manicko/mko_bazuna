id: task_032_contact_delegate

title: Delegate bot contact to shared core contact service (QLT-002)

priority: high

depends_on: []

source_reference: .ai/audit/99-validation/10-code-quality-validated-findings.md
source_section: "QLT-002"

description: >
  check_seller_available() re-implements the exact Zone R2 gating conditions
  already present in core.services.contact.get_seller_for_contact(), and
  record_contact_event() duplicates record_contact_initiated(). Replace the bot
  duplicates with calls to the shared service so R2 logic lives in one place.

goals:
  - single source of truth for R2 contact gating
  - no drift between bot and web contact paths

files:
  - path: src/telegram_bot/handlers/contact.py
    targets:
      - type: function
        name: check_seller_available
    semantic_anchors:
      replace_block:
        type: statement
        value: "inline R2 gating conditions"

  - path: src/telegram_bot/handlers/contact.py
    targets:
      - type: function
        name: record_contact_event

changes:
  - action: replace
    description: >
      Call core.services.contact.get_seller_for_contact(ad_id) and
      record_contact_initiated(); remove the duplicated bot helpers.

acceptance_criteria:
  - bot contact uses the shared service for gating + event recording
  - R2 conditions identical to web path
