id: task_054_translation_circuit_breaker

title: Add lightweight circuit-breaker to web translator (EXT-005)

priority: medium

depends_on:
  - task_047_query_timeout_nonblock

source_reference: .ai/audit/99-validation/09-external-api-validated-findings.md
source_section: "EXT-005"

description: >
  Both translation paths use deep_translator's unofficial endpoint with no
  circuit-breaker/backoff/quota awareness (the bot path has no timeout at all).
  Add an in-process circuit-breaker in query_translator: a failure counter with
  a cooldown window that short-circuits to the original-query fallback for T
  seconds after N consecutive failures, logging a warning. Avoid adding the
  pybreaker dependency.

goals:
  - graceful degradation under translator throttling
  - no new heavy dependency

files:
  - path: src/backend/apps/search/services/query_translator.py
    targets:
      - type: module
        name: query_translator (resilience)

changes:
  - action: add_code
    description: Add a small failure-counter circuit-breaker with cooldown to the web translator.

acceptance_criteria:
  - after N consecutive failures, fallback engages for cooldown window
  - normal operation unaffected
