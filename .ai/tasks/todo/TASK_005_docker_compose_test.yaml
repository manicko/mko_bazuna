id: task_005_docker_compose_test

title: Test environment (docker-compose.test.yml)

priority: medium

depends_on:
  - task_002_docker_dockerfile
  - task_006_docker_settings_package

source_reference: .ai/plans/00_detailed_plan_docker_environment.md
source_section: Task 4 — Test Environment (docker-compose.test.yml)

description: >
  Configure ephemeral real PostgreSQL for CI-compatible testing (NOT SQLite — Russian FTS +
  plpgsql triggers require real PG). One-shot test service runs migrate then pytest.

goals:
  - postgres:17 (no persistent volume)
  - test service runs migrate + pytest --tb=short
  - DJANGO_SETTINGS_MODULE=config.settings.test
  - 'asyncio_mode="strict" + minversion="8.4" (set in Task 0)'
  - test DB destroyed after run

files:
  - path: docker-compose.test.yml
    targets:
      - type: file
        name: docker-compose.test.yml
  - path: docker/entrypoint-test.sh
    targets:
      - type: file
        name: docker/entrypoint-test.sh

changes:
  - action: add_code
    description: Add test compose + entrypoint-test.sh.

acceptance_criteria:
  - '"docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm test" exits with pytest code'
  - real PostgreSQL used; ephemeral DB destroyed after run
