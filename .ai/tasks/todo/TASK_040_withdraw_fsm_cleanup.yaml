id: task_040_withdraw_fsm_cleanup

title: Purge DRAFT photos + reconcile on mid-FSM withdrawal (PII-005)

priority: high

depends_on:
  - task_021_media_delete_helper
  - task_035_withdraw_route

source_reference: .ai/audit/99-validation/06-pii-consent-validated-findings.md
source_section: "PII-005"

description: >
  Withdrawing mid-FSM leaves DRAFT photos on disk and the in-progress FSM in
  bot MemoryStorage. Add a reconciliation sweep that deletes media files and
  Ad/AdImage rows for ads belonging to is_deleted=True users, and document that
  in-memory FSM state is ephemeral (cleared on bot restart) since MemoryStorage
  has no cross-process broadcast. Optionally emit a Django signal for future
  Redis-backed FSM adoption.

goals:
  - no residual DRAFT photo bytes after withdrawal
  - documented FSM-state limitation

files:
  - path: src/backend/apps/users/services/deletion.py
    targets:
      - type: function
        name: soft_delete_user_ads / withdraw_consent
    semantic_anchors:
      insert_after:
        type: statement
        value: "UPDATE ads to DELETED"

  - path: src/telegram_bot/main.py
    targets:
      - type: module
        name: MemoryStorage declaration
    semantic_anchors:
      insert_after:
        type: comment
        value: "MemoryStorage()"

changes:
  - action: add_code
    description: Add media+row cleanup for deleted users' drafts; add a comment documenting FSM ephemerality.

acceptance_criteria:
  - withdrawn users' DRAFT media removed
  - main.py documents MemoryStorage FSM limitation
