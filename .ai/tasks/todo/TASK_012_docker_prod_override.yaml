id: task_012_docker_prod_override

title: Production override (docker-compose.prod.yml)

priority: high

depends_on:
  - task_003_docker_compose_base
  - task_006_docker_settings_package

source_reference: .ai/plans/00_detailed_plan_docker_environment.md
source_section: Task 5 — Production Override (docker-compose.prod.yml)

description: >
  Immutable image deployment with TLS hardening and scheduler. gunicorn sync WSGI for web,
  python -m telegram_bot.main for bot, nginx mandatory, optional pgbouncer profile.

goals:
  - web: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3, restart unless-stopped
  - bot: python -m telegram_bot.main, restart unless-stopped
  - nginx mandatory, TLS cert paths from env
  - scheduler service in loop (hourly), restart unless-stopped
  - optional pgbouncer via --profile pgbouncer
  - web/bot ports NOT published to host

files:
  - path: docker-compose.prod.yml
    targets:
      - type: file
        name: docker-compose.prod.yml

changes:
  - action: add_code
    description: Write prod override (also hosts scheduler + pgbouncer blocks per Tasks 9/12).

acceptance_criteria:
  - '"docker compose -f docker-compose.yml -f docker-compose.prod.yml config" validates'
  - '"--profile pgbouncer config" includes PgBouncer'
  - web/bot ports not published in prod compose
