id: TASK_049_Create_popular_search_service

title: Create popular_search service functions

priority: high

depends_on:
  - TASK_014_Create_PopularSearch_model

source_reference: .ai/plans/02/Search Autocomplete/plan.md
source_section: T5: Create popular_search Service

description: >
  Create increment_popular_search and get_popular_suggestions functions
  in apps/search/services/popular_search.py.

goals:
  - Track popular search queries atomically
  - Get popular suggestions matching prefix
  - Filter by minimum hit count (10)

files:
  - path: src/backend/apps/search/services/popular_search.py

    targets:
      - type: function
        name: increment_popular_search

      - type: function
        name: get_popular_suggestions

changes:
  - action: add_top_level

    description: >
      Create popular_search.py with increment and suggestion functions.

    code_hint: |
      def increment_popular_search(query: str) -> None: ...
      def get_popular_suggestions(prefix: str, limit: int = 5) -> list[dict]: ...

acceptance_criteria:
  - Both functions created in services directory
  - Atomic increment using F() expression
  - Normalized query matching implemented
  - Type checking passes
  - Lint check passes

risk_level: medium
risk_mitigation: >
  Service isolated; can be tested independently.
  Rate limiting prevents abuse.