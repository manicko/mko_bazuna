id: task_002_fix_query_translator_timeout

title: Implement real 500ms timeout in query translation with safe fallback

priority: high

status: blocked

blocked_by:
  - task_001_research_query_translator_timeout

depends_on:
  - task_001_research_query_translator_timeout

source_reference: .ai/plans/architecture_testing_plan.md
source_section: "Part 7 — Query Translation Pipeline Resilience (scenarios P7.1–P7.6, CRITICAL finding)"
source_file: src/backend/apps/search/services/query_translator.py

description: >
  Apply the research outcome from TASK_001: make `TRANSLATION_TIMEOUT_SECONDS`
  actually enforce a hard ~500ms timeout around the network translation call,
  falling back to the original (Bosnian) query on timeout/exception. Must not be
  swallowed by `lru_cache`. Search SLO (<2s) must be preserved.

goals:
  - enforce real 500ms timeout on the translation fetch
  - preserve fallback to original query on timeout or RequestException
  - keep `lru_cache` semantics (cache resolved translation; timeout only the fetch)
  - keep `invalidate_translation_cache` working

files:
  - path: src/backend/apps/search/services/query_translator.py
    targets:
      - type: function
        name: translate_query_bs_to_ru
      - type: function
        name: translate_cached
      - type: constant
        name: TRANSLATION_TIMEOUT_SECONDS
    semantic_anchors:
      insert_after:
        type: function_call
        value: translate_cached
      insert_before:
        type: return_statement

changes:
  - action: add_code
    description: >
      Wrap the blocking translation call in a bounded executor / async wait_for
      (mechanism per TASK_001 research) so that exceeding TRANSLATION_TIMEOUT_SECONDS
      raises and triggers the existing fallback return of the original query.
    code_hint: |
      # inside translate_query_bs_to_ru, replace direct translate_cached(query) with a
      # timeout-bounded call; on TimeoutError/RequestException return `query` unchanged.

acceptance_criteria:
  - simulated >500ms network delay returns original query within ~0.5s
  - normal success path still caches and returns Russian text
  - RequestException still falls back to original query (no 500)
  - lru_cache still effective for repeated identical queries
  - search p95 < 2s with translation enabled (Part 12.5 contract)
