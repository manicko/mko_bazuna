id: task_031_phase1_auto_moderation

title: Auto-moderation service

priority: high

depends_on:
  - task_022_phase1_core_models
  - task_025_phase1_moderation_analytics_models

source_reference: .ai/plans/01_detailed_plan_publish_discover.md
source_section: Task 10 — Auto-Moderation Service

description: >
  Single automatic gate before publish (decision A / US-A10). Caches ModerationCriteria 5 min.

goals:
  - reads ModerationCriteria singleton (cached 5 min)
  - validates title/description lengths, price_required, photo count, banned_words (case-insensitive), max_ads_per_user, duplicate-title via difflib.ratio
  - on fail: moderation_failed_at, ON_MODERATION_FAILED, ModeratorActionLog (auto), generic error to bot
  - on pass: PUBLISHED, published_at set, AnalyticsEvent(AD_PUBLISHED)
  - pytest covers each rule

files:
  - path: src/backend/apps/moderation/services/auto_moderation.py
    targets:
      - type: module
        name: apps.moderation.services.auto_moderation

changes:
  - action: add_code
    description: Implement auto_moderation.check(ad) + tests.

acceptance_criteria:
  - all 8 criteria validated
  - duplicate-title uses difflib.ratio >= threshold
  - fail sets moderation_failed_at + ON_MODERATION_FAILED + log; no specific reason to seller
  - pass sets PUBLISHED + published_at + AnalyticsEvent
  - pytest covers each rule
