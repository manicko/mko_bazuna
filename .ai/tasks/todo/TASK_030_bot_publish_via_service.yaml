id: task_030_bot_publish_via_service

title: Route bot publish through shared auto_moderate/set_published (AD-001, QLT-001, QLT-003)

priority: high

depends_on:
  - task_017_atomic_domain_writes
  - task_024_draft_photo_cleanup

source_reference: .ai/audit/99-validation/05-ad-lifecycle-validated-findings.md
source_section: "AD-001"
source_reference_2: .ai/audit/99-validation/10-code-quality-validated-findings.md
source_section_2: "QLT-001 / QLT-003"

description: >
  update_ad_and_moderate() re-implements the auto-moderation gate inline,
  omitting banned_words and duplicate_title checks and bypassing
  ModeratorActionLog, and records AnalyticsEvent with .value instead of the
  enum member. Replace the inline logic with a call to the shared
  auto_moderate(ad) / set_published(ad) after persisting the translated ad +
  images. Keep the handler a thin adapter. This also resolves QLT-003 (enum
  member) automatically since analytics moves into _pass_moderation.

goals:
  - identical gate across bot and web paths
  - complete audit trail (ModeratorActionLog) for bot ads
  - consistent max_ads_per_user counting

files:
  - path: src/telegram_bot/handlers/ad_create.py
    targets:
      - type: function
        name: update_ad_and_moderate
    semantic_anchors:
      insert_before:
        type: statement
        value: "inline validation + status transition"

changes:
  - action: replace
    description: >
      Delegate to auto_moderate(ad)/set_published(ad); remove duplicated
      validation block and direct AnalyticsEvent creation.

acceptance_criteria:
  - bot-published ads pass banned_words + duplicate_title checks
  - ModeratorActionLog entry written for bot ads
  - analytics event uses enum member (not .value)
  - max_ads_per_user counting matches web path
