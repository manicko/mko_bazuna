id: task_013
title: Update Templates for Localized Content

priority: medium
depends_on:
  - task_003
  - task_007

# ── Plan/Audit report source ──
source_reference: .ai\plans\i18n\plan.md
source_section: Task 2.5 — Update Templates for Localized Content

description: >
  Update templates to use localized ad content via get_title() and get_description()
  methods. Replace {{ ad.title }} with {{ ad.get_title(request.LANGUAGE_CODE) }}.

files:
  - path: src/backend/templates/ads/partials/ad_list.html

    targets:
      - type: template
        name: ad_list.html

  - path: src/backend/templates/ads/detail.html

    targets:
      - type: template
        name: detail.html

    semantic_anchors:
      insert_after:
        type: variable
        value: ad.title

      insert_after:
        type: variable
        value: ad.description

    changes:
      - action: replace
        description: >
          Replace direct field access with localized getter calls:
          - {{ ad.title }} → {{ ad.get_title(request.LANGUAGE_CODE) }}
          - {{ ad.description }} → {{ ad.get_description(request.LANGUAGE_CODE) }}

    acceptance_criteria:
      - Templates display localized content correctly
      - Fallback to Russian works for missing translations
      - uv run pytest verifies template rendering
      - Visual check confirms localized text display