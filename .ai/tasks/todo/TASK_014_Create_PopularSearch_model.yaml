id: TASK_014_Create_PopularSearch_model

title: Create PopularSearch model for autocomplete

priority: high

source_reference: .ai/plans/02/Search Autocomplete/plan.md
source_section: T1: Create PopularSearch Model

description: >
  Create PopularSearch model in apps/search/models.py to store popular
  search queries for autocomplete suggestions.

goals:
  - Track popular search queries
  - Enable autocomplete from popular searches
  - Support hit count and last_seen tracking

files:
  - path: src/backend/apps/search/models.py

    targets:
      - type: module
        name: models

    semantic_anchors:
      insert_position:
        type: module
        value: end

changes:
  - action: add_top_level

    description: >
      Create apps/search/models.py and add PopularSearch model.

    code_hint: |
      # New file: apps/search/models.py
      from django.db import models
      
      class PopularSearch(models.Model):
          query = models.CharField(max_length=200, db_index=True)
          query_normalized = models.CharField(max_length=200, db_index=True)
          hit_count = models.PositiveIntegerField(default=1)
          last_seen = models.DateTimeField(auto_now=True)
      
          class Meta:
              db_table = "popular_searches"

acceptance_criteria:
  - apps/search/models.py created
  - PopularSearch model defined
  - Fields match specification
  - Type checking passes on models.py
  - Lint check passes on models.py

risk_level: low
risk_mitigation: >
  New model; no existing code affected.