# Task brief — Plan 003 BLOCK A
# Enable safe browser caching of media responses: Cache-Control: public, max-age=86400
# (no immutable, since image keys are UUID/random-based, not content-addressed).

id: task_003_a_media_cache_control

title: Block A — media_gate 200 responses use Cache-Control max-age=86400

priority: high

depends_on:
  - task_003_c2_media_gate_svg_429

source_reference: .ai/plans/001-media-rate-limit-remediation.md
source_section: "§2 — Work Block A"
source_plan: .ai/plans/001-media-rate-limit-remediation.md
source_blocks:
  - "BLOCK A — Enable safe client-side caching of media responses"

description: >
  Currently media_gate sets Cache-Control: no-cache (DEBUG) / no-store (prod) on
  200 responses, forcing the browser to re-request all 24 thumbnails on every HTMX
  sort — exhausting the rate-limit budget in ~2.5 page loads. This block changes
  the Cache-Control to `public, max-age=86400` (24h) on all four serving paths
  (staff×DEBUG/prod, non-staff×DEBUG/prod). With browser caching, sorts within the
  24h window produce ZERO new requests, so the rate-limit budget is only consumed
  on the first page load within the cache window.

  The `immutable` directive is deliberately NOT used: image keys are UUID v4 or
  fixed seed filenames, NOT content-addressed. A seed image regeneration with
  WriteMode.REPLACE overwrites file bytes at the same URL; `immutable` would
  serve the stale cached version. `max-age=86400` allows natural revalidation
  after the TTL expires.

goals:
  - 200 media responses from media_gate use Cache-Control: public, max-age=86400
  - no `immutable` directive in any Cache-Control header
  - both DEBUG (FileResponse) and prod (X-Accel-Redirect) paths updated
  - both staff and non-staff paths updated
  - existing tests updated to assert new Cache-Control value
  - i18n completeness gate still passes

files:
  - path: src/backend/apps/ads/views/listings.py
    targets:
      - type: module_constant
        name: _MEDIA_CACHE_CONTROL_200
      - type: function
        name: media_gate
    semantic_anchors:
      insert_after:
        type: module_constant
        value: "_MEDIA_RATE_LIMIT_KEY_PATTERN"

changes:
  - action: add_constant
    description: >
      Add `_MEDIA_CACHE_CONTROL_200: Final[str] = "public, max-age=86400"` near
      line 64, replacing the 4 inline Cache-Control assignments.
    code_hint: |
      _MEDIA_CACHE_CONTROL_200: Final[str] = "public, max-age=86400"

  - action: replace_value
    description: >
      Replace all 4 Cache-Control assignments in media_gate's serving paths:
      line 226 (staff DEBUG): "no-cache" → _MEDIA_CACHE_CONTROL_200
      line 230 (staff prod): "no-store" → _MEDIA_CACHE_CONTROL_200
      line 249 (non-staff DEBUG): "no-cache" → _MEDIA_CACHE_CONTROL_200
      line 254 (non-staff prod): "no-store" → _MEDIA_CACHE_CONTROL_200

acceptance_criteria:
  - media_gate 200 responses have Cache-Control: public, max-age=86400
  - Cache-Control does NOT contain immutable
  - both DEBUG (FileResponse) and prod (X-Accel-Redirect) paths set the new value
  - staff and non-staff paths both set the new value
  - existing TestMediaGateCacheControl tests updated and pass
  - test_i18n_completeness.py still passes

test_contract:
  how: >
    Update TestMediaGateCacheControl (test_media_security.py:718-852) to assert
    Cache-Control contains max-age=86400 on 200 responses. Add a test asserting
    no `immutable` directive. Update cache-invalidation test docstrings/asserts.
  commands:
    - "$dc = 'docker compose --project-name mko-bazuna-test --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml'"
    - "$dc run --rm -e PYTEST_OPTS='src/backend/apps/ads/tests/test_media_security.py::TestMediaGateCacheControl --tb=short' test"
    - "$dc run --rm -e PYTEST_OPTS='src/backend/apps/core/tests/test_i18n_completeness.py --tb=short' test"
    - "uv run ruff check src/backend/apps/ads/views/listings.py"
    - "uv run basedpyright src/backend/apps/ads/views/listings.py"
  assertion_level: >
    200 responses are cacheable for 24h; no immutable directive; tests verify
    the exact Cache-Control string and absence of immutable.

binding_constraints:
  - must NOT use `immutable` (UUID keys are not content-addressed)
  - must use `public` (served via nginx with no auth context)
  - max-age=86400 (24h) — exact value
  - do NOT modify the rate-limit guard, DB lookup, or 403/404 paths
  - must depend on C-2 (same function; A touches the 200 paths, C-2 touched the 429 path)
  - no .ai/audit/** changes

rollback: >
  Revert the 4 Cache-Control assignments and the constant in listings.py, and
  revert test updates. The serving logic is unchanged.

dod:
  - _MEDIA_CACHE_CONTROL_200 constant added
  - all 4 serving paths use the constant
  - Cache-Control: public, max-age=86400 on 200 responses (no immutable)
  - existing tests updated, new test added
  - ruff + basedpyright clean
  - i18n gate green
  - git add <specific-files> && git commit -m "feat(media): enable max-age=86400 caching on image responses"

agents:
  auditor: no
  researcher: no
  planner: no
  implementor: yes
  validator: yes
  docs_specialist: no
