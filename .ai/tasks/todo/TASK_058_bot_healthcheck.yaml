id: task_058_bot_healthcheck

title: Add bot container healthcheck / liveness signal (EXT-010)

priority: low

depends_on:
  - task_010_web_restart_policy

source_reference: .ai/audit/99-validation/09-external-api-validated-findings.md
source_section: "EXT-010"

description: >
  The bot has no healthcheck and translation failures are only logged (no
  metric), so a stalled event loop or sustained translator outage is invisible.
  Add a lightweight liveness signal (periodic log line or liveness file) and a
  compose healthcheck for the bot service; add a failure counter for translation
  (can build on task_054's circuit-breaker).

goals:
  - orchestrator can detect a stalled bot
  - translation outages observable

files:
  - path: docker-compose.yml
    targets:
      - type: service
        name: bot
    semantic_anchors:
      insert_after:
        type: key
        value: "bot: restart: unless-stopped"

  - path: src/telegram_bot/main.py

changes:
  - action: add_code
    description: Add bot healthcheck in compose + periodic liveness signal in main.

acceptance_criteria:
  - compose bot service has a healthcheck
  - liveness signal emitted by the bot
