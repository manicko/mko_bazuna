# Task brief — Plan 003 BLOCK C-1
# Make 429 responses RFC-compliant and never cached. Adds retry_after/body params
# to rate_limited_response (backward-compatible), sets Cache-Control: no-store
# on all 429 responses, and Retry-After when requested.

id: task_003_c1_rate_limited_response

title: Block C-1 — rate_limited_response gains Retry-After + no-store + optional body

priority: high

depends_on: []

source_reference: .ai/plans/001-media-rate-limit-remediation.md
source_section: "§4 — Work Block C (Task C-1)"
source_plan: .ai/plans/001-media-rate-limit-remediation.md
source_blocks:
  - "BLOCK C-1 — Add Retry-After and no-store to rate_limited_response"

description: >
  The shared 429 builder `rate_limited_response` currently returns a bare
  `HttpResponse(status=429)` (HTML) or `JsonResponse` (JSON) with no Cache-Control
  and no Retry-After header. This block adds three backward-compatible changes:
  (1) `Cache-Control: no-store` on ALL 429 responses so error responses are never
  cached, (2) an optional `retry_after: int | None` parameter that sets the
  `Retry-After` HTTP header (RFC 9110 §15.4.5), and (3) an optional `body: str |
  None` parameter that sets the response content. All 10 existing callers (8
  production + 2 test) call with only `json=True/False` or no args, so the new
  params default to `None` and behavior is unchanged for them — except the
  unconditional `no-store` addition.

goals:
  - 429 responses carry Cache-Control: no-store (never cached)
  - 429 responses carry Retry-After when retry_after param is provided
  - 429 responses carry a custom body when body param is provided
  - all 10 existing callers compile and behave unchanged

files:
  - path: src/backend/apps/core/utils/rate_limit_response.py
    targets:
      - type: module_constant
        name: RETRY_AFTER_HEADER
      - type: function
        name: rate_limited_response
        method: overload  # two @overload stubs + one implementation
    semantic_anchors:
      insert_before:
        type: return_statement
        value: "return HttpResponse(status=429)"

changes:
  - action: add_constant
    description: >
      Add module-level `RETRY_AFTER_HEADER: Final[str] = "Retry-After"` constant.
    code_hint: |
      RETRY_AFTER_HEADER: Final[str] = "Retry-After"

  - action: modify_signature
    description: >
      Add `retry_after: int | None = None` and `body: str | None = None`
      keyword-only parameters to both @overload stubs and the implementation.
    code_hint: |
      def rate_limited_response(
          *,
          json: bool = True,
          retry_after: int | None = None,
          body: str | None = None,
      ) -> HttpResponse:

  - action: modify_body
    description: >
      In the implementation body: instead of returning early, build the response
      (JsonResponse or HttpResponse), unconditionally set Cache-Control: no-store,
      set Retry-After header if retry_after is not None, set response.content if
      body is not None, then return.
    code_hint: |
      if json:
          response = JsonResponse({"error": RATE_LIMIT_ERROR}, status=429)
      else:
          response = HttpResponse(status=429)
      response["Cache-Control"] = "no-store"
      if retry_after is not None:
          response[RETRY_AFTER_HEADER] = str(retry_after)
      if body is not None:
          response.content = body
      return response

acceptance_criteria:
  - 429 JSON response has Cache-Control: no-store
  - 429 HTML response has Cache-Control: no-store
  - 429 response has Retry-After header when retry_after param is provided
  - 429 response has custom body when body param is provided
  - existing callers (rate_limited_response() and rate_limited_response(json=False)) produce no Retry-After header, body is empty/unchanged, Cache-Control is no-store
  - existing tests in test_rate_limit_budget.py pass (TestOneResponseShape)
  - ruff check passes
  - basedpyright passes

test_contract:
  how: >
    Update TestOneResponseShape in test_rate_limit_budget.py to assert
    Cache-Control: no-store on both 429 shapes. Add tests for retry_after and
    body params. Verify backward compatibility (no params = no Retry-After,
    no body change).
  commands:
    - "$dc = 'docker compose --project-name mko-bazuna-test --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml'"
    - "$dc run --rm -e PYTEST_OPTS='src/backend/apps/core/tests/test_rate_limit_budget.py --tb=short' test"
    - "uv run ruff check src/backend/apps/core/utils/rate_limit_response.py"
    - "uv run basedpyright src/backend/apps/core/utils/rate_limit_response.py"
  assertion_level: >
    429 responses are never cached; Retry-After is set only when requested;
    all existing callers unchanged.

binding_constraints:
  - params must be keyword-only (matching existing *, json style)
  - params must default to None (backward compatible)
  - use StrEnum or Final[str] for the header name constant, not a bare string
  - do NOT change behavior for callers that don't pass the new params (except no-store addition)
  - no .ai/audit/** changes

rollback: >
  Revert the single-file edit to rate_limit_response.py and its test updates.
  The change is additive and isolated to one module.

dod:
  - rate_limited_response signature has retry_after and body params (None defaults)
  - 429 JSON/HTML responses have Cache-Control: no-store
  - Retry-After header set when retry_after provided
  - body set when body provided
  - all existing tests pass
  - new tests pass
  - ruff + basedpyright clean
  - git add <specific-files> && git commit -m "chore(rate_limit): 429 responses carry Retry-After + no-store, optional body"

agents:
  auditor: no
  researcher: no
  planner: no
  implementor: yes
  validator: yes
  docs_specialist: no
