id: TASK_022_Add_telegram_premium_to_User

title: Add telegram_premium field to User model

priority: medium

source_reference: .ai/plans/02/Trust Signals System/plan.md
source_section: T2: Add telegram_premium to User

description: >
  Add telegram_premium BooleanField to User model to track Telegram Premium
  subscription status for trust scoring.

goals:
  - Track Telegram Premium subscription
  - Enable auto-verification for premium users
  - Place after ads_auto_publish field

files:
  - path: src/backend/apps/users/models.py

    targets:
      - type: class
        name: User

    semantic_anchors:
      insert_after:
        type: field
        name: ads_auto_publish

changes:
  - action: add_field

    description: >
      Add telegram_premium BooleanField to User model.

    code_hint: |
      telegram_premium = models.BooleanField(
          default=False,
          help_text="User has Telegram Premium subscription",
      )

acceptance_criteria:
  - telegram_premium field added to User
  - Field placed after ads_auto_publish
  - Type checking passes on models.py
  - Lint check passes on models.py

risk_level: medium
risk_mitigation: >
  Boolean field defaults to False; no data migration needed.
  Can be set via bot on /start handler.