id: TASK_004_Extend_AnalyticsEventType_trust_moderation

title: Extend AnalyticsEventType with trust and moderation events

priority: high

source_reference: .ai/plans/02/Analytics Improvements/plan.md
source_section: T1: Extend AnalyticsEventType Enum

depends_on:
  - TASK_002_Add_AD_VIEWED_to_AnalyticsEventType

description: >
  Add trust/moderation event types to AnalyticsEventType StrEnum for trust
  scoring and moderation analytics support.

goals:
  - Add SELLER_VERIFIED, TRUST_LEVEL_UPDATED events
  - Add MODERATION_APPROVED, MODERATION_REJECTED, MODERATION_FLAGGED events
  - Add DASHBOARD_VIEWED, AD_EDITED, AD_REACTIVATED events
  - Add CONTACT_COMPLETED, AD_REPORTED events

files:
  - path: src/backend/apps/core/enums.py

    targets:
      - type: class
        name: AnalyticsEventType

    semantic_anchors:
      insert_after:
        type: field
        name: CONTACT_INITIATED

      insert_before:
        type: class
        name: ModeratorActionType

changes:
  - action: add_field

    description: >
      Add additional enum values to AnalyticsEventType for trust and moderation tracking.

    code_hint: |
      SELLER_VERIFIED = "seller_verified"
      TRUST_LEVEL_UPDATED = "trust_level_updated"
      MODERATION_APPROVED = "moderation_approved"
      MODERATION_REJECTED = "moderation_rejected"
      MODERATION_FLAGGED = "moderation_flagged"
      DASHBOARD_VIEWED = "dashboard_viewed"
      AD_EDITED = "ad_edited"
      AD_REACTIVATED = "ad_reactivated"
      CONTACT_COMPLETED = "contact_completed"
      AD_REPORTED = "ad_reported"

acceptance_criteria:
  - All 10 trust/moderation events added to AnalyticsEventType
  - Type checking passes on enums.py
  - Lint check passes on enums.py
  - Changes are additive (backward compatible)

risk_level: low
risk_mitigation: >
  Additive change only; existing enum values unchanged.
  No breaking changes to existing code.