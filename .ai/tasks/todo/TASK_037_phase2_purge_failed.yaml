    description: Implement purge_failed_ads command wrapping advisory_lock(6).

acceptance_criteria:
  - queries only ON_MODERATION_FAILED + 7-day window
  - --dry-run prints count without deleting
  - uses IX_ads_purge_failed
  - imports advisory_lock from apps.core.utils.advisory_lock (lock id 6)
  - idempotent; logs via logger (no print)
