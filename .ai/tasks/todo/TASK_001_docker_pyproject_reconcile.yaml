id: task_001_docker_pyproject_reconcile

title: pyproject.toml reconciliation + psycopg3/Django 5.2 verification

priority: high

depends_on: []

source_reference: .ai/plans/00_detailed_plan_docker_environment.md
source_section: Task 0 — pyproject.toml Reconciliation + psycopg3/Django 5.2 Verification

description: >
  Fix critical version contradictions in pyproject.toml to enable a buildable Docker
  environment. Align the manifest with the canonical dependency set in docs/wiki/packages.md.

goals:
  - 'requires-python = ">=3.14,<3.15" (mirrors aiogram ceiling)'
  - django>=5.2.16,<6.0 (LTS 5.2, upper bound blocks 6.0 drift)
  - psycopg[binary]>=3.2.0 (replace psycopg2-binary)
  - remove psycopg[pool] (YAGNI; PgBouncer is the pooler)
  - all spec deps present with canonical versions
  - no direct python-dotenv (transitive via django-environ)
  - 'pytest-asyncio asyncio_mode="strict" + minversion="8.4"'
  - regenerate uv.lock

files:
  - path: pyproject.toml
    targets:
      - type: file
        name: pyproject.toml
    semantic_anchors:
      insert_after:
        type: section
        value: "[project]"
  - path: uv.lock
    targets:
      - type: file
        name: uv.lock

changes:
  - action: edit_content
    description: >
      Set requires-python, django, psycopg[binary], drop psycopg[pool] and psycopg2-binary,
      add django-environ/django-mptt/django-filter/aiogram/deep-translator/django-tailwind/
      django-htmx/pillow at canonical floors, remove direct python-dotenv, add pytest asyncio_mode.

acceptance_criteria:
  - 'requires-python = ">=3.14,<3.15"'
  - django>=5.2.16,<6.0
  - psycopg[binary]>=3.2.0 present; psycopg2-binary absent
  - psycopg[pool] absent
  - python-dotenv NOT declared directly
  - '"[tool.pytest.ini_options]" has asyncio_mode="strict" and minversion="8.4"'
  - uv.lock regenerated
  - '"uv run python -c \"import psycopg; print(psycopg.__version__)\"" outputs >=3.2.0'
  - '"uv run python -c \"import django; print(django.VERSION)\"" outputs 5.2.x'
  - '"uv run basedpyright src/" passes without psycopg2 errors'
