id: task_008_invalidate_tokens_on_withdraw

title: Invalidate active LoginTokens on consent withdrawal + test

priority: high

status: pending

depends_on: []

source_reference: .ai/plans/architecture_testing_plan.md
source_section: "Part 11 — Consent State Machine & PII Erasure (P11.5 HIGH risk); Appendix B mandatory finding #5"
source_file: src/backend/apps/users/services/deletion.py

description: >
  `withdraw_consent` nulls PII (telegram_id, username) immediately and soft-deletes
  ads, but does NOT invalidate the user's active `LoginToken`s. A still-valid consumed
  token could theoretically re-link the (now NULLed) user after withdrawal. Invalidate
  active login tokens on withdraw. Add a test asserting tokens are invalidated and a
  second claim fails.

  This is a risky change (modifies auth-session lifecycle / potential hidden consumers
  of LoginToken). Keep it inside `withdraw_consent` (transaction scope already local).

goals:
  - invalidate/delete active LoginTokens for the user inside withdraw_consent
  - keep nulling of telegram_id/username and soft-delete of ads
  - add test: token created before withdraw cannot be claimed after withdraw

files:
  - path: src/backend/apps/users/services/deletion.py
    targets:
      - type: function
        name: withdraw_consent
    semantic_anchors:
      insert_after:
        type: function_call
        value: soft_delete_user_ads
      insert_before:
        type: return_statement

  - path: src/backend/apps/users/tests
    targets:
      - type: test_file
        name: test_deletion.py
    semantic_anchors:
      insert_after:
        type: function_call
        value: withdraw_consent
      insert_before:
        type: return_statement

changes:
  - action: add_code
    description: >
      Within `withdraw_consent`, after nulling PII and before/after soft-delete, delete
      or invalidate the user's LoginToken rows (e.g. `LoginToken.objects.filter(
      user=user).delete()` or set consumed_at/expires_at in the past). Choose the
      mechanism that matches the existing claim logic in telegram_bot/handlers/login.py.
    code_hint: |
      # inside withdraw_consent, after user.save(...) and soft_delete_user_ads(user):
      LoginToken.objects.filter(user=user).delete()

acceptance_criteria:
  - after withdraw_consent, no active LoginToken for the user remains claimable
  - a second claim attempt on a pre-withdraw token returns None (P8.2 semantics)
  - telegram_id/username still nulled; ads still soft-deleted (P11.2/P11.3)
  - DECLINE path (decline_consent) is unaffected and does NOT invalidate tokens (P11.1)
  - re-registration-blocked-within-30d behavior preserved (P11.7)
