id: task_028_phase1_settings_security

title: Settings security configuration (TLS-ready) contribution

priority: medium

depends_on:
  - task_021_phase1_structure_enums
  - task_006_docker_settings_package

source_reference: .ai/plans/01_detailed_plan_publish_discover.md
source_section: Task 7 — Settings Security Configuration (TLS-ready)

description: >
  Contribute production-safe Django settings to the Docker plan's settings/base.py (NOT a new
  settings module). PgBouncer async safety via CONN_MAX_AGE=0 + prepare_threshold=None.

goals:
  - SESSION_COOKIE_SECURE, CSRF_COOKIE_SECURE, SECURE_SSL_REDIRECT, SECURE_PROXY_SSL_HEADER, USE_X_FORWARDED_HOST
  - CONN_MAX_AGE=0; OPTIONS prepare_threshold=None
  - DEFAULT_FILE_STORAGE built-in FileSystemStorage via STORAGES (local MEDIA_ROOT)
  - no recreation of settings.py (owned by Docker plan)

files:
  - path: src/backend/config/settings/base.py
    targets:
      - type: file
        name: src/backend/config/settings/base.py

changes:
  - action: edit_content
    description: Add security + storage settings to base.py.

acceptance_criteria:
  - all listed security settings present in base.py
  - CONN_MAX_AGE=0 and prepare_threshold=None set
  - STORAGES uses FileSystemStorage for media (S3 swap later via contract)
  - no new settings module created
