id: task_023_phase1_categories_locations

title: Categories (MPTT) + Locations models with JSONB i18n

priority: high

depends_on:
  - task_021_phase1_structure_enums

source_reference: .ai/plans/01_detailed_plan_publish_discover.md
source_section: Task 3 — Categories + Locations Models (MPTT + JSONB i18n)

description: >
  Reference data with hierarchy (django-mptt single source of truth) and i18n name support.

goals:
  - categories model: name (ru), name_i18n (JSONB), slug, MPTT fields, is_active
  - locations model: name (ru), name_i18n (JSONB), country_code, region, slug
  - get_name(locale) fallback to Russian
  - seed ~50-60 Bosnia cities, ~15-20 categories (recommended tree)

files:
  - path: src/backend/apps/categories/models.py
    targets:
      - type: class
        name: Category
  - path: src/backend/apps/locations/models.py
    targets:
      - type: class
        name: City

changes:
  - action: add_code
    description: Define MPTT category + city models with get_name; seed migration/fixtures.

acceptance_criteria:
  - django-mptt is single source of truth (no denormalized path/level columns)
  - get_name(locale) returns name_i18n[locale] else Russian name
  - seed data loads via migration
  - '"uv run manage.py migrate" applies seed'
