id: task_003_docker_compose_base

title: Base docker-compose.yml + named volumes + migrate service

priority: high

depends_on:
  - task_002_docker_dockerfile

source_reference: .ai/plans/00_detailed_plan_docker_environment.md
source_section: Task 2 — Base docker-compose.yml + Named Volumes + Migrate Service

description: >
  Create the base compose file with shared services, volumes, one-shot advisory-locked migrate
  service, and web/bot/nginx services. Static served by whitenoise (no static_volume); media by
  nginx from media_volume.

goals:
  - omit obsolete version: key
  - services: db, migrate, web, bot, nginx
  - postgres_data + media_volume volumes
  - db healthcheck via pg_isready
  - migrate uses session-scoped pg_advisory_lock(100), idempotent, pre-PgBouncer
  - web/bot depend_on migrate (service_completed_successfully)
  - nginx mounts media_volume ro; web port 8000 not published
  - static served from image (no static_volume)

files:
  - path: docker-compose.yml
    targets:
      - type: file
        name: docker-compose.yml
  - path: docker/entrypoint.sh
    targets:
      - type: file
        name: docker/entrypoint.sh

changes:
  - action: add_code
    description: Write base compose with services and migrate entrypoint logic.

acceptance_criteria:
  - '"docker compose config" validates'
  - '"docker compose up migrate" runs migrations once; second run no-op (lock 100)'
  - nginx mounts media_volume read-only; no static_volume
  - web port 8000 not published to host
