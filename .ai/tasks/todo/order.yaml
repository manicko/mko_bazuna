# Rollout ordering for validated findings across all 11 audit phases.
# Topologically sorted: every `depends_on` entry has a lower task number.
# Research gates (001-005) are prerequisites; implementation tasks blocked by
# them carry `status: blocked` until the research issues a "go" recommendation.
# File-collision chains use `depends_on_previous_task_in_chain` (see task files).

tasks:
