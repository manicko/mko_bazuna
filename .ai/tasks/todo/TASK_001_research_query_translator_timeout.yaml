id: task_001_research_query_translator_timeout

title: Research — hard 500ms timeout + off-request-path for query translation

priority: high

status: pending

type: research

depends_on: []

# ── Plan/Audit source ──
source_reference: .ai/plans/architecture_testing_plan.md
source_section: "Part 7 — Query Translation Pipeline Resilience (P7.6 CRITICAL risk, Appendix B mandatory finding #1)"
source_file: src/backend/apps/search/services/query_translator.py

description: >
  The plan flags a CRITICAL gap: `query_translator.py` defines
  `TRANSLATION_TIMEOUT_SECONDS = 0.5` but never applies it. `translate_cached`
  calls `GoogleTranslator.translate` synchronously with no socket/async timeout,
  so a slow network can block the gunicorn sync worker indefinitely and break the
  <2s search SLO (Part 12.5). The plan also notes translation runs synchronously
  inside the request (web is sync WSGI), which under burst serializes every worker
  on Google.

  This is a RISKY change (modifies the web request critical path, touches network
  I/O contract, possible behavior change under burst). A research gate must assess
  the blast radius before implementation.

goals:
  - enumerate all call sites of `translate_query_bs_to_ru` / `translate_cached`
    (search/views/search.py and any others) and their sync/async context
  - determine the correct timeout mechanism that works under sync gunicorn WSGI:
    either `concurrent.futures.ThreadPoolExecutor` + `future.result(timeout=0.5)`
    or `asyncio.wait_for` invoked from a sync->async bridge, or a socket-level
    transport timeout on the requests session used by deep-translator
  - assess whether translation should be moved off the request critical path
    (process-wide async pool / cached-ahead) vs. a simple in-request timeout
  - evaluate impact on the `lru_cache` (translate_cached) interaction with the
    timeout wrapper (timeout must wrap the cached call, not be cached away)
  - produce a go / go-with-changes / no-go recommendation and the exact insertion
    point (function: `translate_query_bs_to_ru`, symbol: `translate_cached`)

files:
  - path: src/backend/apps/search/services/query_translator.py
    targets:
      - type: function
        name: translate_query_bs_to_ru
      - type: function
        name: translate_cached
      - type: constant
        name: TRANSLATION_TIMEOUT_SECONDS
    semantic_anchors:
      insert_after:
        type: function_call
        value: translate_cached
      insert_before:
        type: return_statement

  - path: src/backend/apps/search/views/search.py
    targets:
      - type: function
        name: search
    semantic_anchors:
      call_site:
        type: function_call
        value: translate_query_bs_to_ru

risks:
  - CRITICAL: no real timeout => indefinite worker block (broken SLO)
  - MEDIUM: translation is synchronous inside the request path (burst serializes workers)
  - MEDIUM: timeout wrapper must not be swallowed by lru_cache

research_steps:
  - grep the codebase for every import/call of `translate_query_bs_to_ru` and `translate_cached`
  - inspect deep-translator's `GoogleTranslator` to confirm no default socket timeout
  - prototype `ThreadPoolExecutor.submit(...).result(timeout=0.5)` inside `translate_query_bs_to_ru`
  - measure that a simulated 2s network delay returns fallback within ~0.5s (unit, mocked)
  - confirm `lru_cache` still functions (cache the translated result, timeout only the fetch)

deliverable:
  - go / go-with-changes / no-go recommendation
  - exact recommended insertion point and mechanism
  - list of call sites that need no change (vs. any that do)
  - note whether a separate off-request-path task is required

blocked_by: []
