id: task_055_hsts_headers

title: Add HSTS + server-level security headers (EXT-006)

priority: medium

depends_on:
  - task_044_media_access_gate

source_reference: .ai/audit/99-validation/09-external-api-validated-findings.md
source_section: "EXT-006"

description: >
  nginx terminates TLS but sets no HSTS and applies nosniff/frame-deny/CSP only
  inside location /media/. Add a server-level Strict-Transport-Security header
  and nosniff/frame-deny at the server level (or set SECURE_HSTS_SECONDS in
  Django) so HTML responses are hardened, keeping the strict media CSP.

goals:
  - HSTS emitted to browsers
  - security headers apply to HTML, not just /media/

files:
  - path: docker/nginx/nginx.conf
    targets:
      - type: server
        name: nginx server block
    semantic_anchors:
      insert_after:
        type: directive
        value: "listen 443 ssl;"

  - path: src/backend/config/settings/base.py
  - path: src/backend/config/settings/prod.py

changes:
  - action: add_code
    description: Add server-level HSTS + nosniff/frame-deny; optionally set SECURE_HSTS_SECONDS.

acceptance_criteria:
  - HSTS header present on HTML responses
  - security headers no longer confined to /media/
