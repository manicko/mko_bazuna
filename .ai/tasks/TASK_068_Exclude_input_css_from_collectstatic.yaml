id: TASK_068_Exclude_input_css_from_collectstatic

title: Exclude input.css from collectstatic post-processing (Docker build fix)

priority: high

type: implementation

depends_on:
  - TASK_061_Migrate_input_css_v4_native_syntax

source_reference: .ai/plans/08_design-system-css-pipeline_plan.md
source_section: VFY-002 — Docker build fails (collectstatic @import resolution)

description: >
  The v4-native @import "tailwindcss" directive in input.css is a real CSS
  @import rule. Django's collectstatic with CompressedManifestStaticFilesStorage
  (whitenoise) post-processes CSS files and attempts to resolve @import rules
  as relative file references, producing a MissingFileError for
  'theme/css/tailwindcss'. The v3 @tailwind directives were not standard CSS
  @import rules so this was not an issue before.

  IMPORTANT: ignore_patterns on the storage class is a NO-OP in Django 5.2.
  It is an AppConfig-level mechanism (StaticFilesConfig) consumed by the
  collectstatic command during file discovery, not during post_process.
  The correct fix is to override post_process and filter input.css out
  before the parent class processes CSS @import/url() references.

  Also: a stale duplicate theme package at src/backend/theme/ (created in
  commit 15c63de, never updated) shadowed the real src/theme/ package due to
  PYTHONPATH ordering (/app/src/backend:/app/src). The stale directory lacked
  storage.py, causing ModuleNotFoundError. This has been fixed by deleting the
  stale directory and reordering PYTHONPATH to /app/src:/app/src/backend.

goals:
  - Fix Docker build (collectstatic post_process phase)
  - input.css preserved for Tailwind CLI regeneration
  - output.css remains fully functional and class-complete
  - No changes to Dockerfile or template references

files:
  - path: src/theme/storage.py

    targets:
      - type: class
        name: ThemeStaticFilesStorage

      semantic_anchors:
        class_inherits:
          parent: CompressedManifestStaticFilesStorage

  - path: src/backend/config/settings/base.py

    targets:
      - type: setting
        name: STORAGES

      semantic_anchors:
        dict_key_replace:
          key: "staticfiles"
          backend_value: "whitenoise.storage.CompressedManifestStaticFilesStorage"
          new_backend_value: "theme.storage.ThemeStaticFilesStorage"

  - path: src/backend/config/settings/base.py

    targets:
      - type: setting
        name: STATICFILES_DIRS

      semantic_anchors:
        remove_from_list:
          item: "BASE_DIR / \"theme\" / \"static\""

      description: >
        Remove redundant src/theme/static from STATICFILES_DIRS. The theme app
        is in INSTALLED_APPS, so AppDirectoriesFinder already discovers its
        static directory. Keeping it in STATICFILES_DIRS caused duplicate file
        collection warnings during collectstatic.

  - path: src/backend/config/settings/prod.py

    targets:
      - type: module_attribute
        name: STATICFILES_STORAGE

    semantic_anchors:
      replace_value:
        old: "whitenoise.storage.CompressedManifestStaticFilesStorage"
        new: "theme.storage.ThemeStaticFilesStorage"

changes:

  - action: create_file

    description: >
      Create a custom storage class extending CompressedManifestStaticFilesStorage
      that overrides post_process to filter out input.css before the parent's
      CSS @import/url() rewriting runs. This prevents MissingFileError for
      the @import "tailwindcss" directive in input.css.

    file_path: src/theme/storage.py

    code_hint: |
      import fnmatch
      from whitenoise.storage import CompressedManifestStaticFilesStorage


      class ThemeStaticFilesStorage(CompressedManifestStaticFilesStorage):
          ignore_patterns = ["theme/css/input.css"]

          def post_process(self, paths, content_hashed=False, **kwargs):
              skip_patterns = ["theme/css/input.css"]
              filtered = {
                  name: value
                  for name, value in paths.items()
                  if not any(fnmatch.fnmatch(name, p) for p in skip_patterns)
              }
              yield from super().post_process(
                  filtered, content_hashed=content_hashed, **kwargs
              )

  - action: edit_python

    description: >
      Update STORAGES["staticfiles"]["BACKEND"] in base.py to use the custom
      ThemeStaticFilesStorage class.

    file_path: src/backend/config/settings/base.py

    code_hint: |
      "staticfiles": {
          "BACKEND": "theme.storage.ThemeStaticFilesStorage",
      },

  - action: edit_python

    description: >
      Remove BASE_DIR / "theme" / "static" from STATICFILES_DIRS in base.py
      to eliminate duplicate file collection warnings. The AppDirectoriesFinder
      already discovers the theme app's static directory via INSTALLED_APPS.

    file_path: src/backend/config/settings/base.py

    code_hint: |
      STATICFILES_DIRS = [BASE_DIR.parent / "static"]

  - action: edit_python

    description: >
      Update legacy STATICFILES_STORAGE in prod.py to use the custom class
      for consistency.

    file_path: src/backend/config/settings/prod.py

    code_hint: |
      STATICFILES_STORAGE = "theme.storage.ThemeStaticFilesStorage"

acceptance_criteria:
  - src/theme/storage.py defines ThemeStaticFilesStorage with ignore_patterns
  - STORAGES["staticfiles"]["BACKEND"] points to theme.storage.ThemeStaticFilesStorage
  - prod.py STATICFILES_STORAGE points to theme.storage.ThemeStaticFilesStorage
  - Docker build collectstatic phase succeeds (input.css not post-processed)
  - output.css still contains all 17 acceptance classes (no regression)

risk_level: low

risk_mitigation: >
  The post_process override filters input.css from the paths dict before the
  parent class applies CSS @import/url() rewriting. The file is still collected
  to STATIC_ROOT (it appears in the post_process output as a non-hashed copy),
  but no @import resolution is attempted. No template references input.css;
  only output.css is linked via {% static %}.

  Note: Django's ignore_patterns is an AppConfig-level mechanism (StaticFilesConfig),
  not a storage-class attribute. It is consumed by the collectstatic command during
  file discovery via finders, NOT during post_process. The original TASK-068 plan
  incorrectly assumed ignore_patterns would work on the storage class. A live
  reproduction confirmed it is a no-op — the post_process override is the
  correct approach.
